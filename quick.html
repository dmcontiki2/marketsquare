/* ===========================================================================
   THE SHELF IS BUILT FROM THE TAPS. (David, 11 Sep 2026: "i selected Maths at
   the start and it is showing me other subjects. That should not happen?")
   It should not, and it did: the old builder drew titles from a fixed list per
   category and never read the picks at all. Now every card is composed FROM
   the answers - the subject, the level, the area, the price band - so a card
   that contradicts a tap cannot be generated in the first place.
   ------------------------------------------------------------------------- */
function pickBy(picks,key){ for(var i=0;i<picks.length;i++) if(picks[i].key===key) return picks[i]; return null; }
function numOf(tok){
  var m=String(tok).replace(/\s/g,'').match(/([\d.]+)\s*([km])?/i);
  if(!m) return null;
  var v=parseFloat(m[1]);
  if(m[2]){ var u=m[2].toLowerCase(); v*= (u==='k'?1000:1000000); }
  return v;
}
/* "Under R200" / "R200-R300" / "Over R300" / "R350" -> [lo,hi] */
function bandOf(label){
  if(!label || /quote|ask|free/i.test(label)) return null;
  var nums=(label.match(/R\s?[\d][\d\s.]*[km]?/gi)||[]).map(numOf).filter(function(v){return v!=null;});
  if(!nums.length) return null;
  if(/under|less|below/i.test(label)) return [Math.round(nums[0]*0.55), nums[0]];
  if(/over|more|above|\+/i.test(label)) return [nums[0], Math.round(nums[0]*1.55)];
  if(nums.length>=2) return [nums[0], nums[1]];
  return [nums[0], nums[0]];
}
function tsFloorOf(label){
  if(!label) return 0;
  if(/top rated/i.test(label)) return 90;
  var m=String(label).match(/(\d{2})\s*\+/);
  return m?parseInt(m[1],10):0;
}
function money(v){
  v=Math.round(v);
  if(v>=1000000) return 'R'+(Math.round(v/10000)/100).toFixed(2).replace(/\.?0+$/,'')+'m';
  return 'R'+String(v).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

var DETAIL={
 homehelp:['%y years','own transport','references on file','police cleared','weekends too','contactable today'],
 property:['north facing','secure estate','quiet street','close to schools','recently renovated','big garden'],
 cars:['full service history','one owner','%y years old','low mileage','warranty left','spotless inside'],
 tutors:['%y years teaching','small groups','results on file','online or in person','exam prep','homework help'],
 services:['%y years on the tools','free quote first','after-hours available','police cleared','certified','same-week'],
 collectors:['graded','certificate on file','from a private collection','held %y years','mint','scarce'],
 adventures:['max %y guests','fully guided','all meals','self-drive friendly','sunrise start','family friendly'],
 localmarket:['handmade','collect or delivered','%y in stock','locally made','limited run','gift wrapped']
};
var UNIT={homehelp:' a day',tutors:' an hour',services:'',collectors:'',property:'',cars:'',
          adventures:' pp',localmarket:''};
var FALLBACK_BAND={homehelp:[250,450],tutors:[150,350],services:[350,700],collectors:[900,20000],
  property:[850000,3400000],cars:[120000,550000],adventures:[1200,6000],localmarket:[80,1500]};

CATS.forEach(function(c){
  c.ads=function(picks,narrow){
    narrow=narrow||[];
    var what=pickBy(picks,'what'), where=pickBy(picks,'where');
    var subject=what?what.label:c.name;
    var anchor=where?where.label:LOC.suburb;          /* an explicit area beats the default */

    /* every other tap becomes part of what the card must say */
    var quals=picks.filter(function(p){
      return p.key!=='what' && p.key!=='where' && !bandOf(p.label); }).map(function(p){return p.label;});
    var notes=narrow.filter(function(p){
      return !bandOf(p.label) && !tsFloorOf(p.label); }).map(function(p){return p.label;});

    /* price and trust constraints, from a tap or from a narrowing chip */
    var band=null, floor=0;
    picks.concat(narrow).forEach(function(p){
      var b=bandOf(p.label); if(b) band=b;
      var f=tsFloorOf(p.label); if(f) floor=Math.max(floor,f);
    });
    if(!band) band=FALLBACK_BAND[c.key]||[100,1000];

    var seed=0, all=picks.concat(narrow);
    all.forEach(function(p){ for(var k=0;k<p.label.length;k++) seed+=p.label.charCodeAt(k); });

    var det=DETAIL[c.key]||['well kept'];
    var pool=[what&&what.photo?what.photo:c._adp[0]].concat(c._adp);
    var out=[];
    for(var i=0;i<18;i++){
      var y=3+((i*7+seed)%12);
      var d=det[(i+seed)%det.length].replace('%y',y);
      var title=subject+(quals.length?', '+quals[0]:'')+' — '+d;
      var price=band[0]+((band[1]-band[0])*(((i*13+seed)%9)/8));
      var ts=Math.min(99, Math.max(floor||52, (floor||52)+((i*17+seed)%(99-(floor||52)))));
      var ls=44+((i*23+seed+7)%56);
      var bnd=(i%7<3)?0:((i%7<5)?1:2);
      var sub=bnd===0?anchor:(bnd===1?NEARBY[(i+seed)%NEARBY.length]:FURTHER[(i+seed)%FURTHER.length]);
      out.push({p:(i%3===0||i%3===1)?pool[0]:pool[1+((i+seed)%(pool.length-1))],
                t:title, pre:subject+(quals.length?', '+quals[0]:'')+' — ', dix:(i+seed)%det.length, y:y,
                note:notes.join(' · '),
                price:money(price)+(UNIT[c.key]||''), num:price,
                ts:ts, ls:ls, rs:rsOf(ls,ts), band:bnd, sub:sub, trust:ts});
    }
    /* LOCAL FIRST is a source rule; RS -> TS -> LS is the order inside it. */
    out.sort(function(a,b){
      if(a.band!==b.band) return a.band-b.band;
      if(b.rs!==a.rs) return b.rs-a.rs;
      if(b.ts!==a.ts) return b.ts-a.ts;
      return b.ls-a.ls;
    });
    /* NO TWO CARDS ON ONE SHELF MAY READ THE SAME. The ORDER is never touched -
       RS -> TS -> LS still decides every position; only the descriptive tail is
       rotated to the next one not already used above it. A shelf of five that
       repeats a line reads as a bug to the person looking at it. */
    var seen={};
    out.forEach(function(a){
      var n=0;
      while(seen[a.t] && n<det.length){
        a.dix=(a.dix+1)%det.length;
        a.t=a.pre+det[a.dix].replace('%y',a.y);
        n++;
      }
      seen[a.t]=1;
    });
    return out;
  };
  c.draftTitle=function(picks){ return picks[0].label+' — '+(picks[1]?picks[1].label:c.name); };
  c.draftBody=function(picks){
    return 'Written from your '+picks.length+' taps. '+picks.map(function(p){return p.label;}).join(', ')
      +'. Change any word of it before it goes up.'; };
});

drawDoor();
