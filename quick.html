<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#04070a;color:#eaf3ee;
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);
 display:flex;flex-direction:column;transition:background .5s}
/* LANDSCAPE-1 (14 Sep 2026, David on his phone): "on turning the phone sideways, it gives
   a cut-off picture". Reproduced exactly. The cause was this very rule: a phone on its side
   is 844x390, so min-width:560px matched and the DESKTOP bezel took over - a 400px frame
   400px frame 92vh tall (359px) holding a screen laid out for ~800px, with overflow:hidden
   doing the clipping. It was never a landscape layout at all; it was the desktop simulator
   firing on a phone.
   Locking to portrait was the offered way out and it is the weaker one: the manifest's
   orientation only binds the INSTALLED Android tile, iOS ignores it outright, and a browser
   tab ignores it everywhere - so it would have fixed his phone and nobody else's. Two rules
   fix it for everyone: the bezel now needs the HEIGHT to hang it in, and a short viewport
   scrolls instead of clipping. */
@media(min-width:560px) and (min-height:700px){
  #app{width:400px;height:min(92vh,860px);border-radius:36px;border:10px solid #010304;
       box-shadow:0 30px 90px rgba(0,0,0,.75)}
}

:root{--c:#16A97C;--bg:#04100c;--panel:#0a1a14;--line:#163128;--bright:#8ff0c8;--dim:#84a396}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px;
 min-height:56px;flex:0 0 auto}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
 display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--bright);
 flex:0 0 auto;cursor:pointer;transition:transform .12s,opacity .2s;user-select:none}
.ic:active{transform:scale(.9)}
.ic.hide{opacity:0;pointer-events:none}
.logo{flex:1;height:21px;width:auto;object-fit:contain;object-position:center;
 opacity:.92;pointer-events:none;min-width:0}
.steps{flex:1;display:flex;gap:6px;justify-content:center;align-items:center}
.steps i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}
.steps i.on{background:var(--c);width:22px;border-radius:4px}
.steps i.done{background:var(--bright)}

/* ---------- door ---------- */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;padding:0 22px 26px;position:relative}
.door{background:radial-gradient(120% 62% at 50% 40%,var(--panel) 0%,var(--bg) 72%)}
.orb{position:relative;width:min(62vw,236px);aspect-ratio:1;border-radius:50%;padding:5px;
 background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.16),0 18px 60px rgba(0,0,0,.5);
 transition:background .5s}
.orb .in{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#000}
.orb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}
.orb img.on{opacity:1}
.orb .halo{position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--c);
 animation:halo 3.4s ease-out infinite;pointer-events:none}
@keyframes halo{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.2);opacity:0}}
.catrow{display:flex;align-items:center;gap:8px;margin-top:24px;width:100%;justify-content:center}
.catname{font-size:30px;font-weight:800;letter-spacing:-.5px;text-align:center;min-width:0;
 flex:1;transition:opacity .2s}
.catname.fade{opacity:0}
.arw{font-size:24px;color:var(--dim);padding:6px 10px;cursor:pointer;user-select:none;
 transition:transform .12s}
.arw:active{transform:scale(.85)}
.dots{display:flex;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.on{background:var(--c)}
.acts{display:flex;gap:11px;width:100%;max-width:340px;margin-top:30px}
.btn{flex:1;padding:17px 10px;border-radius:999px;border:0;cursor:pointer;font-size:16px;
 font-weight:800;font-family:inherit;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.solid{background:var(--c);color:#04140e}
.btn.ghost{background:transparent;color:var(--bright);border:1.5px solid var(--c)}

/* ---------- steps ---------- */
.q{font-size:21px;font-weight:800;letter-spacing:-.3px;text-align:center;padding:2px 4px 14px;
 flex:0 0 auto;line-height:1.25}
.trail{display:flex;gap:6px;justify-content:center;padding:0 0 12px;flex:0 0 auto;min-height:0}
.trail img{width:34px;height:34px;border-radius:11px;object-fit:cover;border:1.5px solid var(--c);
 animation:pop .3s ease}
.trail{flex-wrap:wrap}
.trail span{height:34px;border-radius:11px;border:1.5px solid var(--c);
 background:var(--panel);color:var(--bright);font-size:11px;font-weight:800;white-space:nowrap;
 display:flex;align-items:center;justify-content:center;padding:0 10px;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;width:100%}
.body::-webkit-scrollbar{width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;aspect-ratio:1.18;
 background:var(--panel);border:1.5px solid var(--line);animation:rise .32s ease backwards;
 transition:transform .12s}
.tile:active{transform:scale(.96)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile b{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 11px;font-size:14px;
 font-weight:800;background:linear-gradient(transparent,rgba(2,8,6,.92));text-shadow:0 1px 6px #000}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{padding:15px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);
 color:var(--bright);font-size:16px;font-weight:700;cursor:pointer;animation:rise .3s ease backwards;
 transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip.wide{flex:1 1 100%;text-align:center}

/* ---------- the week (open days) ----------
   David, 14 Sep 2026: "It should show a full week, and allow for selection of
   any days where there are openings and they are available." A week of work is
   not one day; a housekeeper with Mon, Wed and Fri open had to lie to the old
   single chip row. Seven cells, any number of them, weekend included.        */
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.wd{border-radius:16px;border:1.5px solid var(--line);background:var(--panel);
 padding:13px 6px;text-align:center;cursor:pointer;animation:rise .3s ease backwards;
 transition:transform .12s,background .18s,border-color .18s;user-select:none}
.wd:active{transform:scale(.94)}
.wd b{display:block;font-size:16px;font-weight:800;color:var(--bright);line-height:1.1}
.wd i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.4px;color:var(--dim);
 margin-top:4px;text-transform:uppercase}
.wd.wend{border-style:dashed}
.wd.on{background:var(--c);border-color:var(--c);border-style:solid}
.wd.on b{color:#04140e}
.wd.on i{color:rgba(4,20,14,.8);font-weight:800}
.wkline{text-align:center;font-size:12.5px;color:var(--dim);padding:14px 6px 12px;
 min-height:42px;line-height:1.5}
.wkline b{color:var(--bright)}
.wkall{display:block;margin:0 auto;flex:0 0 auto}
.body.mid{display:flex;flex-direction:column;justify-content:center}
.body.mid>*{flex:0 0 auto}
.wkall.on{background:var(--c);color:#04140e;border-color:var(--c)}
.btn.solid:disabled{opacity:.35;cursor:default}

/* ---------- buzz ----------
   Requirement 6 of David's six, sized as the notes size it: no relay, no inbox,
   no typing. A button that rings the other person's phone with your NAME on it,
   the same button on both sides, and the permission asked once from each.     */
.bzlede{font-size:12.5px;line-height:1.55;color:var(--dim);padding:0 2px 12px;text-align:center}
.bzsec{margin-bottom:12px;border-radius:16px;border:1px solid var(--line);
 background:rgba(255,255,255,.04);padding:12px}
.bzsec h5{margin:0 0 8px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
 font-weight:800;color:var(--bright)}
.bzsec p.fine{margin:9px 0 0;font-size:11.5px;line-height:1.5;color:var(--dim)}
.bzsec h5 u{float:right;text-decoration:none;font-size:9px;letter-spacing:.05em;
 padding:2px 8px;border-radius:999px;border:1px solid;text-transform:uppercase}
.bzsec h5 u.rl{color:#8ff0c8;border-color:#16A97C}
.bzsec h5 u.op{color:#f0cc8a;border-color:#E0AE4E}
.bzfacts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 11px;font-size:12px}
.bzfacts dt{color:var(--dim);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
 font-weight:800;padding-top:2px;white-space:nowrap}
.bzfacts dd{margin:0;line-height:1.45;color:#cfe6db}
.bzfacts dd span{display:block;font-size:10.5px;color:var(--dim);margin-top:1px}
.bzfacts dd.pay{color:var(--bright);font-weight:700}

.perm{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 0;line-height:1.4}
.perm+.perm{border-top:1px solid var(--line)}
.perm span{flex:1}
.perm span b{color:var(--bright)}
.sw{flex:0 0 auto;width:46px;height:27px;border-radius:999px;background:var(--line);
 position:relative;cursor:pointer;transition:background .2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
 background:#cfe6db;transition:transform .2s,background .2s}
.sw.on{background:var(--c)}
.sw.on:after{transform:translateX(19px);background:#04140e}
.dirs{display:flex;gap:8px;margin-bottom:11px}
.dirs button{flex:1;padding:11px 6px;border-radius:14px;border:1.5px solid var(--line);
 background:var(--panel);color:var(--dim);font:inherit;font-size:11.5px;font-weight:800;
 cursor:pointer;line-height:1.3}
.dirs button.on{border-color:var(--c);color:var(--bright);background:rgba(255,255,255,.07)}
.bzin{display:flex;gap:8px;align-items:stretch}
.bzin input{flex:1;min-width:0;font:inherit;font-size:14.5px;color:#eaf3ee;padding:13px 14px;
 border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);outline:none}
.bzin input::placeholder{color:var(--dim)}
.bzin input:focus{border-color:var(--c)}
.bzin button{flex:0 0 auto;padding:0 18px;border-radius:14px;border:0;background:var(--c);
 color:#04140e;font:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:transform .12s}
.bzin button:active{transform:scale(.96)}
.bzin button:disabled{opacity:.35;cursor:default}
.bzleft{font-size:11px;color:var(--dim);text-align:right;padding:7px 2px 0}
.onphone{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:800;
 color:var(--dim);padding:0 2px 6px}
.push{border-radius:16px;border:1px solid var(--c);background:rgba(255,255,255,.07);
 padding:11px 12px;margin-bottom:12px;animation:pop .28s ease;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.push .who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--bright)}
.push .who u{margin-left:auto;text-decoration:none;font-size:10.5px;color:var(--dim);font-weight:600}
.push .av{width:27px;height:27px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:0 0 auto}
.push .msg{font-size:15px;font-weight:800;margin:8px 0 2px}
.push .sub{font-size:12.5px;color:var(--dim)}
.push .rep{display:flex;gap:7px;margin-top:11px}
.push .rep button{flex:1;padding:9px 4px;border-radius:999px;border:1.5px solid var(--c);
 background:transparent;color:var(--bright);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.push .rec{margin-top:10px;font-size:11.5px;color:var(--dim);line-height:1.5}
.push .rec b{color:var(--bright)}
.bznote{font-size:11.5px;line-height:1.55;color:var(--dim);padding:9px 10px;border-radius:12px;
 background:rgba(255,255,255,.04);border-left:3px solid var(--c);margin-top:2px}
.bzwarn{margin-top:10px;font-size:11.5px;color:#f0cc8a;background:rgba(224,174,78,.10);
 border:1px solid rgba(224,174,78,.35);border-radius:12px;padding:9px 10px;line-height:1.5}
.buzzcard{margin-top:14px;border-radius:16px;border:1px solid var(--line);
 background:rgba(255,255,255,.04);padding:12px}
.buzzcard>b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
 color:var(--bright);margin-bottom:6px}
.buzzcard p{margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.5}

/* ---------- result ---------- */
.card{border-radius:22px;overflow:hidden;background:var(--panel);border:1.5px solid var(--line);
 animation:rise .4s ease}
.card .hero{width:100%;aspect-ratio:1.5;object-fit:cover;display:block}
.card .pad{padding:14px}
.card h3{margin:0 0 6px;font-size:18px;letter-spacing:-.3px}
.card p{margin:0 0 11px;font-size:13.5px;color:var(--dim);line-height:1.5}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);
 border:1px solid var(--line);color:#cfe6db}
.draftflag{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#f0cc8a;
 background:rgba(224,174,78,.12);border:1px solid rgba(224,174,78,.4);border-radius:12px;
 padding:10px 12px;margin-bottom:12px}
.todo{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.todo div b{margin-left:auto;color:var(--c);font-size:12.5px}
.todo div{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:12px;border-radius:14px;
 background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer}
.todo div .plus{width:24px;height:24px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto;font-size:15px}
.todo div.did{opacity:.55}
.todo div.did .plus{background:var(--bright)}
.scores{margin-top:14px;border-radius:16px;background:rgba(255,255,255,.04);
 border:1px solid var(--line);padding:12px}
.scores h4{margin:0 0 2px;font-size:12.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--bright)}
.scores .yours{font-size:11.5px;color:var(--dim);margin:0 0 10px}
.scrow{display:flex;gap:8px;margin-bottom:10px}
.sc{flex:1;text-align:center;border-radius:12px;padding:8px 4px;background:rgba(255,255,255,.05);
 border:1px solid var(--line)}
.sc b{display:block;font-size:19px;line-height:1.1}
.sc i{display:block;font-style:normal;font-size:10px;letter-spacing:.6px;color:var(--dim);margin-top:2px}
.sc u{display:block;text-decoration:none;font-size:10px;color:var(--dim);opacity:.8}
.sc u.avail{color:var(--c);opacity:.95;font-weight:700}
.coach .note{font-size:11.5px;line-height:1.5;color:var(--dim);margin-top:8px;
 padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px dashed var(--line)}
.todolab{margin:14px 0 7px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
 font-weight:800;color:var(--bright)}
.coach{font-size:12.5px;line-height:1.5}
.coach .big{display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:12px;
 background:rgba(255,255,255,.05);border:1px solid var(--c);margin-bottom:8px}
.coach .big>span{flex:0 0 auto;font-weight:900;color:var(--c)}
.coach .big div span{font-weight:400;color:var(--dim)}
.coach ul{margin:0;padding-left:18px;color:var(--dim)}
.coach li{margin:3px 0}
.cred{margin-top:12px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);
 border:1px solid var(--line)}
.cred>b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
 color:var(--bright);margin-bottom:8px}
.credlist{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.credlist span{display:flex;align-items:center;gap:8px;font-size:12.5px}
.credlist i{margin-left:auto;font-style:normal;font-weight:700;font-size:12px;color:var(--bright)}
.cred p{margin:0;font-size:11.5px;line-height:1.5;color:var(--dim)}
.pricenote{margin-top:10px;font-size:11.5px;line-height:1.5;color:var(--dim);
 padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.04);
 border-left:3px solid var(--c)}
.gate{margin-top:10px;font-size:11.5px;color:#f0cc8a;background:rgba(224,174,78,.10);
 border:1px solid rgba(224,174,78,.35);border-radius:12px;padding:9px 10px;line-height:1.45}
.hres{margin-top:10px;font-size:12px;border-radius:12px;padding:10px;line-height:1.45;
 border:1px solid var(--line);background:rgba(255,255,255,.05);white-space:pre-wrap;word-break:break-word}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ad{border-radius:18px;overflow:hidden;background:var(--panel);border:1.5px solid var(--line);
 animation:rise .3s ease backwards}
.ad img{width:100%;aspect-ratio:1.25;object-fit:cover;display:block}
.ad .p{padding:9px 10px 11px}
.ad .t{font-size:12.5px;font-weight:700;line-height:1.3;margin-bottom:4px}
.ad .m{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.ad .m b{color:var(--bright)}
.ad .sub{font-size:10.5px;color:var(--dim);margin-bottom:5px}
.ad .ts{font-size:11px;font-weight:800;border:1px solid;border-radius:999px;padding:1px 7px}
.bandlab{grid-column:1/-1;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
 font-weight:800;color:var(--dim);padding:6px 2px 0}
.bandlab:first-child{padding-top:0}
.count{text-align:center;font-size:13px;color:var(--dim);padding:0 0 12px}
.count b{color:var(--bright)}
.foot{flex:0 0 auto;padding:10px 16px calc(env(safe-area-inset-bottom) + 14px)}
.hint{text-align:center;font-size:12px;color:var(--dim);padding-bottom:8px}
/* ---- the lookup: five answers, a hand-over note, and the valuable empty ---- */
.lknote{margin-top:12px;font-size:11.5px;line-height:1.55;color:var(--dim);padding:9px 10px;
 border-radius:12px;background:rgba(255,255,255,.04);border-left:3px solid var(--c)}
.lkempty{font-size:13px;line-height:1.6;color:var(--dim);padding:18px 14px;border-radius:16px;
 border:1px dashed var(--line);background:rgba(255,255,255,.03);text-align:center}
.lkempty>b:first-child{display:block;font-size:15px;color:var(--bright);margin-bottom:6px}
.lkask{margin-top:14px;text-align:center}
.lkask span{display:block;font-size:11px;color:var(--dim);padding-top:7px;line-height:1.5}
/* ---- ask your traders: a phone-around, five at most, never a group ---- */
.trd{display:flex;flex-direction:column;gap:7px}
.tr{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;
 border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer}
.tr.on{border-color:var(--c);background:rgba(255,255,255,.09)}
.tr .av{width:30px;height:30px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900;flex:0 0 auto}
.tr .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--bright);line-height:1.25}
.tr .nm span{display:block;font-size:11px;font-weight:500;color:var(--dim)}
.tr i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto}
.tr.on i{border-color:var(--c);background:var(--c)}
.bzsaid{margin-top:11px;font-size:12.5px;line-height:1.55;color:var(--bright);padding:10px 11px;
 border-radius:12px;border:1px solid var(--c);background:rgba(255,255,255,.06);animation:pop .28s ease}
/* ---- the two listing tails ---- */
.whoami{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;
 border:1px solid var(--c);background:rgba(255,255,255,.06);margin-bottom:12px}
.whoami .av{width:30px;height:30px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900;flex:0 0 auto}
.whoami .nm{flex:1;min-width:0;font-size:13px;font-weight:800;color:var(--bright);line-height:1.25}
.whoami .nm span{display:block;font-size:11px;font-weight:500;color:var(--dim)}
.whoami u{text-decoration:none;font-size:11px;color:var(--dim);flex:0 0 auto;cursor:pointer}
.msline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:12px 13px;margin-bottom:14px;
 border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.msline b{font-size:24px;font-weight:900;color:var(--c);line-height:1}
.msline i{font-style:normal;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;
 color:var(--dim);font-weight:800}
.msline u{text-decoration:none;margin-left:auto;font-size:11px;color:var(--dim)}
.msline span{flex:1 0 100%;font-size:11.5px;color:var(--dim);line-height:1.5;padding-top:7px}
.joinbox{margin-top:12px;padding:12px;border-radius:16px;border:1px solid var(--c);
 background:rgba(255,255,255,.05);animation:pop .28s ease}
.joinbox>b:first-child{display:block;font-size:13.5px;color:var(--bright);margin-bottom:9px}
.joinbox p{margin:10px 0 0;font-size:11.5px;line-height:1.55;color:var(--dim)}
.dswitch{display:flex;align-items:center;gap:9px;justify-content:center;margin-top:15px;
 font-size:11px;color:var(--dim);cursor:pointer}
.dswitch i{width:32px;height:18px;border-radius:999px;background:rgba(255,255,255,.14);
 border:1px solid var(--line);position:relative;flex:0 0 auto}
.dswitch i:after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;
 border-radius:50%;background:var(--dim);transition:.18s}
.dswitch.on i{background:var(--c);border-color:var(--c)}
.dswitch.on i:after{left:16px;background:#04140e}

/* LANDSCAPE-1, second half. This block lives at the END of the sheet ON PURPOSE:
   the first attempt sat next to the bezel rule at the top and lost every override to
   the later .orb/.bar declarations - the media query matched and changed nothing,
   which is the most expensive kind of fix because it looks applied. */
@media(max-height:560px){
  html,body{height:auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  #stage{position:static;display:block;min-height:100%}
  #app{width:100%;height:auto;min-height:100svh;overflow:visible;border:0;border-radius:0}
  .screen{min-height:0;justify-content:flex-start;padding:6px 18px 14px}
  .bar{min-height:44px;padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:4px}
  /* The DOOR must still answer in one look - a category you have to scroll to choose is a
     menu, not a door. Everything below it may scroll; this may not. */
  .door{justify-content:center}
  .orb{width:min(27vh,112px)}
  .catrow{margin-top:8px}
  .catname{font-size:21px}
  .dots{margin:6px 0 10px}
  .acts{gap:10px}
  .btn{padding:12px 18px;font-size:14.5px}
  .dswitch{margin-top:9px}
  .foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 34%)}
  .body{overflow:visible}
  /* Three across instead of two: a wide, short screen has the width to spare and it is
     ROWS that cost it. Six tiles become two rows, which is what puts them in one look. */
  .tiles,.grid{grid-template-columns:repeat(3,1fr);gap:8px}
  /* The card's HEIGHT is set by aspect-ratio, not by the image - the image is absolutely
     positioned and covers the card, so overriding its height only hollows the card out.
     Wide-and-short is the landscape shape: 3 across x 2 down, all six in one look. */
  .tile{aspect-ratio:1.95}
  .tile b{padding:14px 10px 7px;font-size:12.5px}
  .body{padding-top:4px}
  .q{font-size:19px;padding:4px 18px 8px}
  .trail{margin-bottom:6px}
}
/* ANOTHER OPTION - the seventh tile. Deliberately NOT a photo: it is the one answer we
   cannot picture, and dressing it as a category would be a lie about what it is. */
.tile.free{display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:rgba(255,255,255,.04);border:1.5px dashed var(--line)}
.tile.free i{font-style:normal;font-size:26px;line-height:1;color:var(--c);font-weight:800}
.tile.free b{position:static;background:none;padding:7px 8px 0;text-shadow:none;
 font-size:13px;color:var(--bright);text-align:center}
.chip.free{border-style:dashed;color:var(--bright)}
.body.mid{justify-content:center}
/* THE REFERRAL LANE */
.buzzcard.vouch{border-color:var(--c);background:rgba(255,255,255,.06)}
.vhead{display:flex;align-items:center;gap:11px;padding:0 2px 14px}
.vhead .av{width:46px;height:46px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex:0 0 auto}
.vhead .nm{font-size:17px;font-weight:800;color:var(--bright);line-height:1.25}
.vhead .nm span{display:block;font-size:12.5px;font-weight:500;color:var(--dim)}
.vlede{font-size:14.5px;line-height:1.65;color:#eaf3ee;padding:0 2px 14px}
.vlede b{color:var(--bright)}
.vsaid{border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);
 padding:14px 15px;margin-bottom:12px}
.vsaid b{display:block;font-size:15px;line-height:1.55;color:#eaf3ee;font-weight:600}
.vsaid span{display:block;font-size:11.5px;color:var(--dim);padding-top:7px}
.vwon{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:12px;padding:13px 14px;
 border-radius:16px;border:1px solid var(--c);background:rgba(255,255,255,.05)}
.vwon b{font-size:26px;font-weight:900;color:var(--c);line-height:1}
.vwon i{font-style:normal;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;
 color:var(--dim);font-weight:800}
.vwon span{flex:1 0 100%;font-size:12px;color:var(--dim);line-height:1.5;padding-top:7px}
</style>
</head>
<body>
<div id="stage"><div id="app">

/* ===========================================================================
   WHERE YOU ARE — a starting point, not a geo feature.
   No map, no radius, no permission prompt. The app already knows a city (it
   passes city= on every listing call today), so that is the starting point and
   it costs the user zero taps. Everything is ordered LOCAL FIRST and only
   reaches further out when the local shelf runs short.
   In the real app LOC comes from the signed-in profile / the existing city
   param. Here it is seeded from the phone's own timezone, which needs no
   permission, and it is changeable in one tap on the area step.
   ------------------------------------------------------------------------- */
var LOC={suburb:'Menlyn', city:'Pretoria'};
(function(){
  try{
    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    var M={'Africa/Johannesburg':['Menlyn','Pretoria']};
    if(M[tz]) LOC={suburb:M[tz][0], city:M[tz][1]};
  }catch(e){}
})();
/* band 0 = her own suburb, 1 = same city, 2 = further out */
function bandName(b){ return b===0?('In '+LOC.suburb):(b===1?('Around '+LOC.city):'Further out'); }

/* ===========================================================================
   THE THREE SCORES — all three already exist in the app, for every category.
     LS  listing quality, 0-100  ... _import_quality_score() in bea_main.py
     TS  seller trust,    0-100  ... the Trust Score / VEL ladder
     RS  ranking score           ... 0.5*LS + 0.5*TS, the same 50/50 as
                                     estate_agents.py::_rank_agents, extended
                                     to listing level by RANK-SURFACE-1 (30 Aug)
   Order is RS, then TS, then LS. Because RS is built out of the other two, the
   tiebreaks are the right way round: equal ranking is settled by trust first
   and listing quality second. ONLY TS IS SHOWN.
   ------------------------------------------------------------------------- */
function rsOf(ls,ts){ return Math.round((0.5*ls + 0.5*ts)*10)/10; }
function trustBand(ts){
  return ts>=90?{n:'Highly trusted',c:'#FBBF24'}
       : ts>=70?{n:'Trusted',c:'#10B981'}
       : ts>=40?{n:'Established',c:'#3B82F6'}
       : {n:'New',c:'#6B7280'};
}

function cycleHero(first){

/* ===========================================================================
   ANOTHER OPTION  (David + Dave, 14 Sep 2026)

   Dave's suggestion, and David's own standing ruling already decided it. Session 144,
   FILTER-DATA-2: "any filter whose value-set a country/city churns every few months
   (vehicle makes, models, brands) is a SINGLE FREE-TEXT BOX - never chips or lists,
   curated OR computed. Zero change management; born valid in every city/country.
   Stable ontologies (beds, transmission, prop types, trust bands) stay as chips."

   Six hardcoded Gauteng suburbs in every category is the exact failure that ruling
   was written against - the Cars 'Make' chips it deleted were the same mistake. A
   housekeeper in Kimberley could not list at all.

   It collides with RUL-117 (this app is TAP-ONLY), and David's call resolves it: a
   SEVENTH tile, not a replacement. Tap-first for the ninety percent who are local;
   typing only once the list has already failed you. The keyboard is the exception,
   never the greeting.

   WHICH STEPS GET IT is data, not judgement: any step whose value-set churns by city
   or country carries free:true. The 'what' steps (Cleaning, Laundry, Cooking) are
   stable ontologies and deliberately do NOT get one - an escape hatch on every screen
   is just a form with pictures.
   ------------------------------------------------------------------------- */
var FREE_LABEL = 'Another option';

function drawStep(){
  setNav();
  try{ qTrack('q_step_'+(step+1)); }catch(e){}   /* QUICK-FUNNEL-1: which question lost them */
  var f=flow();
  if(step>=f.steps.length){ drawResult(); return; }
  var s=f.steps[step];
  var trail=picks.map(function(p){
    return p.photo?'<img src="'+PH[p.photo]+'" alt="">':'<span>'+p.label+'</span>'; }).join('');
  if(s.kind==='week'){ drawWeek(s,trail); return; }
  var items;
  if(s.kind==='chip'){
    items='<div class="chips">'+s.tiles.map(function(t,i){
      return '<button class="chip'+(t.wide?' wide':'')+'" data-i="'+i+'" style="animation-delay:'
        +(i*35)+'ms">'+t.t+'</button>'; }).join('')
      +(s.free?'<button class="chip free" data-free="1" style="animation-delay:'
        +(s.tiles.length*35)+'ms">'+FREE_LABEL+'</button>':'')+'</div>';
  } else {
    items='<div class="tiles">'+s.tiles.map(function(t,i){
      return '<div class="tile" data-i="'+i+'" style="animation-delay:'+(i*45)+'ms">'
        +'<img src="'+PH[t.p]+'" alt=""><b>'+t.t+'</b></div>'; }).join('')
      +(s.free?'<div class="tile free" data-free="1" style="animation-delay:'
        +(s.tiles.length*45)+'ms"><i>+</i><b>'+FREE_LABEL+'</b></div>':'')+'</div>';
  }
  $('screen').className='screen';
  $('screen').innerHTML='<div class="q">'+s.q+'</div>'
    +(trail?'<div class="trail">'+trail+'</div>':'')
    +'<div class="body">'+items+'</div>';
  var nodes=$('screen').querySelectorAll('[data-i]');
  for(var k=0;k<nodes.length;k++) nodes[k].onclick=function(){
    var t=s.tiles[+this.getAttribute('data-i')];
    taps++;
    picks.push({label:t.t,photo:t.p||null,key:s.key});
    step++; drawStep();
  };
  var fx=$('screen').querySelector('[data-free]');
  if(fx) fx.onclick=function(){ taps++; drawFree(s,trail); };
}

/* One line, and it commits the same way a tap does - so everything downstream (the
   trail, the draft, the hand-over payload) needs to know nothing about it. That is
   the whole trick: it is a PICK, not a new kind of answer. */
function drawFree(s,trail){
  var hint = s.freeHint || 'Type it in';
  $('screen').className='screen';
  $('screen').innerHTML='<div class="q">'+s.q+'</div>'
    +(trail?'<div class="trail">'+trail+'</div>':'')
    +'<div class="body mid">'
    +'<div class="bzin"><input id="frtxt" type="text" maxlength="80" autocomplete="off" '
    +'autocapitalize="words" placeholder="'+hint+'"><button id="frgo" disabled>Use it</button></div>'
    +'<div class="bzleft" id="frleft">Whatever you type is what people will see.</div>'
    +'<div class="bznote">The six above are only the ones we see most. This is not a '
    +'lesser answer &mdash; it goes onto the advert exactly as you type it.</div>'
    +'</div>'
    +'<div class="foot"><button class="btn ghost" id="frback" style="width:100%">'
    +'Back to the list</button></div>';
  function paint(){
    var v=$('frtxt').value.trim();
    $('frgo').disabled = v.length < 2;
    $('frleft').textContent = v.length < 2
      ? 'Whatever you type is what people will see.'
      : (80 - v.length) + ' characters left';
  }
  $('frtxt').oninput=paint;
  $('frtxt').onkeydown=function(e){ if(e.key==='Enter' && !$('frgo').disabled) $('frgo').click(); };
  $('frgo').onclick=function(){
    var v=$('frtxt').value.trim().replace(/\s+/g,' ');
    picks.push({label:v, photo:null, key:s.key, free:true});
    step++; drawStep();
  };
  $('frback').onclick=function(){ drawStep(); };
  try{ $('frtxt').focus(); }catch(e){}
  paint();
}

/* ===========================================================================
   THE WEEK. (David, 14 Sep 2026: "It should show a full week, and allow for
   selection of any days where there are openings and they are available.")

   The old step was one chip row, Mon to Sat, single choice - so a housekeeper
   with Monday, Wednesday and Friday free had to pick one of them and let the
   advert lie about the other two, and Sunday did not exist at all. What is
   being listed here is TIME (QUICKLIST_DESIGN_NOTES section A), so the week is
   the product, not a detail: seven cells, any number of them on, the weekend
   drawn differently because it is priced and staffed differently, and one
   'Every day' toggle for the person who is simply available.

   It is still tap-only. Nothing is typed, nothing is a form, and the step does
   not advance on the first tap the way the single chips do - it cannot, or the
   second day could never be added - so it ends with one button that also states
   the count back to her before she commits it.
   ------------------------------------------------------------------------- */
function drawWeek(s,trail){
  var order=s.tiles.map(function(t){return t.t;});
  var sel={};
  function isWend(d){ return d==='Sat'||d==='Sun'; }
  function chosen(){ return order.filter(function(d){ return sel[d]; }); }
  $('screen').className='screen';
  $('screen').innerHTML='<div class="q">'+s.q+'</div>'
    +(trail?'<div class="trail">'+trail+'</div>':'')
    +'<div class="body mid">'
    +'<div class="week" id="wk">'+order.map(function(d,i){
        return '<div class="wd'+(isWend(d)?' wend':'')+'" data-d="'+i+'" '
          +'style="animation-delay:'+(i*35)+'ms"><b>'+d+'</b><i></i></div>'; }).join('')+'</div>'
    +'<div class="wkline" id="wkline"></div>'
    +'<button class="chip wkall" id="wkall">Every day</button>'
    +'</div>'
    +'<div class="foot"><button class="btn solid" id="wkgo" style="width:100%"></button></div>';
  function paint(){
    var g=$('wk');
    for(var i=0;i<order.length;i++){
      var d=order[i], on=!!sel[d];
      g.children[i].className='wd'+(isWend(d)?' wend':'')+(on?' on':'');
      g.children[i].getElementsByTagName('i')[0].textContent =
        on ? 'open' : (isWend(d)?'weekend':'free?');
    }
    var ch=chosen();
    $('wkall').className='chip wkall'+(ch.length===order.length?' on':'');
    $('wkline').innerHTML = ch.length
      ? (ch.length===order.length
          ? 'Open <b>every day of the week</b>.'
          : 'Open <b>'+ch.join(' &middot; ')+'</b>.')
      : 'Tap every day you are free. Tap one again to take it back.';
    var b=$('wkgo');
    b.disabled=!ch.length;
    b.textContent = ch.length
      ? 'Next \u2014 '+ch.length+(ch.length===1?' day open':' days open')
      : 'Pick your open days';
  }
  var cells=$('wk').children;
  for(var k=0;k<cells.length;k++) cells[k].onclick=function(){
    var d=order[+this.getAttribute('data-d')];
    sel[d]=!sel[d]; taps++; paint();
  };
  $('wkall').onclick=function(){
    var all=chosen().length===order.length;
    for(var i=0;i<order.length;i++) sel[order[i]]=!all;
    taps++; paint();
  };
  $('wkgo').onclick=function(){
    var ch=chosen(); if(!ch.length) return;
    taps++;
    picks.push({label: ch.length===order.length ? 'Any day' : ch.join(', '),
                photo:null, key:s.key, days:ch});
    step++; drawStep();
  };
  paint();
}

/* ===========================================================================
   THREE MODES, ONE ENGINE  (design reviewed by David, 14 Sep 2026)

   The spreader holds exactly three facts - who you are, what you have already
   accepted, and what exists - and it has exactly three modes:

     stranger + listing   7-8 steps   the only path that asks anything
     member   + listing   5-6 steps   nothing re-asked, ever
     anyone   + looking   4-5 steps   answers "is it there", never "get it"

   The tap engine does not know any of that. The same renderer, the same category
   table, the same four taps serve all three, and the ONLY thing that differs is
   what happens after the last tap. That lives in finish() below and nowhere else.
   If a change ever needs a SECOND place to know a mode exists, the change is
   wrong - that is the rule that keeps forty-eight screens down to one.

   In the live app QUICK is filled from GET /quick/me, which the browser can ask
   for because the ts_user cookie is already there - same origin, RUL-125(a). Here
   it is a switch on the door so both tails can be seen.
   ------------------------------------------------------------------------- */
var QUICK={member:false, name:'', city:''};
function finish(){
  setNav();
  if(mode==='find'){ drawLookup(); return; }   /* is it there */
  drawDraft();                                 /* list it - the tail differs inside */
}

/* ---------------- result ---------------- */
function pickOf(k){ for(var i=0;i<picks.length;i++) if(picks[i].key===k) return picks[i]; return null; }
function heroPhoto(){
  for(var i=picks.length-1;i>=0;i--) if(picks[i].photo) return picks[i].photo;
  return cat().hero[0];
}
function drawResult(){ finish(); }
/* ===========================================================================
   THE LISTER SEES ALL THREE OF HIS OWN SCORES AND IS TOLD WHAT TO DO NEXT.
   (RUL-121, David 12 Sep 2026, amending RUL-120(a)+(d).) The hiding was never
   secrecy: the PUBLIC card still shows TS only, and RUL-120(c) still stands -
   the non-monotonic star column is correct and must not be 'fixed'.

   LS below is a faithful mirror of bea_main.py::_import_quality_score() - the
   same 40 photo points, the same per-category required fields, the same 15-word
   description bar, the same 6 for price and 4 for area - so the number she reads
   in the Quick app is the number the server will compute on hand-over. It returns
   what is MISSING, biggest win first, and THAT LIST IS THE COACHING. Nothing new
   was invented here; it is the existing scorer surfaced.
   ------------------------------------------------------------------------- */
var REQ={property:['prop_type','beds','baths','listing_type'],
         cars:['make','model','vehicle_year','mileage_km','transmission'],
         tutors:['subject','level','mode'],
         services:['service_type']};
/* which tap answers which server field, per category, in the SELLING direction */
/* CASUALS-IS-SERVICES-1 (17 Sep 2026, David: "it is not a new category, it is part of
   casual services. Please make it everywhere part of services.")
   Housekeeping is a DOORWAY, not a category. The housekeeper does not go looking for
   "Services", so the card stays where she can find it — but what this app WRITES, and
   what TrustSquare scores and files it under, is Services / Casuals. Same correction
   for Local Market, whose DB category has always been local_market: the door's label
   and the platform's category are two different things, and only one of them travels. */
var CAT_OUT={
  homehelp:    {category:'Services',     service_class:'Casuals'},
  services:    {category:'Services',     service_class:'Technical'},
  localmarket: {category:'local_market'}};
function catOut(c){ return CAT_OUT[c.key] || {category:c.name}; }

/* THE SEVENTH CARD, ON EVERY STEP (17 Sep 2026, David: "we do need a written seventh
   card for text... a text entry for costs card everywhere for a different input... what
   are you hunting can also have a separate card for a text option.")
   The engine already had this — drawFree() has been here all along, a typed line that
   commits exactly like a tap. It was switched on for WHERE and nowhere else, so six
   tiles were the whole world on every other question. A list of six is never the whole
   world. Every step that is a list of choices now ends with one, and it takes a
   sentence rather than only a name. The week is the one exception: a calendar is not a
   list of words. */
var FREE_HINT={
  what:'Name it in your own words', price:'Type the amount', where:'Type the area',
  deal:'Say which', beds:'How many', make:'Type the make', year:'Type the year',
  level:'Type the level', mode:'Say how', how:'Say how', when:'Say when',
  day:'Say when', cond:'Describe the condition', auth:'Say what you have',
  len:'Say how long', rare:'Describe it', ship:'Say how'};
(function(){
  for(var i=0;i<CATS.length;i++){
    var c=CATS[i];
    ['sell','find'].forEach(function(side){
      var f=c[side]; if(!f||!f.steps) return;
      f.steps.forEach(function(s){
        if(s.kind==='week') return;
        s.free=true;
        if(!s.freeHint) s.freeHint=FREE_HINT[s.key]||'Type it in';
      });
    });
  }
})();

var FIELD_FROM={
 property:{prop_type:'what',listing_type:'deal',beds:'beds'},
 cars:{make:'make',vehicle_year:'year'},
 tutors:{subject:'what',level:'level',mode:'mode'},
 /* CASUALS-IS-SERVICES-1: this map and REQ are keyed by the category KEY, but were
    looked up by its lowercased NAME — which matched for seven of the eight by luck and
    missed homehelp entirely, so the work she picked (Childminding) never travelled and
    the listing score was computed against no required fields at all. Looked up by key
    now, and homehelp has its entry. */
 homehelp:{service_type:'what'},
 services:{service_type:'what'}};
var NICE={prop_type:'property type',listing_type:'for sale or to rent',beds:'number of bedrooms',
 baths:'number of bathrooms',make:'make',model:'model',vehicle_year:'year',mileage_km:'mileage',
 transmission:'transmission',subject:'subject',level:'level',mode:'in person or online',
 service_type:'what you do'};

/* The seller's own trust score. Zero until somebody outside TrustSquare vouches
   (RUL-115): one employer confirmation or an ID check. The live app fills this
   from the signed-in profile; the harness shows the honest starting position. */
var SELLER={ts:0, vouched:false};

/* WHERE-IT-IS, ASKED IN THE CATEGORY'S OWN WORDS. (David, 13 Sep 2026, on a
   Collectors card: "why is 'say which area you work in' applicable here? I would
   rather expect card collectors type relationships".) He is right — the words
   were a housekeeper's words wearing every category's clothes. The FIELD is not
   wrong: the server scores suburb/area 4 points and the shelf fills local-first
   (RUL-118), so a listing with no area cannot be placed in a band at all. Only
   the sentence was wrong. */
var AREA_ASK={homehelp:'Say which area you work in',
              services:'Say which area you work in',
              tutors:'Say which area you teach in',
              property:'Say which suburb it is in',
              cars:'Say where the car can be seen',
              collectors:'Say where it can be collected',
              adventures:'Say where the trip starts',
              localmarket:'Say where it can be collected'};

/* THE RELATIONSHIPS THAT ACTUALLY MOVE A COLLECTOR. Taken verbatim from the
   VEL credential catalogue already in bea_main.py — names and points are the
   ladder's own, not invented here. These raise the TRUST score, not the listing
   score, which is why they never showed up in the LS coaching: the collector's
   grading, certificate and association ARE in the model, just on the other half
   of RS. Listed only where the ladder's top entry is something a PRIVATE lister
   can actually hold; Property and Local Market top out on agent and
   office-bearer credentials, so they are left out rather than mis-advised. */
var CRED={collectors:[['Third-party authentication certificate',8],
                      ['Item provenance documentation',8],
                      ['Collector association membership',3]],
          cars:      [['Vehicle ownership (NATIS)',10],['Roadworthy certificate',6]],
          tutors:    [['SACE registration',12],['Safety clearances (PCC + child protection)',10]],
          homehelp:  [['Police clearance / background check',10],['Any NQF qualification or short course',8]],
          services:  [['Police clearance / background check',10],['Formal trade certificate',8]],
          adventures:[['Activity-specific guide certificate',12],['Current first aid',6]]};
/* RUL-129 (14 Sep 2026; built 17 Sep, RUL-126 batch): Property and Local Market read their
   block from the ladder itself -- GET /trust/catalogue -- so the points come from the
   catalogue, never from a table typed on this screen. While the batch is dark the endpoint
   serves no private-seller entries and the two screens stay silent, exactly as before. */
(function(){
  try{
    if(location.protocol==='file:') return;
    [['property','property'],['localmarket','localmarket']].forEach(function(p){
      fetch(location.origin+'/trust/catalogue?category='+p[0]+'&private=1').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
        if(d && d.signals && d.signals.length){ CRED[p[1]] = d.signals.slice(0,4).map(function(s){ return [s.name, s.points]; }); }
      }).catch(function(){});
    });
  }catch(e){}
})();

/* WHAT A PRICE IS, AND IS NOT. The number the lister types is an ASKING price.
   For the collectible lanes the app already resolves a real one from free public
   feeds (Scryfall for cards, Numista for coins, BrickLink for LEGO — all marked
   live and unpaid in ai_service_tiers.py), so a lister can see where theirs sits
   without anyone paying for data. It never overwrites what they asked. */
var PRICE_NOTE={collectors:'This is your asking price. TrustSquare can look up a '
   +'verified market price for cards, coins and LEGO from free public sources, so '
   +'you can see where yours sits \u2014 it never changes what you asked.'};
var PRICE_NOTE_ANY='This is your asking price \u2014 buyers see it as asked, not as a valuation.';

function lsOf(picks, photos){
  var c=cat(), key=c.key;
  var req=REQ[key]||[], from=FIELD_FROM[key]||{};
  var score=0, missing=[], n=photos||0;
  var ph=Math.min(40, n ? (10+8*(n-1)) : 0);
  score+=ph;
  if(ph<40) missing.push({pts:40-ph, t:n ? ('Add '+Math.max(1,Math.ceil((40-ph)/8))+' more photos')
                                         : 'Add your own photos'});
  var per=50/(req.length+1);
  req.forEach(function(f){
    if(from[f] && pickOf(from[f])) score+=per;
    else missing.push({pts:per, t:'Add the '+(NICE[f]||f)});
  });
  var words=c.draftBody(picks).replace(/\s+/g,' ').trim().split(' ').length;
  if(words>=15) score+=per; else missing.push({pts:per, t:'Write 15 words or more'});
  if(pickOf('price')) score+=6;
  else missing.push({pts:6, t:'Put a price on it — asking for a quote scores nothing'});
  if(pickOf('where')) score+=4;
  else missing.push({pts:4, t:AREA_ASK[c.key]||'Say where it is'});
  missing.sort(function(a,b){ return b.pts-a.pts; });
  /* HEADROOM, NOT A PENALTY. (David, 13 Sep 2026: "for cars, being a type
     limitation, ... say that x amount of score points can be added".)
     The arithmetic is NOT touched - it stays a faithful mirror of the server's
     _import_quality_score(), so the number here is still the number the server
     will compute. What changes is what the seller is told: a category that asks
     for more fields (Cars wants five, Housekeeping wants none) is not a seller
     scoring badly, it is a seller with more points still on the table. Cars was
     reading 31 and looking like a failure; it is a 31 with 25 still available. */
  var headroom=0; missing.forEach(function(m){ headroom+=m.pts; });
  return {score:Math.round(score), missing:missing, headroom:Math.round(headroom),
          fields:req.length};
}

/* ===========================================================================
   THE HAND-OVER. The Quick app has NO database and NO scorer of its own
   (RUL-125(b)). It composes the card from the taps and hands it to the SAME
   listings the live app reads, as a DRAFT - the seller then completes onboarding
   and the EULA inside TrustSquare to go live. That is what keeps one server and
   one rulebook rather than a second system.

   Contract mirrored from bea_main.py::create_listing (POST /listings):
   suburb is REQUIRED (400 without it); the server always stores 'draft'
   whatever is sent; unknown keys are ignored by the Listing model, so only real
   model fields are sent below; the reply is {id, message}.
   ------------------------------------------------------------------------- */
/* QUICK-FUNNEL-1 (18 Sep 2026). This door has been linked from live outreach letters
   since 14 Sep and posted NOT ONE funnel beacon in that time -- ms.js has had ONBOARD-
   FUNNEL-1 since 5 Sep, quick.html never got it. So every visit to /q/<category> has
   been invisible: we cannot say how many people arrived, which question lost them, or
   whether anybody has ever finished. On 18 Sep the onboarding goal proved that reading
   the funnel wrong had already cost a week of work aimed at a leak that did not exist;
   reading NO funnel is the same mistake with the lights off. Deliberately a copy of
   ms.js's obTrack shape rather than an import -- this file is served standalone and
   must keep working opened from a Downloads folder as a dry run.
   Fire-and-forget: never throws, never blocks, never changes what the seller sees.
   No address is ever sent unless the seller has typed one into the hand-over. */
var _qfSid='', _QF_BASE='';
try{ _QF_BASE = (location.protocol==='file:') ? '' : location.origin; }catch(e){ _QF_BASE=''; }
function qTrack(stepName, meta){
  try{
    if(!_QF_BASE) return;                      /* file:// dry run -- measure nothing */
    if(!_qfSid){
      try{ _qfSid=sessionStorage.getItem('ms_ob_sid')||''; }catch(e){}
      if(!_qfSid){ _qfSid='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
                   try{ sessionStorage.setItem('ms_ob_sid',_qfSid); }catch(e){} }
    }
    var sp=null; try{ sp=new URLSearchParams(location.search); }catch(e){}
    var body={sid:_qfSid, step:String(stepName||'').slice(0,40), meta:meta||null, magic:false,
              src:(sp&&sp.get('src')?String(sp.get('src')).slice(0,120):''),
              cat:(function(){ try{ return String((cat()&&(cat().key||cat().name))||''); }catch(e){ return ''; } })(), sub:'',
              email:(typeof HANDOVER!=='undefined'&&HANDOVER&&HANDOVER.email)?HANDOVER.email:''};
    fetch(_QF_BASE+'/onboard/step',{method:'POST',keepalive:true,
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(function(){});
  }catch(e){}
}
/* FUNNEL-HUMAN-1's dwell beacon, same contract as ms.js: 12 s on the page AND a real
   pointer/key/scroll event. Without it every mail-scanner that renders this door counts
   as a person, which is exactly the fault FUNNEL-DENOM-1 had to unpick on 18 Sep. */
var _qfDwellSent=false,_qfArmed=false,_qfInput=false;
function _qfDwellFire(){ if(_qfDwellSent||!_qfArmed||!_qfInput) return; _qfDwellSent=true; qTrack('dwell'); }
try{
  setTimeout(function(){ _qfArmed=true; _qfDwellFire(); },12000);
  ['pointerdown','keydown','touchstart','wheel','scroll'].forEach(function(ev){
    window.addEventListener(ev,function(){ _qfInput=true; _qfDwellFire(); },{passive:true});
  });
}catch(e){}

var HANDOVER={url:'', key:'', email:''};   /* the host page fills these when signed in */
/* QUICK-LIVE-1 (15 Sep 2026, David: "add it there and make it live"). The host page
   is now TrustSquare itself. Served from the app's own origin this fills the hand-over
   from what the browser already holds, so Publish writes a real draft instead of
   printing one. The key is the SAME one ms.js has shipped to every visitor since
   MAINT-B1b - source of truth is API_KEY at the top of ms.js, which now mirrors it
   into localStorage for this door; nothing new is exposed and there is no second copy
   of the key in this file to forget on a rotation.
   Identity: the design note at the door says the live spreader knows you from the
   ts_user cookie via GET /quick/me (RUL-125(a)). That endpoint does not exist yet, so
   this uses the app's own signed-in marker on the same origin instead - it reads it,
   never writes it, so this door can never fake a sign-in the app did not do.
   Opened as a file:// copy from an emailed Downloads folder there is no such storage
   and it stays a dry run, exactly as before - the one behaviour this must not lose. */
var QUICK_LIVE=false;
(function(){
  try{
    if(location.protocol==='file:') return;
    var k=localStorage.getItem('ts_qk_key');
    if(k){ HANDOVER.url=location.origin; HANDOVER.key=k; QUICK_LIVE=true; }
    var m=localStorage.getItem('ms_aa_email')||'';
    if(/.+@.+\..+/.test(m)){
      HANDOVER.email=m;
      QUICK.member=true;                                   /* a member is never re-asked */
      QUICK.name=localStorage.getItem('ms_aa_name')||m.split('@')[0];
      QUICK.city=LOC.suburb;
    }
    /* QUICK-ME-1 (RUL-125(a), 17 Sep 2026): the origin answers who you are and hands the same
       public key ms.js ships -- so a visitor arriving by e-mail link, who has never opened the
       app and holds no marker, still publishes LIVE instead of a dry run. The cookie wins over
       the marker; nothing is ever written back. */
    fetch(location.origin+'/quick/me',{credentials:'include'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if(!d) return;
      if(d.key && !HANDOVER.key){ HANDOVER.url=location.origin; HANDOVER.key=d.key; QUICK_LIVE=true; }
      if(d.signed_in && d.email){ HANDOVER.email=d.email; QUICK.member=true; QUICK.name=d.name||d.email.split('@')[0]; if(d.city) QUICK.city=d.city; }
    }).catch(function(){});
  }catch(e){}
})();
/* QUICK-PRICE-BASIS-1 (17 Sep 2026, found proving RUL-125(c) on the rig): the price chips are
   bare amounts ("R250") but the question that produced them names the basis ("What do you
   charge a day?"). The server (JNR-FIX-5B) refuses a bare amount on a rate-based category with
   a 422 -- so the spreader's OWN first lane, Housekeeping, could not hand over at all. The flow
   knows the basis; it now states it, exactly as the guided flow does (PRICE-UNIT-1). */
var PRICE_BASIS={homehelp:' / day', tutors:' / hour', services:' / call-out', adventures:' / person / night'};
function priceWithBasis(key, label){
  var l=String(label||'').trim(); if(!l) return 'POA';
  if(!PRICE_BASIS[key] || !/\d/.test(l) || /\/|\bper\b|ask|quote|poa/i.test(l)) return l;
  return l+PRICE_BASIS[key];
}
function handoverPayload(){
  var c=cat(), key=c.key;
  var from=FIELD_FROM[key]||{};
  var where=pickOf('where'), price=pickOf('price');
  var ls=lsOf(picks,0);
  var _co=catOut(c);
  var body={
    title: c.draftTitle(picks),
    price: price ? priceWithBasis(key, price.label) : 'POA',
    category: _co.category,
    city: LOC.city,
    area: where ? where.label : LOC.suburb,
    suburb: where ? where.label : LOC.suburb,      /* required by the server */
    description: c.draftBody(picks),
    trust_score: SELLER.ts,
    seller_email: HANDOVER.email || null,
    /* QUICK-RETURN-1 (18 Sep 2026): says which door composed this. The server mails
       the way back ONLY for 'quick' -- every other lane that lands a draft stays
       silent. Without this the draft is composed and then unreachable: PROBED on
       listing 382, a finished 94-score advert orphaned for six days. */
    source: 'quick'
  };
  if(_co.service_class) body.service_class=_co.service_class;
  ['prop_type','listing_type','beds','make','vehicle_year','subject','level','mode','service_type']
    .forEach(function(f){
      var k=from[f]; if(!k) return;
      var pk=pickOf(k); if(!pk) return;
      body[f]=(f==='beds'||f==='vehicle_year') ? parseInt(pk.label,10)||null : pk.label;
    });
  return {body:body, ls:ls};
}
function handOver(done){
  var pay=handoverPayload();
  if(!HANDOVER.url){ done({dry:true, body:pay.body}); return; }
  fetch(HANDOVER.url+'/listings',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Api-Key':HANDOVER.key},
    body:JSON.stringify(pay.body)
  }).then(function(r){
    return r.json().then(function(j){ return {ok:r.ok, status:r.status, j:j}; });
  }).then(function(res){
    done(res.ok ? {id:res.j.id, body:pay.body}
                : {err:(res.j && (res.j.detail||res.j.message)) || ('Server error '+res.status)});
  }).catch(function(e){ done({err:String(e && e.message || e)}); });
}

function drawDraft(){
  qTrack('q_draft');           /* QUICK-FUNNEL-1: the advert was composed and shown */
  var c=cat();
  var title=c.draftTitle(picks);
  var facts=picks.map(function(p){return '<span>'+p.label+'</span>';}).join('');
  var q=lsOf(picks,0), ts=SELLER.ts, rs=rsOf(q.score,ts), tb=trustBand(ts);
  var top=q.missing[0];
  /* THE ONLY PLACE A MODE EXISTS ON THE LISTING SIDE. Everything above this line
     ran identically for both. A returning member is not re-asked, not re-taught
     and not re-consented; a stranger gets the coaching AND the one ask, once. */
  var mem=QUICK.member;

            return '<span>'+x[0]+'<i>+'+x[1]+'</i></span>'; }).join('')+'</div>'
       +'<p>These raise your TRUST score, not your listing score \u2014 which is why they are '
       +'not in the list above. You add them once in TrustSquare and they count on every '

   +'<div class="pricenote">'+(PRICE_NOTE[c.key]||PRICE_NOTE_ANY)+'</div>'

   +(SELLER.vouched?'':' Your trust score opens when somebody outside vouches for you, or you pass an ID check.')
   +'</div></div>'
   ;

  var scores = mem

   +'<div class="card"><img class="hero" src="'+PH[heroPhoto()]+'" alt="">'

  $('bzgo').onclick=function(){ drawBuzz(); };

      if(res.dry){

        $('pubhint').textContent='Draft composed from '+taps+' taps.';
      } else {

           composes a thin draft; photos, the full detail set, the score and publishing all live
           in the guided flow, which finds this row through GET /listings/mine on the SAME email.

           back rather than "finish onboarding there" and no door. */
        var _e=function(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};

  /* THE ONE ASK, AND IT IS THE LAST THING THAT HAPPENS. Nothing is collected on the
     way in, because a stranger who is made to sign up before he has seen anything
     leaves. He types four taps, sees his own advert, and only then is asked for the
     one thing publishing genuinely needs. A member is never shown this at all - and
     once a stranger has been through it once, neither is he, ever again. */
  function joinThen(btn){
    var slot=$('jslot');

      +'<p>Publishing accepts the TrustSquare terms, including Buzz exactly as it is '
      +'\u2014 a doorbell between two people, not a messaging service, with an off '
      +'switch on both sides. This is the only thing this screen ever asks you, and '
      +'it will not ask you again on any device you are signed in on.</p></div>';
    $('jmail').oninput=function(){ $('jgo').disabled = !/.+@.+\..+/.test(this.value); };

      HANDOVER.email=m;   /* QUICK-LIVE-1: a draft with no seller_email is an orphan */

   caps are what keep it from becoming one: five answers, no narrowing, no sort,

function drawAds(){
  var c=cat(), all=c.ads(picks,narrow);
  /* No re-ranking any more: every card in the pool already satisfies every tap
     and every narrowing chip, so the order stays RS -> TS -> LS throughout. */
  var keep = narrow.length ? all.slice(0, [12,8,5][narrow.length-1]) : all;
  var nstep = c.narrow[narrow.length];
  var lastBand=-1, cards='';
  keep.forEach(function(a,i){
    if(a.band!==lastBand){
      lastBand=a.band;
      cards+='<div class="bandlab">'+bandName(a.band)+'</div>';
    }
    var tb=trustBand(a.ts);
    cards+='<div class="ad" style="animation-delay:'+(i*25)+'ms"><img src="'+PH[a.p]+'" alt="">'
     +'<div class="p"><div class="t">'+a.t+'</div>'
     +'<div class="sub">'+a.sub+(a.note?' &middot; '+a.note:'')+'</div>'
     +'<div class="m"><b>'+a.price+'</b>'
     +'<span class="ts" style="color:'+tb.c+';border-color:'+tb.c+'55" title="'+tb.n+'">'
     +'&#9733; '+a.ts+'</span></div></div></div>';
  });
  var trail=picks.concat(narrow).map(function(p){
    return p.photo?'<img src="'+PH[p.photo]+'" alt="">':'<span>'+p.label+'</span>'; }).join('');
  $('screen').className='screen';
  $('screen').innerHTML=
    '<div class="q" style="font-size:18px">'+(nstep?nstep.q:'Your five')+'</div>'
   +'<div class="trail">'+trail+'</div>'
   +'<div class="body">'
   +(nstep?'<div class="chips" style="margin-bottom:14px">'+nstep.tiles.map(function(t,i){
        return '<button class="chip" data-n="'+i+'" style="animation-delay:'+(i*35)+'ms">'+t.t+'</button>';
      }).join('')+'</div>':'')
   +'<div class="count">'+(nstep?'<b>'+keep.length+'</b> '+(narrow.length?'best match':'found')
      :'<b>'+keep.length+'</b> &mdash; your shelf, best match first')
      +'<br><span style="font-size:11.5px">'+LOC.suburb+' first &middot; &#9733; is trust</span></div>'
   +'<div class="grid">'+cards+'</div></div>';
  if(nstep){
    var ns=$('screen').querySelectorAll('[data-n]');
    for(var k=0;k<ns.length;k++) ns[k].onclick=function(){
      narrow.push({label:nstep.tiles[+this.getAttribute('data-n')].t,photo:null});
      drawAds();
    };
  }
}

/* The contract, mirrored from bea_main.py::buzz_send (POST /buzz):

   delivered is 'push' | 'email' | 'none'. 403 means the receiver has not
   switched this sender on; 404 means they are not connected at all. */
function buzzPost(fromP, toP, text, done){
  if(!buzzLive()){ done({dry:true, from_name:fromP.name, text:text}); return; }
  fetch(HANDOVER.url+'/buzz',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Api-Key':HANDOVER.key},
    body:JSON.stringify({from_email:fromP.email, to_email:toP.email, text:text})
  }).then(function(r){
    return r.json().then(function(j){ return {ok:r.ok, j:j}; });
  }).then(function(res){
    done(res.ok ? res.j : {err:(res.j && res.j.detail) || 'Buzz failed'});
  }).catch(function(e){ done({err:String(e && e.message || e)}); });

   a hurry to find out, do you have this or that. They sometimes know who could
   have what."

   That is a real move and Buzz already almost is it - but Buzz is strictly a PAIR,
   and a broadcast would break the one thing that must never fork. So this is NOT
   a broadcast: it is one typing that sends N INDIVIDUAL buzzes, each one still
   governed by that pair's own switch, that pair's closed state and the sender's
   hourly limit. Nothing about consent changes; only the compose step does.

   Capped at five, because Maurice phones three or four people, not thirty - the
   cap is what keeps this a phone-around rather than a mailing list.

   THE LINE CLAUDE WOULD NOT CROSS: replies come back as ordinary one-to-one
   buzzes, never a group thread. A group thread is where moderation, support load
   and "who said that" begin, and none of those belong in a doorbell.
   ------------------------------------------------------------------------- */
var TRADERS=[
  {name:'Marie Fourie',  last:'coins, last year'},
  {name:'Johan de Wet',  last:'stamps, March'},
  {name:'Anna Pretorius',last:'militaria, twice'},
  {name:'Pieter Nel',    last:'watches, 2024'},
  {name:'Elsa Joubert',  last:'art, once'},
  {name:'Kobus Venter',  last:'cards, last month'}
];
var TRADER_CAP=5;
function drawTraders(){
  var picked={};
  $('screen').className='screen';
  $('screen').innerHTML='<div class="q" style="font-size:19px">Ask the people who would know</div>'
   +'<div class="body">'
   +'<div class="bzlede">One line, to each of them separately. They never see each other &mdash; '
   +'this is the phone-around, not a group.</div>'
   +'<div class="trd" id="trd">'+TRADERS.map(function(t,i){
      return '<div class="tr" data-t="'+i+'"><div class="av">'+initialsOf(t.name)+'</div>'
        +'<div class="nm">'+t.name+'<span>'+t.last+'</span></div><i></i></div>'; }).join('')+'</div>'
   +'<div class="bzin" style="margin-top:12px"><input id="trtxt" type="text" maxlength="120" '
   +'autocomplete="off" placeholder="Anyone got a 1947 penny?"><button id="trgo" disabled>Ask</button></div>'
   +'<div class="bzleft" id="trleft">Pick up to '+TRADER_CAP+'.</div>'
   +'<div id="trsaid"></div>'
   +'<div class="bznote">Each one is an ordinary buzz, with your name on it, and each of them can '
   +'switch you off on their own. There is no group and no thread &mdash; whoever knows something '
   +'buzzes you back.</div>'
   +'</div>'
   +'<div class="foot"><button class="btn solid" id="trback" style="width:100%">Back</button></div>';
  function count(){ var n=0; for(var k in picked) if(picked[k]) n++; return n; }
  function paint(){
    var rows=$('trd').children;
    for(var i=0;i<rows.length;i++) rows[i].className='tr'+(picked[i]?' on':'');
    var n=count(), txt=$('trtxt').value.trim();
    $('trgo').disabled = !(n && txt);
    $('trleft').textContent = n ? (n+' of '+TRADER_CAP+' picked') : ('Pick up to '+TRADER_CAP+'.');
  }
  var rows=$('trd').children;
  for(var i=0;i<rows.length;i++) rows[i].onclick=function(){
    var i=+this.getAttribute('data-t');
    if(!picked[i] && count()>=TRADER_CAP){
      $('trleft').textContent='Five is the cap \u2014 this is a phone-around, not a mailing list.';
      return;
    }
    picked[i]=!picked[i]; paint();
  };
  $('trtxt').oninput=paint;
  $('trgo').onclick=function(){
    var who=[]; for(var k in picked) if(picked[k]) who.push(TRADERS[k].name);
    var txt=$('trtxt').value.trim();
    $('trsaid').innerHTML='<div class="bzsaid">Asked <b>'+who.join('</b>, <b>')+'</b> \u2014 '
      +who.length+' separate buzz'+(who.length>1?'es':'')+', each with your name on it. '
      +'Whoever knows something buzzes you back.</div>';
    $('trtxt').value=''; paint();
  };
  $('trback').onclick=function(){ drawLookup(); };
  paint();
}

/* ===========================================================================
   THE REFERRAL LANE  (David, 15 Sep 2026, standing in his kitchen making coffee)

   "We need a quick route for the housekeeper's current employer to give her a referral...
   1. signing on for free, 2. Writing a single sentence referral and 3. to use buzz once to
   confirm it works - three quick items, no more than 5 clicks?"

   It is the missing piece and it is load-bearing twice over. The draft screen already tells
   every lister "your trust score opens when somebody outside vouches for you" - and until
   now the app gave her no way to ASK. And it is the second account: the employer who vouches
   is exactly the person Buzz's whole economics depend on existing.

   FOUR TAPS, and the count is the specification, not a boast:
     1  "Yes - I'll do it"        the invite, opened from her link
     2  Continue                  email + the terms, the ONE ask (RUL-135)
     3  Send it                   one sentence, 140 characters
     4  Buzz her                  proof the doorbell works, both ways
   Two typings, four taps, and he is done forever. A fifth tap would be a form.

   WHY THE BUZZ IS PART OF IT rather than a nicety: a doorbell nobody has ever rung is a
   doorbell nobody trusts. Ringing it once, while both of them are looking at it, is the
   only demonstration that costs nothing and proves everything.

   CONSENT IS ALREADY COMPLETE when this flow ends, and no step asks for it twice: SHE asked
   (the link is her consent), HE answered (accepting the terms is his). That is the pair and
   both switches, earned by the two acts the flow is made of - never assumed.
   ------------------------------------------------------------------------- */
var VOUCH={ from:'Thandi Mokoena', email:'', line:'', buzzed:false };

function drawVouch(stage){
  setNav();
  var her = VOUCH.from, ini = initialsOf(her);
  $('screen').className='screen';

  if(stage===0){
    $('screen').innerHTML='<div class="q" style="font-size:20px">A reference, please</div>'
     +'<div class="body mid">'
     +'<div class="vhead"><div class="av">'+ini+'</div>'
     +'<div class="nm">'+her+'<span>asked you for a reference</span></div></div>'
     +'<div class="vlede">You employed her, so you are the only person who can say this. '
     +'<b>One sentence</b> is the whole job &mdash; it opens her trust score, and nothing she '
     +'writes about herself ever can.</div>'
     +'<div class="bznote">Free, about a minute, and you never have to use TrustSquare again '
     +'if you do not want to. Four taps from here.</div>'
     +'</div>'
     +'<div class="foot"><button class="btn solid" id="v0" style="width:100%">'
     +'Yes &mdash; I\u2019ll do it</button>'
     +'<div class="hint">Tap 1 of 4</div></div>';
    $('v0').onclick=function(){ taps++; drawVouch(1); };
    return;
  }

  if(stage===1){
    $('screen').innerHTML='<div class="q" style="font-size:20px">Who is vouching?</div>'
     +'<div class="body mid">'
     +'<div class="bzin"><input id="vmail" type="email" autocomplete="email" '
     +'placeholder="you@example.com"><button id="v1" disabled>Continue</button></div>'
     +'<div class="bzleft">Only '+her.split(" ")[0]+' sees your name on the reference.</div>'
     +'<div class="bznote">This is the only thing we ask you for, and it is what signs you up '
     +'&mdash; free, no card. Continuing accepts the TrustSquare terms, Buzz included as it is: '
     +'a doorbell between two people, with an off switch on both sides (\u00a73.8).</div>'
     +'</div>'
     +'<div class="foot"><button class="btn ghost" id="vb" style="width:100%">Back</button>'
     +'<div class="hint">Tap 2 of 4</div></div>';
    $('vmail').oninput=function(){ $('v1').disabled = !/.+@.+\..+/.test(this.value); };
    $('v1').onclick=function(){ taps++; VOUCH.email=$('vmail').value.trim(); drawVouch(2); };
    $('vb').onclick=function(){ drawVouch(0); };
    try{ $('vmail').focus(); }catch(e){}
    return;
  }

  if(stage===2){
    $('screen').innerHTML='<div class="q" style="font-size:20px">One sentence about '
     +her.split(" ")[0]+'</div>'
     +'<div class="body mid">'
     +'<div class="bzin"><input id="vline" type="text" maxlength="140" autocomplete="off" '
     +'placeholder="She has worked for us since 2021 \u2014 honest, and never a day missed."> '
     +'<button id="v2" disabled>Send it</button></div>'
     +'<div class="bzleft" id="vleft">Say what you would tell a friend who asked.</div>'
     +'<div class="bznote">It goes on her advert with your name under it. You cannot be asked '
     +'to justify it and nobody will chase you about it &mdash; it is a reference, not a '
     +'reference check.</div>'
     +'</div>'
     +'<div class="foot"><button class="btn ghost" id="vb" style="width:100%">Back</button>'
     +'<div class="hint">Tap 3 of 4</div></div>';
    function paint(){
      var v=$('vline').value.trim();
      $('v2').disabled = v.length < 8;
      $('vleft').textContent = v.length < 8 ? 'Say what you would tell a friend who asked.'
                                            : (140 - v.length) + ' characters left';
    }
    $('vline').oninput=paint;
    $('vline').onkeydown=function(e){ if(e.key==='Enter' && !$('v2').disabled) $('v2').click(); };
    $('v2').onclick=function(){ taps++; VOUCH.line=$('vline').value.trim(); drawVouch(3); };
    $('vb').onclick=function(){ drawVouch(1); };
    try{ $('vline').focus(); }catch(e){}
    paint();
    return;
  }

  /* stage 3 - the reference is in; one buzz proves the doorbell before he leaves */
  var done = VOUCH.buzzed;
  $('screen').innerHTML='<div class="q" style="font-size:20px">'
   +(done?'That is everything':'One last thing, and it takes a second')+'</div>'
   +'<div class="body mid">'
   +'<div class="vsaid"><b>\u201c'+_vEsc(VOUCH.line)+'\u201d</b><span>\u2014 you, just now</span></div>'
   +(done
     ? '<div class="bzsaid">Buzzed '+her.split(" ")[0]+'. She has it on her phone, and she can '
       +'buzz you back the same way &mdash; one line each, no thread. Either of you can switch '
       +'it off, and switching it off ends it for both.</div>'
       +'<div class="vwon"><b>+18</b><i>trust</i><span>'+her+'\u2019s score has opened. An outside '
       +'voucher is the one thing a lister cannot give themselves.</span></div>'
     : '<div class="bznote">Buzz is how she tells you she is running late, and how you tell her '
       +'not to come. Ring it once now, while you are both looking at it &mdash; a doorbell '
       +'nobody has ever rung is a doorbell nobody trusts.</div>')
   +'</div>'
   +'<div class="foot">'
   +(done
     ? '<button class="btn solid" id="v4" style="width:100%">Done</button>'
       +'<div class="hint">Four taps. You are finished.</div>'
     : '<button class="btn solid" id="v3" style="width:100%">Buzz '+her.split(" ")[0]
       +' once</button><div class="hint">Tap 4 of 4</div>')
   +'</div>';
  if($('v3')) $('v3').onclick=function(){ taps++; VOUCH.buzzed=true; drawVouch(3); };
  if($('v4')) $('v4').onclick=function(){ VOUCH.buzzed=false; drawDraft(); };
}
function _vEsc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------------- nav ---------------- */
$('back').onclick=function(){
  if(atBuzz){ atBuzz=false; drawDraft(); return; }
  if(mode==='find' && narrow.length){ narrow.pop(); drawAds(); return; }
  if(step>0){ step--; picks.pop(); drawStep(); return; }
  drawDoor();
};

/* swipe on the door */
var sx=null;
$('app').addEventListener('touchstart',function(e){ if(!mode) sx=e.touches[0].clientX; },{passive:true});
$('app').addEventListener('touchend',function(e){

},{passive:true});
