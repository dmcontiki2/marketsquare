# LIVE COPY of /etc/nginx/sites-enabled/marketsquare on the production VPS.
# Refreshed 12 Sep 2026 straight from the server after the SW-ROOT-1 fix.
# Edit the server, then refresh this file - do not hand-edit this copy alone.
# Reject raw IP access
server {
    listen 80;
    listen 443 ssl;
    server_name 178.104.73.239;
    ssl_certificate /etc/ssl/cloudflare/trustsquare.pem;
    ssl_certificate_key /etc/ssl/cloudflare/trustsquare.key;
    return 444;
}
server {
    server_name trustsquare.co www.trustsquare.co;
    include snippets/security_headers.conf;

    # Serve the FEA
    location = / {
    include /etc/nginx/snippets/security_headers.conf;   # INDEX-HEADERS-1 24 Aug 2026: location = / declares its own
    # Cache-Control, which per nginx inheritance DISCARDS every inherited add_header.
    # Without this include the front page — the one carrying the ID-upload flow —
    # serves with no CSP, no X-Frame-Options and no HSTS. Probed naked on 24 Aug.

        root /var/www/marketsquare;
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
    }

    location = /rental.html {
        include snippets/internal_auth.conf;
        root /var/www/marketsquare;
    }

    location = /dashboard.html {
        include snippets/internal_auth.conf;
        root /var/www/marketsquare;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location = /admin.html {
        include snippets/internal_auth.conf;
        root /var/www/marketsquare;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }


    # SW-ROOT-1 (12 Sep 2026): the app registers /service-worker.js at the ROOT.
    # Without this block the path fell through to the FastAPI proxy and returned a
    # JSON 404, so every push registration failed silently and NOBODY got a buzz.
    location = /service-worker.js {
        root /var/www/marketsquare;
        try_files /service-worker.js =404;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    location = /support {
        root /var/www/marketsquare;
        try_files /support.html =404;
    }

    location = /support.html {
        root /var/www/marketsquare;
        try_files /support.html =404;
    }

    location = /command.html {
        include snippets/internal_auth.conf;
        root /var/www/marketsquare;
        add_header Cache-Control 'no-store, no-cache, must-revalidate';
        expires -1;
    }
    # ── CityLauncher dashboard ───────────────────────
    location = /ai/test {
        auth_basic "AdvertAgent dev";
        auth_basic_user_file /etc/nginx/.htpasswd_orch;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_read_timeout 900;
    }

    location /ai/ {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_read_timeout 900;
        proxy_connect_timeout 30;
    }

    location /launch/ {
        root /var/www/citylauncher;
        try_files /launch/index.html =404;
    }

    location = /launch {
        return 301 /launch/;
    }

    # ── CityLauncher API proxy ───────────────────────
    location /launch-api/ {
        rewrite ^/launch-api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # ── Demo mode ────────────────────────────────────────────
    # /demo redirects to /?demo=1 so the frontend activates demo mode.
    # Prospects see the marketplace but Sell/Wallet/Seller are hidden.
    location = /demo {
        return 301 /?demo=1;
    }

    location = /demo/ {
        return 301 /?demo=1;
    }


    # Static assets (CSS + JS) -- long cache, served directly from disk
    location /static/ {
        root /var/www/marketsquare;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Media uploads (photos saved by BEA locally)
    location /media/ {
        root /var/www/marketsquare;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Proxy API calls to FastAPI (MarketSquare)
    # ── Orchestrator ops page (Basic Auth) ─────────
    location = /orchestrator {
        root /var/www/marketsquare;
        try_files /orchestrator.html =404;
        satisfy any;                       # DEVICE-AUTH-1
        auth_request /_device_ok;          # DEVICE-AUTH-1
        auth_basic "TrustSquare Orchestrator";
        auth_basic_user_file /etc/nginx/.htpasswd_orch;
    }
    location = /orchestrator.html {
        root /var/www/marketsquare;
        satisfy any;                       # DEVICE-AUTH-1
        auth_request /_device_ok;          # DEVICE-AUTH-1
        auth_basic "TrustSquare Orchestrator";
        auth_basic_user_file /etc/nginx/.htpasswd_orch;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    location = /orchestrator/approve {
        satisfy any;                       # DEVICE-AUTH-1
        auth_request /_device_ok;          # DEVICE-AUTH-1
        auth_basic "TrustSquare Orchestrator";
        auth_basic_user_file /etc/nginx/.htpasswd_orch;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MAP-LIVE-1 30 Aug 2026: these two ops documents are served by the app,
    # which reads them from the repo checkout's fetched origin/main at request
    # time (fallback: the deploy-placed copy). Exact match outranks the static
    # prefix block below; the Basic-Auth gate is unchanged.
    location = /orchestrator/defence_map.html {
        satisfy any;                       # DEVICE-AUTH-1
        auth_request /_device_ok;          # DEVICE-AUTH-1
        auth_basic "TrustSquare Orchestrator";
        auth_basic_user_file /etc/nginx/.htpasswd_orch;
        add_header Cache-Control "no-store";
        expires -1;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /orchestrator/watch_register.md {
        satisfy any;                       # DEVICE-AUTH-1
        auth_request /_device_ok;          # DEVICE-AUTH-1
        auth_basic "TrustSquare Orchestrator";
        auth_basic_user_file /etc/nginx/.htpasswd_orch;
        add_header Cache-Control "no-store";
        expires -1;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /orchestrator/ {
        root /var/www/marketsquare;
        satisfy any;                       # DEVICE-AUTH-1
        auth_request /_device_ok;          # DEVICE-AUTH-1
        auth_basic "TrustSquare Orchestrator";
        auth_basic_user_file /etc/nginx/.htpasswd_orch;
        add_header Cache-Control "no-store";
        expires -1;
    }

    # ── Auctions & Offers concept (Basic Auth — dedicated secret) ──
    location = /auctions {
        root /var/www/marketsquare;
        try_files /auctions.html =404;
        auth_basic "TrustSquare Auctions (secret)";
        auth_basic_user_file /etc/nginx/.htpasswd_auctions;
    }
    location = /auctions.html {
        root /var/www/marketsquare;
        auth_basic "TrustSquare Auctions (secret)";
        auth_basic_user_file /etc/nginx/.htpasswd_auctions;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
        # GATE-ENFORCE-1 internal auth check + exempt endpoints (do not gate these)
    # DEVICE-AUTH-1 (8 Sep 2026, David: "we only need the first login"): an enrolled device
    # (DEVICE-ENROL-1 ts_device cookie) passes the ops Basic-auth gate. The app answers 200 for
    # a valid, unrevoked device and 401 otherwise. Any upstream ERROR (app down, timeout, 5xx)
    # is mapped to 401 so the gate falls back to Basic auth exactly as before -- never a 500.
    location = /_device_ok {
        internal;
        proxy_pass http://127.0.0.1:8000/admin/device-ok;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =401 @device_deny;
    }
    location @device_deny { return 401; }

    location = /_review_gate { return 200; }   # GATE-DOWN-1: gate lowered 19 Aug 2026 (David) -- restore from backup to re-arm
    location = /review/login    { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /review/verify { default_type application/json; return 200 '{"valid":true,"scope":"review"}'; }   # GATE-DOWN-1
    location = /review/request-link { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /review/enter    { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /review/claim-code  { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /admin/login        { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /admin/change-pin   { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /admin/verify       { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /auth/verify-code   { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /auth/providers     { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ^~ /auth/oauth/       { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /health          { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /payment/webhook { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /email/inbound   { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /intro/relay     { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ^~ /admin/faults   { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /dashboard/maint { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ^~ /.well-known/   { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

        # RUL-020 (16 Aug 2026): legal docs are PUBLIC -- EULA final & binding, released to users
    location = /terms   { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /privacy { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # GATE-ENFORCE-1 gated catch-all (API): every other path needs a valid review cookie
    location / {
        auth_request /_review_gate;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/ssl/cloudflare/trustsquare.pem; # managed by Certbot
    ssl_certificate_key /etc/ssl/cloudflare/trustsquare.key; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.trustsquare.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = trustsquare.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name trustsquare.co www.trustsquare.co;
    include snippets/security_headers.conf;
    return 404; # managed by Certbot




}
