<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work the American farm belt</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#1F3864;--blue:#2F5496;--gold:#c9a227;--bg:#0d1b2e;--card:#13233a;--line:#24385a;--txt:#e8eef7;--mut:#9db0cc;--green:#538135;--amber:#c55a11;--red:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 'Segoe UI',system-ui,sans-serif}
header{padding:14px 16px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header h1{font-size:18px}
header .sub{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--navy);border-color:var(--gold);color:#fff}
#map{height:calc(100vh - 108px);min-height:430px}
.leaflet-popup-content{font:12.5px/1.45 'Segoe UI',sans-serif}
.leaflet-popup-content b{color:#1F3864}
.pop-img{width:220px;height:146px;object-fit:cover;border-radius:6px;display:block;margin-top:6px;background:#dde5f0}
.legend{position:absolute;bottom:18px;left:12px;z-index:900;background:rgba(13,27,46,.92);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:11.5px;color:var(--mut);max-width:280px}
.legend b{color:var(--txt)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style></head><body>

<header><h1>Work the American farm belt</h1><div class="sub">Worked example map - Pieter's journey, farm country and its seasons</div></header>
<div class="chips" id="chips"></div>
<div id="map"></div>
<div class="legend"><b>Legend</b><br><span class="dot" style="background:#c9a227"></span>journey / home&nbsp;
<span class="dot" style="background:#538135"></span>the goal&nbsp;
<span class="dot" style="background:#2F5496"></span>daily life&nbsp;
<span class="dot" style="background:#c55a11"></span>worth knowing<br>Toggle the chips - each layer answers one question.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/ts_demo_banner.js" defer></script>
<script>
var map=L.map('map',{scrollWheelZoom:true}).setView([38,-80],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(map);
var C={home:'#c9a227',goal:'#538135',life:'#2F5496',know:'#c55a11'};
function pin(g,ll,cat,title,body,img){
  var m=L.circleMarker(ll,{radius:8,color:C[cat],fillColor:C[cat],fillOpacity:.95,weight:2});
  var h='<b>'+title+'</b><br>'+body;
  if(img)h+='<img class="pop-img" loading="lazy" src="/static/studywork/'+img+'" onerror="this.style.display=\'none\'">';
  m.bindPopup(h); m.addTo(g); return m;
}
function arc(g,a,b,col){var mid=[(a[0]+b[0])/2+(Math.abs(a[1]-b[1])>30?18:2),(a[1]+b[1])/2];
  L.polyline([a,mid,b],{color:col||'#c9a227',weight:2,opacity:.7,dashArray:'7 8'}).addTo(g);}

var gJourney=L.layerGroup(),gBelt=L.layerGroup(),gTown=L.layerGroup(),gSeasons=L.layerGroup();
arc(gJourney,[-26.13,28.24],[33.64,-84.43]);
arc(gJourney,[33.64,-84.43],[41.99,-93.62],'#538135');
pin(gJourney,[-26.13,28.24],'home','OR Tambo, Johannesburg','Duffel bag, work gloves in the side pocket - the direct to Atlanta.','sw_us_1_airport.jpg');
pin(gJourney,[33.64,-84.43],'home','Atlanta - the connection','Immigration here: J-1 papers in the folder, answers ready, honest and short.',null);
pin(gJourney,[41.99,-93.62],'goal','Des Moines / the host farm region','Last leg by regional flight or the host farmer fetches you.','sw_us_2_aerial.jpg');
pin(gBelt,[42.03,-93.58],'goal','Iowa - corn and soy heartland','Row-crop scale like nowhere else; planters wider than a Free State road.','sw_us_4_farm.jpg');
pin(gBelt,[44.9,-95.0],'goal','Minnesota - mixed grain + dairy','Long summer days, big iron, strong SA crew presence in season.',null);
pin(gBelt,[39.64,-106.37],'know','Colorado - the H-2A winter option','Ski-season resorts hire H-2A/H-2B seasonal crews when the fields sleep.',null);
pin(gTown,[41.74,-92.72],'life','The small town','Main street, one diner, the co-op - everyone knows the SA crew by week two.','sw_us_5_town.jpg');
pin(gTown,[41.69,-93.05],'life','The grain elevator','Harvest gravity-point: trucks queue here from first light.',null);
pin(gTown,[41.8,-92.9],'life','The farmstead','Housing is employer-provided on H-2A - no rent is the savings engine.','sw_us_6_life.jpg');
pin(gSeasons,[43.5,-96.7],'know','Planting - April to May','The spring window: planters run around the clock; arrive rested.',null);
pin(gSeasons,[40.5,-98.0],'know','Harvest - September to November','The big money months: combine hours from dawn past dark.',null);
var LAYERS={'The journey':gJourney,'The farm belt':gBelt,'Town life':gTown,'The seasons':gSeasons};

var chipRow=document.getElementById('chips');
Object.keys(LAYERS).forEach(function(name,i){
  var c=document.createElement('div');c.className='chip'+(i===0?' on':'');c.textContent=name;
  c.onclick=function(){
    var on=c.classList.toggle('on');
    if(on)map.addLayer(LAYERS[name]);else map.removeLayer(LAYERS[name]);
  };
  chipRow.appendChild(c);
  if(i===0)map.addLayer(LAYERS[name]);
});
</script><script src="/static/ts_report.js?v=6" defer></script>
</body></html>
