<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#04070a;color:#eaf3ee;
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);
 display:flex;flex-direction:column;transition:background .5s}
/* LANDSCAPE-1 (14 Sep 2026, David on his phone): "on turning the phone sideways, it gives
   a cut-off picture". Reproduced exactly. The cause was this very rule: a phone on its side
   is 844x390, so min-width:560px matched and the DESKTOP bezel took over - a 400px frame
   400px frame 92vh tall (359px) holding a screen laid out for ~800px, with overflow:hidden
   doing the clipping. It was never a landscape layout at all; it was the desktop simulator
   firing on a phone.
   Locking to portrait was the offered way out and it is the weaker one: the manifest's
   orientation only binds the INSTALLED Android tile, iOS ignores it outright, and a browser
   tab ignores it everywhere - so it would have fixed his phone and nobody else's. Two rules
   fix it for everyone: the bezel now needs the HEIGHT to hang it in, and a short viewport
   scrolls instead of clipping. */
@media(min-width:560px) and (min-height:700px){
  #app{width:400px;height:min(92vh,860px);border-radius:36px;border:10px solid #010304;
       box-shadow:0 30px 90px rgba(0,0,0,.75)}
}

:root{--c:#16A97C;--bg:#04100c;--panel:#0a1a14;--line:#163128;--bright:#8ff0c8;--dim:#84a396}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px;
 min-height:56px;flex:0 0 auto}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
 display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--bright);
 flex:0 0 auto;cursor:pointer;transition:transform .12s,opacity .2s;user-select:none}
.ic:active{transform:scale(.9)}
.ic.hide{opacity:0;pointer-events:none}
.logo{flex:1;height:21px;width:auto;object-fit:contain;object-position:center;
 opacity:.92;pointer-events:none;min-width:0}
.steps{flex:1;display:flex;gap:6px;justify-content:center;align-items:center}
.steps i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}
.steps i.on{background:var(--c);width:22px;border-radius:4px}
.steps i.done{background:var(--bright)}

/* ---------- door ---------- */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;padding:0 22px 26px;position:relative}
.door{background:radial-gradient(120% 62% at 50% 40%,var(--panel) 0%,var(--bg) 72%)}
.orb{position:relative;width:min(62vw,236px);aspect-ratio:1;border-radius:50%;padding:5px;
 background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.16),0 18px 60px rgba(0,0,0,.5);
 transition:background .5s}
.orb .in{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#000}
.orb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}
.orb img.on{opacity:1}
.orb .halo{position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--c);
 animation:halo 3.4s ease-out infinite;pointer-events:none}
@keyframes halo{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.2);opacity:0}}
.catrow{display:flex;align-items:center;gap:8px;margin-top:24px;width:100%;justify-content:center}
.catname{font-size:30px;font-weight:800;letter-spacing:-.5px;text-align:center;min-width:0;
 flex:1;transition:opacity .2s}
.catname.fade{opacity:0}
.arw{font-size:24px;color:var(--dim);padding:6px 10px;cursor:pointer;user-select:none;
 transition:transform .12s}
.arw:active{transform:scale(.85)}
.dots{display:flex;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.on{background:var(--c)}
.acts{display:flex;gap:11px;width:100%;max-width:340px;margin-top:30px}
.btn{flex:1;padding:17px 10px;border-radius:999px;border:0;cursor:pointer;font-size:16px;
 font-weight:800;font-family:inherit;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.solid{background:var(--c);color:#04140e}
.btn.ghost{background:transparent;color:var(--bright);border:1.5px solid var(--c)}

/* ---------- steps ---------- */
.q{font-size:21px;font-weight:800;letter-spacing:-.3px;text-align:center;padding:2px 4px 14px;
 flex:0 0 auto;line-height:1.25}
.trail{display:flex;gap:6px;justify-content:center;padding:0 0 12px;flex:0 0 auto;min-height:0}
.trail img{width:34px;height:34px;border-radius:11px;object-fit:cover;border:1.5px solid var(--c);
 animation:pop .3s ease}
.trail{flex-wrap:wrap}
.trail span{height:34px;border-radius:11px;border:1.5px solid var(--c);
 background:var(--panel);color:var(--bright);font-size:11px;font-weight:800;white-space:nowrap;
 display:flex;align-items:center;justify-content:center;padding:0 10px;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;width:100%}
.body::-webkit-scrollbar{width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;aspect-ratio:1.18;
 background:var(--panel);border:1.5px solid var(--line);animation:rise .32s ease backwards;
 transition:transform .12s}
.tile:active{transform:scale(.96)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile b{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 11px;font-size:14px;
 font-weight:800;background:linear-gradient(transparent,rgba(2,8,6,.92));text-shadow:0 1px 6px #000}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{padding:15px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);
 color:var(--bright);font-size:16px;font-weight:700;cursor:pointer;animation:rise .3s ease backwards;
 transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip.wide{flex:1 1 100%;text-align:center}

/* ---------- the week (open days) ----------
   David, 14 Sep 2026: "It should show a full week, and allow for selection of
   any days where there are openings and they are available." A week of work is
   not one day; a housekeeper with Mon, Wed and Fri open had to lie to the old
   single chip row. Seven cells, any number of them, weekend included.        */
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.wd{border-radius:16px;border:1.5px solid var(--line);background:var(--panel);
 padding:13px 6px;text-align:center;cursor:pointer;animation:rise .3s ease backwards;
 transition:transform .12s,background .18s,border-color .18s;user-select:none}
.wd:active{transform:scale(.94)}
.wd b{display:block;font-size:16px;font-weight:800;color:var(--bright);line-height:1.1}
.wd i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.4px;color:var(--dim);
 margin-top:4px;text-transform:uppercase}
.wd.wend{border-style:dashed}
.wd.on{background:var(--c);border-color:var(--c);border-style:solid}
.wd.on b{color:#04140e}
.wd.on i{color:rgba(4,20,14,.8);font-weight:800}
.wkline{text-align:center;font-size:12.5px;color:var(--dim);padding:14px 6px 12px;
 min-height:42px;line-height:1.5}
.wkline b{color:var(--bright)}
.wkall{display:block;margin:0 auto;flex:0 0 auto}
.body.mid{display:flex;flex-direction:column;justify-content:center}
.body.mid>*{flex:0 0 auto}
.wkall.on{background:var(--c);color:#04140e;border-color:var(--c)}
.btn.solid:disabled{opacity:.35;cursor:default}

/* ---------- buzz ----------
   Requirement 6 of David's six, sized as the notes size it: no relay, no inbox,
   no typing. A button that rings the other person's phone with your NAME on it,
   the same button on both sides, and the permission asked once from each.     */
.bzlede{font-size:12.5px;line-height:1.55;color:var(--dim);padding:0 2px 12px;text-align:center}
.bzsec{margin-bottom:12px;border-radius:16px;border:1px solid var(--line);
 background:rgba(255,255,255,.04);padding:12px}
.bzsec h5{margin:0 0 8px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
 font-weight:800;color:var(--bright)}
.bzsec p.fine{margin:9px 0 0;font-size:11.5px;line-height:1.5;color:var(--dim)}
.bzsec h5 u{float:right;text-decoration:none;font-size:9px;letter-spacing:.05em;
 padding:2px 8px;border-radius:999px;border:1px solid;text-transform:uppercase}
.bzsec h5 u.rl{color:#8ff0c8;border-color:#16A97C}
.bzsec h5 u.op{color:#f0cc8a;border-color:#E0AE4E}
.bzfacts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 11px;font-size:12px}
.bzfacts dt{color:var(--dim);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
 font-weight:800;padding-top:2px;white-space:nowrap}
.bzfacts dd{margin:0;line-height:1.45;color:#cfe6db}
.bzfacts dd span{display:block;font-size:10.5px;color:var(--dim);margin-top:1px}
.bzfacts dd.pay{color:var(--bright);font-weight:700}

.perm{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 0;line-height:1.4}
.perm+.perm{border-top:1px solid var(--line)}
.perm span{flex:1}
.perm span b{color:var(--bright)}
.sw{flex:0 0 auto;width:46px;height:27px;border-radius:999px;background:var(--line);
 position:relative;cursor:pointer;transition:background .2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
 background:#cfe6db;transition:transform .2s,background .2s}
.sw.on{background:var(--c)}
.sw.on:after{transform:translateX(19px);background:#04140e}
.dirs{display:flex;gap:8px;margin-bottom:11px}
.dirs button{flex:1;padding:11px 6px;border-radius:14px;border:1.5px solid var(--line);
 background:var(--panel);color:var(--dim);font:inherit;font-size:11.5px;font-weight:800;
 cursor:pointer;line-height:1.3}
.dirs button.on{border-color:var(--c);color:var(--bright);background:rgba(255,255,255,.07)}
.bzin{display:flex;gap:8px;align-items:stretch}
.bzin input{flex:1;min-width:0;font:inherit;font-size:16px;color:#eaf3ee;padding:13px 14px;
 border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);outline:none}
.bzin input::placeholder{color:var(--dim)}
.bzin input:focus{border-color:var(--c)}
.bzin button{flex:0 0 auto;padding:0 18px;border-radius:14px;border:0;background:var(--c);
 color:#04140e;font:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:transform .12s}
.bzin button:active{transform:scale(.96)}
.bzin button:disabled{opacity:.35;cursor:default}
.bzleft{font-size:11px;color:var(--dim);text-align:right;padding:7px 2px 0}
.onphone{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:800;
 color:var(--dim);padding:0 2px 6px}
.push{border-radius:16px;border:1px solid var(--c);background:rgba(255,255,255,.07);
 padding:11px 12px;margin-bottom:12px;animation:pop .28s ease;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.push .who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--bright)}
.push .who u{margin-left:auto;text-decoration:none;font-size:10.5px;color:var(--dim);font-weight:600}
.push .av{width:27px;height:27px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:0 0 auto}
.push .msg{font-size:15px;font-weight:800;margin:8px 0 2px}
.push .sub{font-size:12.5px;color:var(--dim)}
.push .rep{display:flex;gap:7px;margin-top:11px}
.push .rep button{flex:1;padding:9px 4px;border-radius:999px;border:1.5px solid var(--c);
 background:transparent;color:var(--bright);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.push .rec{margin-top:10px;font-size:11.5px;color:var(--dim);line-height:1.5}
.push .rec b{color:var(--bright)}
.bznote{font-size:11.5px;line-height:1.55;color:var(--dim);padding:9px 10px;border-radius:12px;
 background:rgba(255,255,255,.04);border-left:3px solid var(--c);margin-top:2px}
.bzwarn{margin-top:10px;font-size:11.5px;color:#f0cc8a;background:rgba(224,174,78,.10);
 border:1px solid rgba(224,174,78,.35);border-radius:12px;padding:9px 10px;line-height:1.5}
.buzzcard{margin-top:14px;border-radius:16px;border:1px solid var(--line);
 background:rgba(255,255,255,.04);padding:12px}
.buzzcard>b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
 color:var(--bright);margin-bottom:6px}
.buzzcard p{margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.5}

/* ---------- result ---------- */
.card{border-radius:22px;overflow:hidden;background:var(--panel);border:1.5px solid var(--line);
 animation:rise .4s ease}
.card .hero{width:100%;aspect-ratio:1.5;object-fit:cover;display:block}
.card .pad{padding:14px}
.card h3{margin:0 0 6px;font-size:18px;letter-spacing:-.3px}
.card p{margin:0 0 11px;font-size:13.5px;color:var(--dim);line-height:1.5}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);
 border:1px solid var(--line);color:#cfe6db}
.draftflag{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#f0cc8a;
 background:rgba(224,174,78,.12);border:1px solid rgba(224,174,78,.4);border-radius:12px;
 padding:10px 12px;margin-bottom:12px}
.todo{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.todo div b{margin-left:auto;color:var(--c);font-size:12.5px}
.todo div{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:12px;border-radius:14px;
 background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer}
.todo div .plus{width:24px;height:24px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto;font-size:15px}
.todo div.did{opacity:.55}
.todo div.did .plus{background:var(--bright)}
.scores{margin-top:14px;border-radius:16px;background:rgba(255,255,255,.04);
 border:1px solid var(--line);padding:12px}
.scores h4{margin:0 0 2px;font-size:12.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--bright)}
.scores .yours{font-size:11.5px;color:var(--dim);margin:0 0 10px}
.scrow{display:flex;gap:8px;margin-bottom:10px}
.sc{flex:1;text-align:center;border-radius:12px;padding:8px 4px;background:rgba(255,255,255,.05);
 border:1px solid var(--line)}
.sc b{display:block;font-size:19px;line-height:1.1}
.sc i{display:block;font-style:normal;font-size:10px;letter-spacing:.6px;color:var(--dim);margin-top:2px}
.sc u{display:block;text-decoration:none;font-size:10px;color:var(--dim);opacity:.8}
.sc u.avail{color:var(--c);opacity:.95;font-weight:700}
.coach .note{font-size:11.5px;line-height:1.5;color:var(--dim);margin-top:8px;
 padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px dashed var(--line)}
.todolab{margin:14px 0 7px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
 font-weight:800;color:var(--bright)}
.coach{font-size:12.5px;line-height:1.5}
.coach .big{display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:12px;
 background:rgba(255,255,255,.05);border:1px solid var(--c);margin-bottom:8px}
.coach .big>span{flex:0 0 auto;font-weight:900;color:var(--c)}
.coach .big div span{font-weight:400;color:var(--dim)}
.coach ul{margin:0;padding-left:18px;color:var(--dim)}
.coach li{margin:3px 0}
.cred{margin-top:12px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);
 border:1px solid var(--line)}
.cred>b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
 color:var(--bright);margin-bottom:8px}
.credlist{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.credlist span{display:flex;align-items:center;gap:8px;font-size:12.5px}
.credlist i{margin-left:auto;font-style:normal;font-weight:700;font-size:12px;color:var(--bright)}
.cred p{margin:0;font-size:11.5px;line-height:1.5;color:var(--dim)}
.pricenote{margin-top:10px;font-size:11.5px;line-height:1.5;color:var(--dim);
 padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.04);
 border-left:3px solid var(--c)}
.gate{margin-top:10px;font-size:11.5px;color:#f0cc8a;background:rgba(224,174,78,.10);
 border:1px solid rgba(224,174,78,.35);border-radius:12px;padding:9px 10px;line-height:1.45}
.hres{margin-top:10px;font-size:12px;border-radius:12px;padding:10px;line-height:1.45;
 border:1px solid var(--line);background:rgba(255,255,255,.05);white-space:pre-wrap;word-break:break-word}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ad{border-radius:18px;overflow:hidden;background:var(--panel);border:1.5px solid var(--line);
 animation:rise .3s ease backwards}
.ad img{width:100%;aspect-ratio:1.25;object-fit:cover;display:block}
.ad .p{padding:9px 10px 11px}
.ad .t{font-size:12.5px;font-weight:700;line-height:1.3;margin-bottom:4px}
.ad .m{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.ad .m b{color:var(--bright)}
.ad .sub{font-size:10.5px;color:var(--dim);margin-bottom:5px}
.ad .ts{font-size:11px;font-weight:800;border:1px solid;border-radius:999px;padding:1px 7px}
.bandlab{grid-column:1/-1;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
 font-weight:800;color:var(--dim);padding:6px 2px 0}
.bandlab:first-child{padding-top:0}
.count{text-align:center;font-size:13px;color:var(--dim);padding:0 0 12px}
.count b{color:var(--bright)}
.foot{flex:0 0 auto;padding:10px 16px calc(env(safe-area-inset-bottom) + 14px)}
.hint{text-align:center;font-size:12px;color:var(--dim);padding-bottom:8px}
/* ---- the lookup: five answers, a hand-over note, and the valuable empty ---- */
.lknote{margin-top:12px;font-size:11.5px;line-height:1.55;color:var(--dim);padding:9px 10px;
 border-radius:12px;background:rgba(255,255,255,.04);border-left:3px solid var(--c)}
.lkempty{font-size:13px;line-height:1.6;color:var(--dim);padding:18px 14px;border-radius:16px;
 border:1px dashed var(--line);background:rgba(255,255,255,.03);text-align:center}
.lkempty>b:first-child{display:block;font-size:15px;color:var(--bright);margin-bottom:6px}
.lkask{margin-top:14px;text-align:center}
.lkask span{display:block;font-size:11px;color:var(--dim);padding-top:7px;line-height:1.5}
/* ---- ask your traders: a phone-around, five at most, never a group ---- */
.trex{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:800;color:var(--dim);padding:2px 2px 7px}
.trd{display:flex;flex-direction:column;gap:7px}
.tr{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;
 border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer}
.tr.on{border-color:var(--c);background:rgba(255,255,255,.09)}
.tr .av{width:30px;height:30px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900;flex:0 0 auto}
.tr .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--bright);line-height:1.25}
.tr .nm span{display:block;font-size:11px;font-weight:500;color:var(--dim)}
.tr i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto}
.tr.on i{border-color:var(--c);background:var(--c)}
.bzsaid{margin-top:11px;font-size:12.5px;line-height:1.55;color:var(--bright);padding:10px 11px;
 border-radius:12px;border:1px solid var(--c);background:rgba(255,255,255,.06);animation:pop .28s ease}
/* ---- the two listing tails ---- */
.whoami{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;
 border:1px solid var(--c);background:rgba(255,255,255,.06);margin-bottom:12px}
.whoami .av{width:30px;height:30px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900;flex:0 0 auto}
.whoami .nm{flex:1;min-width:0;font-size:13px;font-weight:800;color:var(--bright);line-height:1.25}
.whoami .nm span{display:block;font-size:11px;font-weight:500;color:var(--dim)}
.whoami u{text-decoration:none;font-size:11px;color:var(--dim);flex:0 0 auto;cursor:pointer}
.msline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:12px 13px;margin-bottom:14px;
 border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.msline b{font-size:24px;font-weight:900;color:var(--c);line-height:1}
.msline i{font-style:normal;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;
 color:var(--dim);font-weight:800}
.msline u{text-decoration:none;margin-left:auto;font-size:11px;color:var(--dim)}
.msline span{flex:1 0 100%;font-size:11.5px;color:var(--dim);line-height:1.5;padding-top:7px}
.joinbox{margin-top:12px;padding:12px;border-radius:16px;border:1px solid var(--c);
 background:rgba(255,255,255,.05);animation:pop .28s ease}
.joinbox>b:first-child{display:block;font-size:13.5px;color:var(--bright);margin-bottom:9px}
.joinbox p{margin:10px 0 0;font-size:11.5px;line-height:1.55;color:var(--dim)}
.dswitch{display:flex;align-items:center;gap:9px;justify-content:center;margin-top:15px;
 font-size:11px;color:var(--dim);cursor:pointer}
.dswitch i{width:32px;height:18px;border-radius:999px;background:rgba(255,255,255,.14);
 border:1px solid var(--line);position:relative;flex:0 0 auto}
.dswitch i:after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;
 border-radius:50%;background:var(--dim);transition:.18s}
.dswitch.on i{background:var(--c);border-color:var(--c)}
.dswitch.on i:after{left:16px;background:#04140e}

/* LANDSCAPE-1, second half. This block lives at the END of the sheet ON PURPOSE:
   the first attempt sat next to the bezel rule at the top and lost every override to
   the later .orb/.bar declarations - the media query matched and changed nothing,
   which is the most expensive kind of fix because it looks applied. */
@media(max-height:560px){
  html,body{height:auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  #stage{position:static;display:block;min-height:100%}
  #app{width:100%;height:auto;min-height:100svh;overflow:visible;border:0;border-radius:0}
  .screen{min-height:0;justify-content:flex-start;padding:6px 18px 14px}
  .bar{min-height:44px;padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:4px}
  /* The DOOR must still answer in one look - a category you have to scroll to choose is a
     menu, not a door. Everything below it may scroll; this may not. */
  .door{justify-content:center}
  .orb{width:min(27vh,112px)}
  .catrow{margin-top:8px}
  .catname{font-size:21px}
  .dots{margin:6px 0 10px}
  .acts{gap:10px}
  .btn{padding:12px 18px;font-size:14.5px}
  .dswitch{margin-top:9px}
  .foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 34%)}
  .body{overflow:visible}
  /* Three across instead of two: a wide, short screen has the width to spare and it is
     ROWS that cost it. Six tiles become two rows, which is what puts them in one look. */
  .tiles,.grid{grid-template-columns:repeat(3,1fr);gap:8px}
  /* The card's HEIGHT is set by aspect-ratio, not by the image - the image is absolutely
     positioned and covers the card, so overriding its height only hollows the card out.
     Wide-and-short is the landscape shape: 3 across x 2 down, all six in one look. */
  .tile{aspect-ratio:1.95}
  .tile b{padding:14px 10px 7px;font-size:12.5px}
  .body{padding-top:4px}
  .q{font-size:19px;padding:4px 18px 8px}
  .trail{margin-bottom:6px}
}
/* ANOTHER OPTION - the seventh tile. Deliberately NOT a photo: it is the one answer we
   cannot picture, and dressing it as a category would be a lie about what it is. */
.tile.free{display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:rgba(255,255,255,.04);border:1.5px dashed var(--line)}
.tile.free i{font-style:normal;font-size:26px;line-height:1;color:var(--c);font-weight:800}
.tile.free b{position:static;background:none;padding:7px 8px 0;text-shadow:none;
 font-size:13px;color:var(--bright);text-align:center}
.chip.free{border-style:dashed;color:var(--bright)}
.body.mid{justify-content:center}
/* THE REFERRAL LANE */
.buzzcard.vouch{border-color:var(--c);background:rgba(255,255,255,.06)}
.vhead{display:flex;align-items:center;gap:11px;padding:0 2px 14px}
.vhead .av{width:46px;height:46px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex:0 0 auto}
.vhead .nm{font-size:17px;font-weight:800;color:var(--bright);line-height:1.25}
.vhead .nm span{display:block;font-size:12.5px;font-weight:500;color:var(--dim)}
.vlede{font-size:14.5px;line-height:1.65;color:#eaf3ee;padding:0 2px 14px}
.vlede b{color:var(--bright)}
.vsaid{border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);
 padding:14px 15px;margin-bottom:12px}
.vsaid b{display:block;font-size:15px;line-height:1.55;color:#eaf3ee;font-weight:600}
.vsaid span{display:block;font-size:11.5px;color:var(--dim);padding-top:7px}
.vwon{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:12px;padding:13px 14px;
 border-radius:16px;border:1px solid var(--c);background:rgba(255,255,255,.05)}
.vwon b{font-size:26px;font-weight:900;color:var(--c);line-height:1}
.vwon i{font-style:normal;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;
 color:var(--dim);font-weight:800}
.vwon span{flex:1 0 100%;font-size:12px;color:var(--dim);line-height:1.5;padding-top:7px}
/* DOOR-FIT-1 (25 Sep 2026 inspection, quick-03): the door used to CENTRE its overflow, so on a 360x640 phone the
   headline ran up over the top bar and 'Pass Quick on' / the saved-advert card fell off the bottom with no way to
   scroll to them. It now scrolls, stays centred when it fits (the auto margins), and short portrait screens get a
   compact door. #screen-prefixed so these win over the later QUICK-NEXT sheet whatever the order. */
#screen.screen.door{justify-content:flex-start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#screen.screen.door>:first-child{margin-top:auto}
#screen.screen.door>:last-child{margin-bottom:auto}
@media (max-height:760px){
  #screen.screen.door{padding-bottom:14px}
  #screen.door .promise{margin-bottom:12px}
  #screen.door .promise b{font-size:21px}
  #screen.door .promise span{font-size:13.5px;margin-top:4px}

/* REDUCED-MOTION-1 (25 Sep 2026 inspection, shell-22): a phone set to reduce motion gets no pulsing halo, no
   rising tiles and no card flight -- everything lands in its final place at once. */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* A11Y-BUTTONS-1 (25 Sep 2026 inspection, quick-26 / shell-23): the top-bar arrows, the category arrows, the
   answer tiles, the day boxes, the contact rows and the switches are real <button>s now, so TalkBack, VoiceOver and
   a keyboard can reach and press them. These resets keep them looking exactly as the boxes did. */
button.ic{padding:0;font-family:inherit;line-height:1}
button.arw{background:none;border:0;font-family:inherit;line-height:1.2}
button.tile{padding:0;font:inherit;color:inherit;text-align:left;display:block;width:100%}
button.wd{font:inherit;color:inherit;width:100%}
button.tr{width:100%;font:inherit;color:inherit;text-align:left}
button.sw{border:0;padding:0}
button.qs-x{background:none;border:0;color:inherit;font:inherit;cursor:pointer;opacity:.7;font-size:16px;padding:0 2px}
/* DAYS-WORDS-1 (25 Sep 2026 inspection, langq-31): an unpicked day has no label now, so its line keeps its height */
.wd i{min-height:1.3em}
/* MEMBER-BANNER-1 (25 Sep 2026 inspection, langq-15 / quick-15) */
.whoami .whoch{font-size:11px;color:var(--dim);flex:0 0 auto;text-decoration:underline;background:none;border:0;padding:0;font-family:inherit;cursor:pointer;max-width:42%;text-align:right;line-height:1.3}
.whoami .nm span i{font-style:normal}
:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
/* PREVIEW-MARK-1 (25 Sep 2026 inspection, quick-06 / quick-07 / langq-11): the phone-around and the reference
   walk-through are previews -- nothing is sent from them -- and each screen says so in one plain badge. */
.pvmark{display:inline-block;margin:0 auto 10px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;
 letter-spacing:.04em;color:#f0cc8a;background:rgba(224,174,78,.12);border:1px solid rgba(224,174,78,.4)}
.pvwrap{text-align:center}
.vsaid input,.bzin input[readonly]{opacity:.85}
</style>

/* ===========================================================================
   WHERE YOU ARE — a starting point, not a geo feature.
   No map, no radius, no permission prompt. The app already knows a city (it
   passes city= on every listing call today), so that is the starting point and
   it costs the user zero taps. Everything is ordered LOCAL FIRST and only
   reaches further out when the local shelf runs short.
   In the real app LOC comes from the signed-in profile / the existing city
   param. Here it is seeded from the phone's own timezone, which needs no
   permission, and it is changeable in one tap on the area step.
   ------------------------------------------------------------------------- */
var LOC={suburb:'Menlyn', city:'Pretoria'};
(function(){
  try{
    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    var M={'Africa/Johannesburg':['Menlyn','Pretoria']};
    if(M[tz]) LOC={suburb:M[tz][0], city:M[tz][1]};
  }catch(e){}
})();
/* band 0 = her own suburb, 1 = same city, 2 = further out */
function bandName(b){ return b===0?('In '+LOC.suburb):(b===1?('Around '+LOC.city):'Further out'); }

/* ===========================================================================
   THE THREE SCORES — all three already exist in the app, for every category.
     LS  listing quality, 0-100  ... _import_quality_score() in bea_main.py
     TS  seller trust,    0-100  ... the Trust Score / VEL ladder
     RS  ranking score           ... 0.5*LS + 0.5*TS, the same 50/50 as
                                     estate_agents.py::_rank_agents, extended
                                     to listing level by RANK-SURFACE-1 (30 Aug)
   Order is RS, then TS, then LS. Because RS is built out of the other two, the
   tiebreaks are the right way round: equal ranking is settled by trust first
   and listing quality second. ONLY TS IS SHOWN.
   ------------------------------------------------------------------------- */
function rsOf(ls,ts){ return Math.round((0.5*ls + 0.5*ts)*10)/10; }
function trustBand(ts){
  return ts>=90?{n:'Highly trusted',c:'#FBBF24'}
       : ts>=70?{n:'Trusted',c:'#10B981'}
       : ts>=40?{n:'Established',c:'#3B82F6'}
       : {n:'New',c:'#6B7280'};
}

     ts_user cookie the browser already has - same origin, RUL-125(a). There is no
     switch and no sign-in screen; the door simply already knows. */
  /* QUICK-LIVE-1: on the live origin the door already knows who you are, so the demo
     switch is not rendered at all - the rule three lines above, now enforced. */
  /* QUICK-DEMO-OFF-1 (23 Sep 2026, audit F6): the switch was decided by QUICK_LIVE, which is only
     known after /quick/me answers -- AFTER the door has drawn -- so every real visitor saw it.
     It belongs to the file:// review copy alone, which is knowable at once. */

  $('prev').onclick=function(){swipe(-1);};

function cycleHero(first){
  var o=$('orb'); if(!o) return;
  var im=o.getElementsByTagName('img'); if(!im.length) return;
  if(!first){ var n=heroIx; while(n===heroIx&&im.length>1) n=Math.floor(Math.random()*im.length); heroIx=n; }
  function load(j){ var ds=im[j] && im[j].getAttribute('data-src'); if(ds){ im[j].src=ds; im[j].removeAttribute('data-src'); } }
  load(heroIx);                                        /* DOOR-WEIGHT-1 (25 Sep 2026 inspection, live-05) */
  for(var i=0;i<im.length;i++) im[i].className=(i===heroIx?'on':'');
  /* fetch ONE picture ahead, after the door has painted */
  if(!first && im.length>1) load((heroIx+1)%im.length);
  else if(first && im.length>1) setTimeout(function(){ try{ var o2=$('orb'); if(o2 && o2===o) load((heroIx+1)%im.length); }catch(e){} }, 2500);
}
function swipe(d){
  var n=$('cname'); if(n) n.className='catname fade';
  setTimeout(function(){ ci=(ci+d+doorN())%doorN(); drawDoor(); },170);
}

   (vehicle makes, models, brands) is a SINGLE FREE-TEXT BOX - never chips or lists,

   Six hardcoded Gauteng suburbs in every category is the exact failure that ruling

   It collides with RUL-117 (this app is TAP-ONLY), and David's call resolves it: a

   typing only once the list has already failed you. The keyboard is the exception,
   never the greeting.

   WHICH STEPS GET IT is data, not judgement: any step whose value-set churns by city
   or country carries free:true. The 'what' steps (Cleaning, Laundry, Cooking) are
   stable ontologies and deliberately do NOT get one - an escape hatch on every screen
   is just a form with pictures.
   ------------------------------------------------------------------------- */
var FREE_LABEL = 'Another option';

function drawStep(){
  setNav();
  try{ qTrack('q_step_'+(step+1)); }catch(e){}   /* QUICK-FUNNEL-1: which question lost them */
  var f=flow();
  if(step>=f.steps.length){ drawResult(); return; }
  var s=f.steps[step];
  var trail=picks.map(function(p){
    return p.photo?'<img src="'+PH[p.photo]+'" alt="">':'<span>'+p.label+'</span>'; }).join('');
  if(s.kind==='week'){ drawWeek(s,trail); return; }
  var items;
  if(s.kind==='chip'){
    items='<div class="chips">'+s.tiles.map(function(t,i){
      return '<button class="chip'+(t.wide?' wide':'')+'" data-i="'+i+'" style="animation-delay:'
        +(i*35)+'ms">'+t.t+'</button>'; }).join('')
      +(s.free?'<button class="chip free" data-free="1" style="animation-delay:'
        +(s.tiles.length*35)+'ms">'+FREE_LABEL+'</button>':'')+'</div>';
  } else {
    /* A11Y-BUTTONS-1 (25 Sep 2026 inspection, quick-26 / shell-23): each picture tile is a real button */
    items='<div class="tiles">'+s.tiles.map(function(t,i){
      return '<button type="button" class="tile" data-i="'+i+'" style="animation-delay:'+(i*45)+'ms">'
        +'<img src="'+PH[t.p]+'" alt=""><b>'+t.t+'</b></button>'; }).join('')
      +(s.free?'<button type="button" class="tile free" data-free="1" style="animation-delay:'
        +(s.tiles.length*45)+'ms"><i>+</i><b>'+FREE_LABEL+'</b></button>':'')+'</div>';
  }
  $('screen').className='screen';
  $('screen').innerHTML='<div class="q">'+s.q+'</div>'
    +(trail?'<div class="trail">'+trail+'</div>':'')
    +'<div class="body">'+items+'</div>';
  var nodes=$('screen').querySelectorAll('[data-i]');
  for(var k=0;k<nodes.length;k++) nodes[k].onclick=function(){
    var t=s.tiles[+this.getAttribute('data-i')];
    taps++;
    picks.push({label:t.t,photo:t.p||null,key:s.key});
    if(window.svcOnPick) svcOnPick(t);
    step++; drawStep();
  };
  var fx=$('screen').querySelector('[data-free]');
  if(fx) fx.onclick=function(){ taps++; drawFree(s,trail); };
}

/* One line, and it commits the same way a tap does - so everything downstream (the
   trail, the draft, the hand-over payload) needs to know nothing about it. That is
   the whole trick: it is a PICK, not a new kind of answer. */
function drawFree(s,trail){
  var hint = s.freeHint || 'Type it in';
  /* FREE-WORDS-1 (25 Sep 2026 inspection, langq-16 / quick-19): the typing card no longer points at "the six
     above" (nothing is above it, and the list is often not six), and a SEARCHER is not told her words go onto an
     advert. */
  var finding = (mode==='find');
  var lead = finding ? 'Say what you are looking for.' : 'Whatever you type is what people will see.';
  $('screen').className='screen';
  $('screen').innerHTML='<div class="q">'+s.q+'</div>'
    +(trail?'<div class="trail">'+trail+'</div>':'')
    +'<div class="body mid">'
    +'<div class="bzin"><input id="frtxt" type="text" maxlength="80" autocomplete="off" '
    +'autocapitalize="words" placeholder="'+(typeof qTr==='function'?qTr(hint):hint).replace(/"/g,'&quot;')+'"><button id="frgo" disabled>Next</button></div>'
    +'<div class="bzleft" id="frleft">'+lead+'</div>'
    +'<div class="bznote">'+(finding
        ? 'The list only shows the most common answers. We look for exactly what you type.'
        : 'The list only shows the most common answers. What you type goes on your advert exactly as you type it.')+'</div>'
    +'</div>'
    +'<div class="foot"><button class="btn ghost" id="frback" style="width:100%">'
    +'Back to the list</button></div>';
  function paint(){
    var v=$('frtxt').value.trim();
    $('frgo').disabled = v.length < 2;
    $('frleft').textContent = v.length < 2
      ? lead
      : (80 - v.length) + ' characters left';
  }
  $('frtxt').oninput=paint;
  $('frtxt').onkeydown=function(e){ if(e.key==='Enter' && !$('frgo').disabled) $('frgo').click(); };
  $('frgo').onclick=function(){
    var v=$('frtxt').value.trim().replace(/\s+/g,' ');
    picks.push({label:v, photo:null, key:s.key, free:true});
    step++; drawStep();
  };
  $('frback').onclick=function(){ drawStep(); };
  try{ $('frtxt').focus(); }catch(e){}
  paint();
}

/* ===========================================================================
   THE WEEK. (David, 14 Sep 2026: "It should show a full week, and allow for
   selection of any days where there are openings and they are available.")

   The old step was one chip row, Mon to Sat, single choice - so a housekeeper
   with Monday, Wednesday and Friday free had to pick one of them and let the
   advert lie about the other two, and Sunday did not exist at all. What is
   being listed here is TIME (QUICKLIST_DESIGN_NOTES section A), so the week is
   the product, not a detail: seven cells, any number of them on, the weekend
   drawn differently because it is priced and staffed differently, and one
   'Every day' toggle for the person who is simply available.

   It is still tap-only. Nothing is typed, nothing is a form, and the step does
   not advance on the first tap the way the single chips do - it cannot, or the
   second day could never be added - so it ends with one button that also states
   the count back to her before she commits it.
   ------------------------------------------------------------------------- */
function drawWeek(s,trail){
  var order=s.tiles.map(function(t){return t.t;});
  var sel={};
  function isWend(d){ return d==='Sat'||d==='Sun'; }
  function chosen(){ return order.filter(function(d){ return sel[d]; }); }
  $('screen').className='screen';
  $('screen').innerHTML='<div class="q">'+s.q+'</div>'
    +(trail?'<div class="trail">'+trail+'</div>':'')
    +'<div class="body mid">'
    /* A11Y-BUTTONS-1 (25 Sep 2026 inspection, quick-26): each day is a real button that says whether it is picked */
    +'<div class="week" id="wk">'+order.map(function(d,i){
        return '<button type="button" class="wd'+(isWend(d)?' wend':'')+'" data-d="'+i+'" aria-pressed="false" '
          +'style="animation-delay:'+(i*35)+'ms"><b>'+d+'</b><i></i></button>'; }).join('')+'</div>'
    +'<div class="wkline" id="wkline"></div>'
    +'<button class="chip wkall" id="wkall">Every day</button>'
    +'</div>'
    +'<div class="foot"><button class="btn solid" id="wkgo" style="width:100%"></button></div>';
  /* DAYS-WORDS-1 (25 Sep 2026 inspection, langq-31): one idea, one word -- the days she CAN WORK. The cell says
     "yes" when picked and nothing otherwise ("free?" under a day read as "no charge?"). */
  function paint(){
    var g=$('wk');
    for(var i=0;i<order.length;i++){
      var d=order[i], on=!!sel[d];
      g.children[i].className='wd'+(isWend(d)?' wend':'')+(on?' on':'');
      g.children[i].setAttribute('aria-pressed', on?'true':'false');
      g.children[i].getElementsByTagName('i')[0].textContent = on ? 'yes' : '';
    }
    var ch=chosen();
    $('wkall').className='chip wkall'+(ch.length===order.length?' on':'');
    /* each day its own node, so the language layer names the days in her language (langq-02: no fragments) */
    $('wkline').innerHTML = ch.length
      ? (ch.length===order.length
          ? '<b>Every day of the week.</b>'
          : 'Days you can work: '+ch.map(function(x){ return '<b>'+x+'</b>'; }).join(' &middot; '))
      : 'Tap every day you can work. Tap again to remove it.';
    var b=$('wkgo');
    b.disabled=!ch.length;
    b.textContent = ch.length
      ? 'Next \u2014 '+ch.length+(ch.length===1?' day':' days')
      : 'Pick the days you can work';
  }
  var cells=$('wk').children;
  for(var k=0;k<cells.length;k++) cells[k].onclick=function(){
    var d=order[+this.getAttribute('data-d')];
    sel[d]=!sel[d]; taps++; paint();
  };
  $('wkall').onclick=function(){
    var all=chosen().length===order.length;
    for(var i=0;i<order.length;i++) sel[order[i]]=!all;

function lsOf(picks, photos){

     to rent" and "Add the in person or online" were not English. */

            service_type:'Say what work you do'};

  else missing.push({pts:4, t:AREA_ASK[c.key]||'Say where it is'});

     _import_quality_score(), so the number here is still the number the server
     will compute. What changes is what the seller is told: a category that asks
     for more fields (Cars wants five, Housekeeping wants none) is not a seller
     scoring badly, it is a seller with more points still on the table. Cars was
     reading 31 and looking like a failure; it is a 31 with 25 still available. */
  var headroom=0; missing.forEach(function(m){ headroom+=m.pts; });

   a 422 -- so the spreader's OWN first lane, Housekeeping, could not hand over at all. The flow
   knows the basis; it now states it, exactly as the guided flow does (PRICE-UNIT-1). */
var PRICE_BASIS={homehelp:' / day', tutors:' / hour', services:' / call-out', adventures:' / person / night'};
function priceWithBasis(key, label){
  var l=String(label||'').trim(); if(!l) return 'POA';
  if(!PRICE_BASIS[key] || !/\d/.test(l) || /\/|\bper\b|ask|quote|poa/i.test(l)) return l;
  return l+PRICE_BASIS[key];
}
function handoverPayload(){
  var c=cat(), key=c.key;
  var from=FIELD_FROM[key]||{};
  var where=pickOf('where'), price=pickOf('price');
  var ls=lsOf(picks,0);
  var _co=catOut(c);
  var body={
    title: c.draftTitle(picks),
    price: price ? priceWithBasis(key, price.label) : 'POA',
    category: _co.category,
    city: LOC.city,
    area: where ? where.label : LOC.suburb,
    suburb: where ? where.label : LOC.suburb,      /* required by the server */
    description: c.draftBody(picks),
    trust_score: SELLER.ts,
    seller_email: HANDOVER.email || null,
    /* QUICK-RETURN-1 (18 Sep 2026): says which door composed this. The server mails
       the way back ONLY for 'quick' -- every other lane that lands a draft stays
       silent. Without this the draft is composed and then unreachable: PROBED on
       listing 382, a finished 94-score advert orphaned for six days. */
    source: 'quick'
  };
  if(_co.service_class) body.service_class=_co.service_class;
  ['prop_type','listing_type','beds','make','vehicle_year','subject','level','mode','service_type']
    .forEach(function(f){
      var k=from[f]; if(!k) return;
      var pk=pickOf(k); if(!pk) return;
      body[f]=(f==='beds'||f==='vehicle_year') ? parseInt(pk.label,10)||null : pk.label;
    });
  return {body:body, ls:ls};
}
function handOver(done){
  var pay=handoverPayload();
  if(!HANDOVER.url){ done({dry:true, body:pay.body}); return; }
  fetch(HANDOVER.url+'/listings',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Api-Key':HANDOVER.key},
    body:JSON.stringify(pay.body)
  }).then(function(r){
    return r.json().then(function(j){ return {ok:r.ok, status:r.status, j:j}; });
  }).then(function(res){
    done(res.ok ? {id:res.j.id, body:pay.body}
                : {err:(res.j && (res.j.detail||res.j.message)) || ('Server error '+res.status)});
  }).catch(function(e){ done({err:String(e && e.message || e)}); });
}

  if(r && window.SVC_CUSTOMER && SVC_CUSTOMER[r.k]) return {subj:'A customer', demo:'You have used their work'};   /* RUL-172(c) */
  if(k==='homehelp' || (k==='services' && r && r.c==='C')) return {subj:'Your employer', demo:'You employed them'};   /* PRONOUN-1 (25 Sep 2026 inspection, langq-09) */
  if(k==='tutors') return {subj:'A parent or student you teach', demo:'You have used them as a tutor'};
  if(k==='services') return {subj:'A customer you have worked for', demo:'You have used their work'};
  if(k==='adventures') return {subj:'A guest you have hosted', demo:'You have stayed with them'};
  if(k==='localmarket') return {subj:'A customer', demo:'You have bought from them'};   /* CUSTOMER-REF-1 */

/* ===========================================================================
   THE SHELF IS BUILT FROM THE TAPS. (David, 11 Sep 2026: "i selected Maths at
   the start and it is showing me other subjects. That should not happen?")
   It should not, and it did: the old builder drew titles from a fixed list per
   category and never read the picks at all. Now every card is composed FROM
   the answers - the subject, the level, the area, the price band - so a card
   that contradicts a tap cannot be generated in the first place.
   ------------------------------------------------------------------------- */
function pickBy(picks,key){ for(var i=0;i<picks.length;i++) if(picks[i].key===key) return picks[i]; return null; }
function numOf(tok){
  var m=String(tok).replace(/[\s,]/g,'').match(/([\d.]+)\s*([km])?/i);
  if(!m) return null;
  var v=parseFloat(m[1]);
  if(m[2]){ var u=m[2].toLowerCase(); v*= (u==='k'?1000:1000000); }
  return v;
}
/* "Under R200" / "R200-R300" / "Over R300" / "R350" -> [lo,hi] */
function bandOf(label){
  if(!label || /quote|ask|free/i.test(label)) return null;
  var nums=(label.match(/(?:N\$|A\$|KSh|MT|R|P|\u00a3|\u20ac|\$)\s?[\d][\d\s.,]*[km]?/gi)||[]).map(numOf).filter(function(v){return v!=null;});
  if(!nums.length) return null;
  if(/under|less|below/i.test(label)) return [Math.round(nums[0]*0.55), nums[0]];
  if(/over|more|above|\+/i.test(label)) return [nums[0], Math.round(nums[0]*1.55)];
  if(nums.length>=2) return [nums[0], nums[1]];
  return [nums[0], nums[0]];
}
function tsFloorOf(label){
  if(!label) return 0;
  if(/top rated/i.test(label)) return 90;
  var m=String(label).match(/(\d{2})\s*\+/);
  return m?parseInt(m[1],10):0;
}
function money(v){
  v=Math.round(v);
  if(v>=1000000) return 'R'+(Math.round(v/10000)/100).toFixed(2).replace(/\.?0+$/,'')+'m';
  return 'R'+String(v).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

var DETAIL={
 homehelp:['%y years','own transport','references on file','police cleared','weekends too','contactable today'],
 property:['north facing','secure estate','quiet street','close to schools','recently renovated','big garden'],
 cars:['full service history','one owner','%y years old','low mileage','warranty left','spotless inside'],

};

          adventures:' pp',localmarket:''};
var FALLBACK_BAND={homehelp:[250,450],tutors:[150,350],services:[350,700],collectors:[900,20000],
  property:[850000,3400000],cars:[120000,550000],adventures:[1200,6000],localmarket:[80,1500]};

CATS.forEach(function(c){
  c.ads=function(picks,narrow){
    narrow=narrow||[];
    var what=pickBy(picks,'what'), where=pickBy(picks,'where');
    var subject=what?what.label:c.name;
    var anchor=where?where.label:LOC.suburb;          /* an explicit area beats the default */

    /* every other tap becomes part of what the card must say */
    var quals=picks.filter(function(p){
      return p.key!=='what' && p.key!=='where' && !bandOf(p.label); }).map(function(p){return p.label;});
    var notes=narrow.filter(function(p){
      return !bandOf(p.label) && !tsFloorOf(p.label); }).map(function(p){return p.label;});

    /* price and trust constraints, from a tap or from a narrowing chip */
    var band=null, floor=0;
    picks.concat(narrow).forEach(function(p){
      var b=bandOf(p.label); if(b) band=b;
      var f=tsFloorOf(p.label); if(f) floor=Math.max(floor,f);
    });
    if(!band) band=FALLBACK_BAND[c.key]||[100,1000];

    var seed=0, all=picks.concat(narrow);
    all.forEach(function(p){ for(var k=0;k<p.label.length;k++) seed+=p.label.charCodeAt(k); });

    var det=DETAIL[c.key]||['well kept'];
    var pool=[what&&what.photo?what.photo:c._adp[0]].concat(c._adp);
    if(what && /^col_[a-z]+_1$/.test(String(what.photo||''))) pool=[what.photo, what.photo.replace(/_1$/,'_2')];   /* COL-PICS-1: only this kind's pictures */
    var out=[];
    for(var i=0;i<18;i++){
      var y=3+((i*7+seed)%12);
      var d=det[(i+seed)%det.length].replace('%y',y);
      var title=subject+(quals.length?', '+quals[0]:'')+' — '+d;
      var price=band[0]+((band[1]-band[0])*(((i*13+seed)%9)/8));
      var ts=Math.min(99, Math.max(floor||52, (floor||52)+((i*17+seed)%(99-(floor||52)))));
      var ls=44+((i*23+seed+7)%56);
      var bnd=(i%7<3)?0:((i%7<5)?1:2);
      var sub=bnd===0?anchor:(bnd===1?NEARBY[(i+seed)%NEARBY.length]:FURTHER[(i+seed)%FURTHER.length]);
      out.push({p:(i%3===0||i%3===1)?pool[0]:pool[1+((i+seed)%(pool.length-1))],
                t:title, pre:subject+(quals.length?', '+quals[0]:'')+' — ', dix:(i+seed)%det.length, y:y,
                note:notes.join(' · '),
                price:money(price)+(UNIT[c.key]||''), num:price,
                ts:ts, ls:ls, rs:rsOf(ls,ts), band:bnd, sub:sub, trust:ts});
    }
    /* LOCAL FIRST is a source rule; RS -> TS -> LS is the order inside it. */
    out.sort(function(a,b){
      if(a.band!==b.band) return a.band-b.band;
      if(b.rs!==a.rs) return b.rs-a.rs;
      if(b.ts!==a.ts) return b.ts-a.ts;
      return b.ls-a.ls;
    });
    /* NO TWO CARDS ON ONE SHELF MAY READ THE SAME. The ORDER is never touched -
       RS -> TS -> LS still decides every position; only the descriptive tail is
       rotated to the next one not already used above it. A shelf of five that
       repeats a line reads as a bug to the person looking at it. */
    var seen={};
    out.forEach(function(a){
      var n=0;
      while(seen[a.t] && n<det.length){
        a.dix=(a.dix+1)%det.length;
        a.t=a.pre+det[a.dix].replace('%y',a.y);
        n++;
      }
      seen[a.t]=1;
    });
    return out;
  };
  c.draftTitle=function(picks){ return picks[0].label+' — '+(picks[1]?picks[1].label:c.name); };
  /* QUICK-ADTEXT-1 (23 Sep 2026, audit F1): this used to write OUR coaching line ("Written from
     your N taps ... Change any word of it before it goes up") into the advert's description --
     the words a buyer would read. The advert now says only what she told us, in plain sentences. */
  c.draftBody=function(picks){ return qAdBody(c, picks); };
});

": "Tefo ya pitso", "xh": "Intlawulo yobizo", "nso": "Tefo ya pitšo"}, "Then per hour": {"af": "Daarna per uur", "zu": "Bese ngehora", "st": "Ebe ka hora", "xh": "Emva koko ngeyure", "nso": "Ke moka ka iri"}, "optional": {"af": "opsioneel", "zu": "akuphoqelekile", "st": "ha ho qobelle", "xh": "akunyanzelekanga", "nso": "ga go gapeletšwe"}, "Your amount": {"af": "Jou bedrag", "zu": "Inani lakho", "st": "Tjhelete ya hao", "xh": "Isixa sakho", "nso": "Tšhelete ya gago"}, "Plus parts and materials": {"af": "Plus onderdele en materiaal", "zu": "Kanye nezingxenye nezinto zokusebenza", "st": "Le dikarolo le disebediswa", "xh": "Kunye namalungu nezixhobo", "nso": "Le dikarolo le didirišwa"}, "Next": {"af": "Volgende", "zu": "Okulandelayo", "st": "E latelang", "xh": "Okulandelayo", "nso": "Latelang"}, "Your price, your call. Type what your work is worth.": {"af": "Jou prys, jou besluit. Tik wat jou werk werd is.", "zu": "Inani lakho, isinqumo sakho. Bhala ukuthi umsebenzi wakho ubiza malini.", "st": "Theko ya hao, qeto ya hao. Ngola hore mosebetsi wa hao o bohlokwa hakae.", "xh": "Ixabiso lakho, isigqibo sakho. Bhala ukuba umsebenzi wakho uxabisa malini.", "nso": "Theko ya gago, sephetho sa gago. Ngwala gore mošomo wa gago o bohlokwa bokae."}, "That is below the national minimum wage.": {"af": "Dit is onder die nasionale minimumloon.", "zu": "Lokhu kungaphansi kweholo elincane likazwelonke.", "st": "Hona ho ka tlase ho moputso o tlase wa naha.", "xh": "Oku kungaphantsi komvuzo omncinci wesizwe.", "nso": "Se se ka tlase ga moputso wa fasana wa naga."}, "List something else": {"af": "Adverteer iets anders", "zu": "Faka okunye", "st": "Kenya se seng", "xh": "Faka enye into", "nso": "Tsenya se sengwe"}, "Close": {"af": "Maak toe", "zu": "Vala", "st": "Kwala", "xh": "Vala", "nso": "Tswalela"}, "Your employer says": {"af": "Jou werkgewer sê", "zu": "Umqashi wakho uthi", "st": "Mohiri wa hao o re", "xh": "Umqeshi wakho uthi", "nso": "Mothwadi wa gago o re"}, "A parent or student you teach says": {"af": "’n Ouer of leerder vir wie jy klas gee, sê", "zu": "Umzali noma umfundi omfundisayo uthi", "st": "Motswadi kapa moithuti eo o mo rutang o re", "xh": "Umzali okanye umfundi omfundisayo uthi", "nso": "Motswadi goba moithuti yo o mo rutago o re"}, "A customer you have worked for says": {"af": "’n Klant vir wie jy gewerk het, sê", "zu": "Ikhasimende osebenzele lona lithi", "st": "Moreki eo o kileng wa mo sebeletsa o re", "xh": "Umthengi omsebenzeleyo uthi", "nso": "Moreki yo o kilego wa mo šomela o re"}, "A guest you have hosted says": {"af": "’n Gas wat jy ontvang het, sê", "zu": "Isivakashi osake wasamukela sithi", "st": "Moeti eo o kileng wa mo amohela o re", "xh": "Undwendwe owakhe walwamkela luthi", "nso": "Moeng yo o kilego wa mo amogela o re"}, "Someone you have worked for says": {"af": "Iemand vir wie jy gewerk het, sê", "zu": "Umuntu osake wamsebenzela uthi", "st": "Motho eo o kileng wa mo sebeletsa o re", "xh": "Umntu owakhe wamsebenzela uthi", "nso": "Motho yo o kilego wa mo šomela o re"}, "one sentence": {"af": "een sin", "zu": "umusho owodwa", "st": "polelo e le nngwe", "xh": "isivakalisi esinye", "nso": "lefoko le tee"}, "about you. That is what opens your trust score — nothing you write about yourself can do it. Four taps on their side, and they never have to use TrustSquare again.": {"af": "oor jou. Dit is wat jou vertrouenstelling oopmaak — niks wat jy oor jouself skryf, kan dit doen nie. Vier tikke aan hulle kant, en hulle hoef nooit weer TrustSquare te gebruik nie.", "zu": "ngawe. Yilokho okuvula amaphuzu akho okwethenjwa — akukho lutho olubhala ngawe ongakwenza lokho. Ukuthinta okune ohlangothini lwabo, futhi abasoze bawusebenzise futhi uTrustSquare.", "st": "ka wena. Ke sona se bulang sekoro sa hao sa tshepo — ha ho letho leo o le ngolang ka wena le ka etsang seo. Ho tobetsa hane ka lehlakoreng la bona, mme ha ba sa tla hlola ba sebedisa TrustSquare.", "xh": "ngawe. Yiyo evula amanqaku akho okuthenjwa — akukho nto oyibhalayo ngawe enokwenza oko. Ukucofa kane kwicala labo, kwaye abasoze baphinde basebenzise iTrustSquare.", "nso": "ka wena. Ke sona se bulago sekoro sa gago sa go tshepega — ga go selo seo o se ngwalago ka wena se ka dirago seo. Dikgotlo tše nne ka lehlakoreng la bona, gomme ga ba sa swanela go šomiša TrustSquare gape."}, "Buzz — one line to the other phone": {"af": "Buzz — een reël na die ander foon", "zu": "Buzz — umugqa owodwa kwenye ifoni", "st": "Buzz — mola o le mong ho fono e nngwe", "xh": "Buzz — umgca omnye kwenye ifowuni", "nso": "Buzz — mothaladi o tee go founo ye nngwe"}, "They have exactly the same button for you. One line each way, no thread to scroll, and email catches it if their push is off.": {"af": "Hulle het presies dieselfde knoppie vir jou. Een reël elke kant toe, geen draad om deur te rol nie, en e-pos vang dit as hul kennisgewings af is.", "zu": "Nabo banenkinobho efanayo ngqo yakho. Umugqa owodwa ngapha nangapha, ayikho intambo yokuskrola, futhi i-imeyili iyakubamba uma izaziso zabo zivaliwe.", "st": "Le bona ba na le konopo e tshwanang hantle bakeng sa hao. Mola o le mong ka nqa ka nngwe, ha ho puisano e telele, mme imeile e e tshwara ha ditsebiso tsa bona di timilwe.", "xh": "Nabo banenqaku elifanayo ncam lakho. Umgca omnye kwicala ngalinye, akukho mtya wokuskrola, kwaye i-imeyile iyayibamba ukuba izaziso zabo zicinyiwe.", "nso": "Le bona ba na le konopo ye e swanago gabotse ya gago. Mothaladi o tee ka lehlakore le lengwe le le lengwe, ga go poledišano ye telele, gomme imeile e e swara ge ditsebišo tša bona di timilwe."}, "One line to the parents you teach for - a moved lesson, an exam week, a late child.": {"af": "Een reël na die ouers vir wie jy klas gee - ’n geskuifde les, ’n eksamenweek, ’n laat kind.", "zu": "Umugqa owodwa kubazali obafundisela - isifundo esihanjisiwe, isonto lezivivinyo, ingane efike sekwephuzile.", "st": "Mola o le mong ho batswadi bao o ba rutelang - thuto e sutisitsweng, beke ya ditlhahlobo, ngwana ya diehang.", "xh": "Umgca omnye kubazali obafundisela - isifundo esishenxisiweyo, iveki yeemviwo, umntwana ofika emva kwexesha.", "nso": "Mothaladi o tee go batswadi bao o ba rutelago - thuto ye e šuthišitšwego, beke ya ditlhahlobo, ngwana yo a diegilego."}, "One line to your regular customers - on my way, running late, job done.": {"af": "Een reël na jou vaste kliënte - op pad, laat, werk klaar.", "zu": "Umugqa owodwa kumakhasimende akho ajwayelekile - ngisendleleni, ngizophuza, umsebenzi uqediwe.", "st": "Mola o le mong ho bareki ba hao ba kamehla - ke tseleng, ke tla dieha, mosebetsi o phethilwe.", "xh": "Umgca omnye kubathengi bakho abaqhelekileyo - ndisendleleni, ndiza kufika emva kwexesha, umsebenzi ugqityiwe.", "nso": "Mothaladi o tee go bareki ba gago ba ka mehla - ke tseleng, ke tla diega, mošomo o phethilwe."}, "One line to every guest who asked - dates, late arrivals, one more bed.": {"af": "Een reël na elke gas wat gevra het - datums, laat aankomste, nog een bed.", "zu": "Umugqa owodwa kuso sonke isivakashi esibuzile - izinsuku, ukufika sekwephuzile, omunye umbhede.", "st": "Mola o le mong ho moeti e mong le e mong ya botsitseng - matsatsi, ho fihla ka morao, bethe e nngwe.", "xh": "Umgca omnye kulo lonke undwendwe olubuzileyo - imihla, ukufika emva kwexesha, enye ibhedi.", "nso": "Mothaladi o tee go moeng yo mongwe le yo mongwe yo a botšišitšego - matšatši, go fihla morago, malao a mangwe."}, "One line to everyone who asked about your place - viewings, offers, show days.": {"af": "Een reël na almal wat oor jou plek gevra het - besigtigings, aanbiedinge, skoudae.", "zu": "Umugqa owodwa kubo bonke ababuze ngendawo yakho - ukubuka, izithembiso, izinsuku zokubukisa.", "st": "Mola o le mong ho bohle ba botsitseng ka sebaka sa hao - ho sheba, dinyehelo, matsatsi a pontsho.", "xh": "Umgca omnye kubo bonke ababuze ngendawo yakho - ukujonga, izithembiso, iintsuku zomboniso.", "nso": "Mothaladi o tee go bohle bao ba botšišitšego ka lefelo la gago - go lebelela, dithekišo, matšatši a pontšho."}, "Ask the people who would know": {"af": "Vra die mense wat sal weet", "zu": "Buza abantu abangazi", "st": "Botsa batho ba ka tsebang", "xh": "Buza abantu abanokwazi", "nso": "Botšiša batho bao ba ka tsebago"}, "One line, to each of them separately. They never see each other — this is the phone-around, not a group.": {"af": "Een reël, aan elkeen afsonderlik. Hulle sien mekaar nooit nie — dis rondbel, nie ’n groep nie.", "zu": "Umugqa owodwa, komunye nomunye ngokwehlukana. Abasoze babonane — lokhu ukushayela abantu, akulona iqembu.", "st": "Mola o le mong, ho e mong le e mong ka thoko. Ha ba bonane — ena ke ho letsetsa batho, e seng sehlopha.", "xh": "Umgca omnye, komnye nomnye ngokwahlukeneyo. Abaze babonane — oku kukutsalela abantu umnxeba, asiloqela.", "nso": "Mothaladi o tee, go yo mongwe le yo mongwe ka noši. Ga ba bonane — se ke go leletša batho, e sego sehlopha."}, "Examples — in the app you pick from your own contacts": {"af": "Voorbeelde — in die app kies jy uit jou eie kontakte", "zu": "Izibonelo — ku-app ukhetha kubantu bakho", "st": "Mehlala — ho app o kgetha ho batho ba hao", "xh": "Imizekelo — kwi-app ukhetha kubantu bakho", "nso": "Mehlala — ka go app o kgetha go batho ba gago"}, "Each one is an ordinary buzz, with your name on it, and each of them can switch you off on their own. There is no group and no thread — whoever knows something buzzes you back.": {"af": "Elkeen is ’n gewone buzz, met jou naam daarop, en elkeen kan jou self afskakel. Daar is geen groep en geen draad nie — wie iets weet, buzz jou terug.", "zu": "Ngayinye iyi-buzz ejwayelekile, enegama lakho, futhi ngamunye angakucisha yedwa. Alikho iqembu futhi ayikho intambo — noma ubani owaziyo uzokubuzela emuva.", "st": "E nngwe le e nngwe ke buzz e tlwaelehileng, e nang le lebitso la hao, mme e mong le e mong a ka o tima a le mong. Ha ho sehlopha ebile ha ho puisano — ya tsebang ho hong o tla o buzz hape.", "xh": "Nganye yi-buzz eqhelekileyo, enegama lakho, kwaye nganye inokukucima , "nso": "Se sengwe le se sengwe sa tše se oketša meputso ya papatšo ya gago"}, "Tap every day you can work. Tap again to remove it.": {"af": "Tik op elke dag waarop jy kan werk. Tik weer op ’n dag om dit af te haal.", "zu": "Thinta usuku ngalunye okhululekile ngalo. Thinta futhi ukuze ulususe.", "st": "", "xh": "Cofa yonke imihla ekhululekileyo. Cofa kwakhona ukuyirhoxisa.", "nso": "Kgotla letšatši le lengwe le le lengwe leo o lokologilego. Kgotla gape go le tloša."}, "Pick the days you can work": {"af": "Kies die dae waarop jy kan werk", "zu": "Khetha izinsuku zakho", "st": "", "xh": "Khetha iintsuku zakho", "nso": "Kgetha matšatši a gago"}, "Which days can you work?": {"af": "Op watter dae kan jy werk?", "zu": "Yiziphi izinsuku otholakala ngazo?", "st": "O fumaneha ka matsatsi afe?", "xh": "Zeziphi iintsuku ofumaneka ngazo?", "nso": "O bulegile ka matšatši afe?"}, "Which qualification do you have?": {"af": "Watter kwalifikasie het jy?", "zu": "Unaziphi iziqu?", "st": "O na le lengolo lefe?", "xh": "Unaziphi iziqinisekiso?", "nso": "O na le lengwalo lefe?"}, "Tap one to ask for an introduction — it opens in TrustSquare.": {"af": "Tik op een om ’n voorstelling te vra — dit gaan in TrustSquare oop.", "zu": "Thinta esisodwa ukuze ucele isethulo — kuvuleka ku-TrustSquare.", "st": "", "xh": "Cofa enye ukuze ucele intshayelelo — iyavuleka kwiTrustSquare.", "nso": "Kgotla e tee go kgopela tsebišo — e bulega go TrustSquare."}, "A 6-digit code comes by SMS. Introductions reach you on this number.": {"af": "’n 6-syfer-kode kom per SMS. Voorstellings bereik jou op hierdie nommer.", "zu": "Ikhodi yezinombolo ezi-6 ifika nge-SMS. Izethulo zikufinyelela kule nombolo.", "st": "", "xh": "Ikhowudi yamanani ama-6 iza nge-SMS. Iintshayelelo zifika kuwe kule nombolo.", "nso": "Khoutu ya dinomoro tše 6 e tla ka SMS. Ditsebišo di go fihlelela ka nomoro ye."}, "Type the 6 digits from the SMS.": {"af": "Tik die 6 syfers uit die SMS in.", "zu": "Bhala izinombolo ezi-6 ezise-SMS.", "st": "", "xh": "Bhala amanani ama-6 akwi-SMS.", "nso": "Ngwala dinomoro tše 6 tše di lego go SMS."}, "No email needed. You get a private link that is your key to this advert — send it to yourself on WhatsApp and keep it. Introductions wait for you inside.": {"af": "Geen e-pos nodig nie. Jy kry ’n privaat skakel wat jou sleutel tot hierdie advertensie is — stuur dit vir jouself op WhatsApp en hou dit. Voorstellings wag vir jou daarbinne.", "zu": "Ayidingeki i-imeyili. Uthola isixhumanisi esiyimfihlo esiwukhiye wakho walesi sikhangiso — sizithumelele ku-WhatsApp bese usigcina. Izethulo zikulindile ngaphakathi.", "st": "", "xh": "Akufuneki i-imeyile. Ufumana ikhonkco eliyimfihlo eliyisitshixo sakho kwesi sibhengezo — lizithumelele kuWhatsApp uligcine. Iintshayelelo zikulindile ngaphakathi.", "nso": "Ga go nyakege imeile. O hwetša kgokagano ya sephiri yeo e lego senotlelo sa gago sa papatšo ye — e iromele ka WhatsApp gomme o e boloke. Ditsebišo di go letile ka gare."}, "Email": {"af": "E-pos", "zu": "I-imeyili", "st": "", "xh": "I-imeyile", "nso": "Imeile"}, "Phone": {"af": "Foon", "zu": "Ifoni", "st": "", "xh": "Ifowuni", "nso": "Founo"}, "WhatsApp link": {"af": "WhatsApp-skakel", "zu": "Isixhumanisi se-WhatsApp", "st": "", "xh": "Ikhonkco leWhatsApp", "nso": "Kgokagano ya WhatsApp"}, "Save my advert": {"af": "Stoor my advertensie", "zu": "Gcina isikhangiso sami", "st": "", "xh": "Gcina isibhengezo sam", "nso": "Boloka papatšo ya ka"}, "Saving…": {"af": "Stoor tans…", "zu": "Iyagcina…", "st": "", "xh": "Iyagcina…", "nso": "E a bolokwa…"}, "Free. Before it goes live, you read and sign the {terms} in the app.": {"af": "Gratis. Voordat dit sigbaar word, lees en teken jy die {terms} in die app.", "zu": "Mahhala. Ngaphambi kokuthi sibonakale, ufunda bese usayina {terms} ku-app.", "st": "", "xh": "Simahla. Phambi kokuba sipapashwe, ufunda uze usayine {terms} kwi-app.", "nso": "Ke mahala. Pele e thoma go phela, o bala gomme o saena {terms} ka go app."}, "Sign the terms and publish": {"af": "Teken die bepalings en plaas dit", "zu": "Sayina imigomo bese ushicilela", "st": "", "xh": "Sayina imimiselo uze upapashe", "nso": "Saena melawana gomme o phatlalatše"}, "Your private key link": {"af": "Jou privaat sleutelskakel", "zu": "Isixhumanisi sakho sokhiye esiyimfihlo", "st": "", "xh": "Ikhonkco lakho lesitshixo eliyimfihlo", "nso": "Kgokagano ya gago ya senotlelo sa sephiri"}, "Send my key to myself on WhatsApp": {"af": "Stuur my sleutel vir myself op WhatsApp", "zu": "Zithumelele ukhiye wakho ku-WhatsApp", "st": "", "xh": "Ndizithumelele isitshixo sam kuWhatsApp", "nso": "Ke iromele senotlelo sa ka ka WhatsApp"}, "Pass Quick on to someone": {"af": "Stuur Quick vir iemand anders", "zu": "Dlulisela i-Quick komunye umuntu", "st": "", "xh": "Dlulisela iQuick komnye umntu", "nso": "Fetišetša Quick go motho yo mongwe"}, "Your phone number": {"af": "Jou foonnommer", "zu": "Inombolo yakho yefoni", "st": "", "xh": "Inombolo yakho yefowuni", "nso": "Nomoro ya gago ya founo"}, "Send code": {"af": "Stuur kode", "zu": "Thumela ikhodi", "st": "", "xh": "Thumela ikhowudi", "nso": "Romela khoutu"}, "6-digit code": {"af": "6-syfer-kode", "zu": "Ikhodi yezinombolo ezi-6", "st": "", "xh": "Ikhowudi yamanani ama-6", "nso": "Khoutu ya dinomoro tše 6"}, "Confirm": {"af": "Bevestig", "zu": "Qinisekisa", "st": "", "xh": "Qinisekisa", "nso": "Netefatša"}, "Type the number you use for SMS, for example 082 123 4567.": {"af": "Tik die nommer wat jy vir SMS’e gebruik, byvoorbeeld 082 123 4567.", "zu": "Bhala inombolo oyisebenzisela ama-SMS, isibonelo 082 123 4567.", "st": "", "xh": "Bhala inombolo oyisebenzisela ii-SMS, umzekelo 082 123 4567.", "nso": "Ngwala nomoro ye o e šomišago go SMS, mohlala 082 123 4567."}, "Type your mobile number.": {"af": "Tik jou selfoonnommer.", "zu": "Bhala inombolo yakho yeselula.", "st": "", "xh": "Bhala inombolo yakho yeselfowuni.", "nso": "Ngwala nomoro ya gago ya selefouno."}, "Sending the code…": {"af": "Stuur tans die kode…", "zu": "Ithum
