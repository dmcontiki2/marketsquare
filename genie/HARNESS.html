"xh": "Jonga idatha yakho uze uzame kwakhona.", "nso": "Lekola data ya gago gomme o leke gape."}, "EXAMPLE PHOTO": {"af": "VOORBEELDFOTO", "zu": "ISITHOMBE SESIBONELO", "st": "", "xh": "UMFANEKISO WOMZEKELO", "nso": "SEHLAKANGWA SA MOHLALA"}, "One line, straight to the other phone, with your name on it. No thread, no history, nothing to scroll — say the one thing and it is said.": {"af": "Een reël, reguit na die ander foon, met jou naam daarop. Geen draad, geen geskiedenis, niks om deur te rol nie — sê die een ding en dit is gesê.", "zu": "Umugqa owodwa, uqonde kwenye ifoni, unegama lakho. Ayikho intambo, awukho umlando, akukho okuskrolwayo — sho into eyodwa, bese isishiwo.", "st": "", "xh": "Umgca omnye, ngqo kwenye ifowuni, enegama lakho. Akukho mtya, akukho mbali, akukho nto yokuskrola — yitsho into enye, kwaye sele itshiwo.", "nso": "Mothaladi o tee, thwii go founo ye nngwe, wo o nago le leina la gago. Ga go poledišano ye telele, ga go histori, ga go selo sa go sekrola — bolela selo se tee, gomme se boletšwe."}, "how it works here": {"af": "hoe dit hier werk", "zu": "ukuthi kusebenza kanjani lapha", "st": "", "xh": "indlela esebenza ngayo apha", "nso": "ka moo e šomago ka gona mo"}, "Who": {"af": "Wie", "zu": "Ubani", "st": "", "xh": "Ngubani", "nso": "Mang"}, "How you met": {"af": "Hoe julle ontmoet het", "zu": "Nahlangana kanjani", "st": "", "xh": "Nadibana njani", "nso": "Ka moo le kopanego ka gona"}, "Who paid": {"af": "Wie het betaal", "zu": "Ubani okhokhile", "st": "", "xh": "Ngubani ohlawulileyo", "nso": "Yo a lefilego"}, "Switched on in the TrustSquare app — once, by each of you": {"af": "Een keer aangeskakel in die TrustSquare-app, deur elkeen van julle", "zu": "Kuvulwa ku-app ye-TrustSquare — kanye, ngamunye wenu", "st": "", "xh": "Ivulwa kwi-app yeTrustSquare — kanye, ngumntu ngamnye kuni", "nso": "E bulwa ka go app ya TrustSquare — gatee, ke yo mongwe le yo mongwe wa lena"}, "Let TrustSquare buzz this phone": {"af": "Laat TrustSquare hierdie foon buzz", "zu": "Vumela i-TrustSquare ithumele i-buzz kule foni", "st": "", "xh": "Vumela iTrustSquare ithumele i-buzz kule fowuni", "nso": "Dumelela TrustSquare go romela buzz go founo ye"}, "Let": {"af": "Laat", "zu": "Vumela", "st": "", "xh": "Vumela", "nso": "Dumelela"}, "buzz me": {"af": "my buzz", "zu": "angithumelele i-buzz", "st": "", "xh": "andithumelele i-buzz", "nso": "go nthomelela buzz"}, "They answer the same two questions when they join from your link.": {"af": "Hulle beantwoord dieselfde twee vrae wanneer hulle via jou skakel aansluit.", "zu": "Baphendula imibuzo emibili efanayo uma bejoyina ngesixhumanisi sakho.", "st": "", "xh": "Baphendula imibuzo emibini efanayo xa bejoyina ngekhonkco lakho.", "nso": "Ba araba dipotšišo tše pedi tše di swanago ge ba tsena ka kgokagano ya gago."}, "Only the people you are paired with can buzz you — a buzz is never open to strangers.": {"af": "Net die mense met wie jy gekoppel is, kan jou buzz — ’n buzz is nooit oop vir vreemdelinge nie.", "zu": "Abantu obhangqwe nabo kuphela abangakuthumelela i-buzz — i-buzz ayivulekele neze abantu ongabazi.", "st": "", "xh": "Ngabantu odityaniswe nabo kuphela abanokukuthumelela i-buzz — i-buzz ayisoze ivulelwe abantu ongabaziyo.", "nso": "Ke fela batho bao o kopantšwego le bona bao ba ka go romelelago buzz — buzz ga e bulegele batho bao o sa ba tsebego le ka mohla."}, "You each switch this on once, in the TrustSquare app.": {"af": "Julle skakel dit elkeen een keer aan, in die TrustSquare-app.", "zu": "Ngamunye wenu uvula lokhu kanye, ku-app ye-TrustSquare.", "st": "", "xh": "Ngamnye kuni uyivula kanye, kwi-app yeTrustSquare.", "nso": "Yo mongwe le yo mongwe wa lena o bula se gatee, ka go app ya TrustSquare."}, "It arrives as a notification on their phone. If notifications are off, it goes to their email. It is free — no SMS.": {"af": "Dit kom as ’n kennisgewing op hul foon aan. As kennisgewings af is, gaan dit na hul e-pos. Dit is gratis — geen SMS nie.", "zu": "Ifika njengesaziso efonini yabo. Uma izaziso zivaliwe, iya ku-imeyili yabo. Imahhala — akukho SMS.", "st": "", "xh": "Ifika njengesaziso kwifowuni yabo. Ukuba izaziso zicinyiwe, iya kwi-imeyile yabo. Simahla — akukho SMS.", "nso": "E fihla go founo ya bona bjalo ka tsebišo. Ge ditsebišo di timilwe, e ya go imeile ya bona. Ke mahala — ga go SMS."}, "This is an example. Nothing is sent from this screen.": {"af": "Dit is ’n voorbeeld. Niks word van hierdie skerm af gestuur nie.", "zu": "Lesi yisibonelo. Akukho okuthunyelwa kusuka kulesi sikrini.", "st": "", "xh": "Lo ngumzekelo. Akukho nto ithunyelwa kwesi sikrini.", "nso": "Wo ke mohlala. Ga go se se romelwago go tšwa sekirining se."}, "Live — this sends a real buzz.": {"af": "Regstreeks — dit stuur ’n regte buzz.", "zu": "Bukhoma — lokhu kuthumela i-buzz yangempela.", "st": "", "xh": "Ngokwenene — oku kuthumela i-buzz yokwenyani.", "nso": "E a phela — se se romela buzz ya nnete."}, "Send a buzz": {"af": "Stuur ’n buzz", "zu": "Thumela i-buzz", "st": "", "xh": "Thumela i-buzz", "nso": "Romela buzz"}, "Back to my advert": {"af": "Terug na my advertensie", "zu": "Buyela esikhangisweni sami", "st": "", "xh": "Buyela kwisibhengezo sam", "nso": "Boela papatšong ya ka"}, "Buzz is a convenience, not a guarantee — phones go flat and networks fail, so if it matters, phone. Either of you can close it at any time: closing it closes it for both, the other person is told plainly, and whoever closed it can open it again. You already have each other’s numbers.": {"af": "Buzz is ’n gerief, nie ’n waarborg nie — fone gaan pap en netwerke faal, so as dit saak maak, bel. Enigeen van julle kan dit enige tyd sluit: as een dit sluit, is dit vir albei gesluit, die ander persoon word duidelik ingelig, en wie dit gesluit het, kan dit weer oopmaak. Julle het reeds mekaar se nommers.", "zu": "I-Buzz iwusizo, akusona isiqinisekiso — amafoni ayaphelelwa yibhethri namanethiwekhi ayehluleka, ngakho uma kubalulekile, shayela ucingo. Noma ngubani kinina angayivala noma nini: uma omunye eyivala, ivaleka kinina nobabili, omunye utshelwa ngokucacile, futhi lowo oyivalile angaphinda ayivule. Senivele ninazo izinombolo zomunye nomunye.", "st": "", "xh": "IBuzz luncedo, ayisosiqinisekiso — iifowuni ziyafa kwaye uthungelwano luyasilela, ngoko ukuba kubalulekile, tsalela umnxeba. Nabani na kuni angayivala nanini na: ukuyivala kuyivalela nobabini, omnye umntu uxelelwa ngokucacileyo, kwaye lowo uyivalileyo angayivula kwakhona. Sele ninazo iinombolo zomnye nomnye.", "nso": "Buzz ke boiketlo, e sego kgonthišo — difouno di fela mohlagase gomme dinetweke di a palelwa, ka fao ge taba e le bohlokwa, leletša. Mang goba mang wa lena a ka e tswalela nako efe goba efe: ge e tswaletšwe, e tswaletšwe go lena ka bobedi, motho yo mongwe o botšwa ka go hlaka, gomme yo a e tswaletšego a ka e bula gape. Le šetše le na le dinomoro tša yo mongwe le yo mongwe."}, "Switch both permissions on first — a buzz that was never allowed is a buzz that never arrives.": {"af": "Skakel eers albei toestemmings aan — ’n buzz wat nooit toegelaat is nie, is ’n buzz wat nooit aankom nie.", "zu": "Qala uvule izimvume zombili — i-buzz engakaze ivunyelwe yi-buzz engasoze ifike.", "st": "", "xh": "Qala uvule zombini iimvume — i-buzz engazange ivunyelwe yi-buzz engasoze ifike.", "nso": "Bula ditumelelo ka bobedi pele — buzz ye e sa kago ya dumelelwa ke buzz ye e sa fihlego le ka mohla."}, "When the car is sold, close every one of them. Here that is the feature working, not failing — the pair was always meant to end.": {"af": "Wanneer die motor verkoop is, sluit almal. Hier is dit die funksie wat werk, nie faal nie — die paar was nog altyd bedoel om te eindig.", "zu": "Uma imoto isithengisiwe, zivale zonke. Lapha lokho kusho ukuthi isici siyasebenza, asehluleki — isibhangqa besihloselwe ukuphela kusukela ekuqaleni.", "st": "", "xh": "Xa imoto ithengisiwe, zivale zonke. Apha oko yinkqubo esebenzayo, hayi esilelayo — isibini besisoloko simiselwe ukuphela.", "nso": "Ge koloi e rekišitšwe, di tswalele ka moka. Mo, seo se ra gore karolo ye e a šoma, ga se gore e paletšwe — para e be e swanetše go fela go tloga mathomong."}, "your employer, Menlyn": {"af": "jou werkgewer, Menlyn", "zu": "umqashi wakho, eMenlyn", "st": "", "xh": "umqeshi wakho, eMenlyn", "nso": "mothwadi wa gago, Menlyn"}, "the agency holding your listing": {"af": "die agentskap wat jou advertensie hanteer", "zu": "i-ejensi ephethe isikhangiso sakho", "st": "", "xh": "i-arhente ephethe isibhengezo sakho", "nso": "etšensi ye e swerego papatšo ya gago"}, "one of the places you asked": {"af": "een van die plekke wat jy gevra het", "zu": "enye yezindawo ozibuzile", "st": "", "xh": "enye yeendawo ozibuzileyo", "nso": "le lengwe la mafelo ao o a botšišitšego"}, "the plumber you called": {"af": "die loodgieter wat jy gebel het", "zu": "umlungisi wamapayipi omshayele", "st": "", "xh": "umlungisi wemibhobho ombizileyo", "nso": "moratšhi wa dipeipi yo o mmitšitšego"}, "your child’s tutor": {"af": "jou kind se tutor", "zu": "umfundisi wengane yakho", "st": "", "xh": "umfundisi womntwana wakho", "nso": "morutiši wa ngwana wa gago"}, "the buyer who asked": {"af": "die koper wat gevra het", "zu": "umthengi obuzile", "st": "", "xh": "umthengi obuzileyo", "nso": "moreki yo a botšišitšego"}, "a collector you dealt with": {"af": "’n versamelaar met wie jy te doen gehad het", "zu": "umqoqi osake wasebenzisana naye", "st": "", "xh": "umqokeleli owakhe wasebenzisana naye", "nso": "mokgobokedi yo o kilego wa šoma le yena"}, "two streets over": {"af": "twee strate verder", "zu": "imigwaqo emibili ukusuka kuwe", "st": "", "xh": "izitrato ezimbini ukusuka kuwe", "nso": "mebila e mebedi go tloga mo"}, "You brought them — they joined from your own link.": {"af": "Jy het hulle gebring — hulle het via jou eie skakel aangesluit.", "zu": "Nguwe owabaletha — bajoyina ngesixhumanisi sakho.", "st": "", "xh": "Nguwe obazisileyo — bajoyine ngekhonkco lakho.", "nso": "O ba tlišitše — ba tsene ka kgokagano ya gago."}, "Free, always. You brought this connection, so there is nothing to sell.": {"af": "Altyd gratis. Jy het hierdie verbinding gebring, so daar is niks om te verkoop nie.", "zu": "Mahhala, njalo. Nguwe owaletha lokhu kuxhumana, ngakho akukho okungathengiswa.", "st": "", "xh": "Simahla, ngalo lonke ixesha. Nguwe owazisa olu qhagamshelo, ngoko akukho nto yokuthengisa.", "nso": "Mahala, ka mehla. O tlišitše kgokagano ye, ka fao ga go selo sa go rekišwa."}, "One pair per job. As many pairs as you have employers.": {"af": "Een paar per werk. Soveel pare as wat jy werkgewers het.", "zu": "Isibhangqa esisodwa emsebenzini ngamunye. Izibhangqa eziningi ngangenani labaqashi onabo.", "st": "", "xh": "Isibini esinye ngomsebenzi ngamnye. Izibini zilingana nenani labaqeshi bakho.", "nso": "Para e tee mošomong o mongwe le o mongwe. Dipara di lekana le bathwadi ba gago."}, "They asked for your details and paid for the introduction.": {"af": "Hulle het vir jou besonderhede gevra en vir die voorstelling betaal.", "zu": "Bacela imininingwane yakho futhi bakhokhela isethulo.", "st": "", "xh": "Bacele iinkcukacha zakho baza bahlawulela intshayelelo.", "nso": "Ba kgopetše dintlha tša gago gomme ba lefela tsebišo."}, "The agency paid. You never pay to be found — you are the lead.": {"af": "Die agentskap het betaal. Jy betaal nooit om gevind te word nie — jy is die kontak.", "zu": "I-ejensi ikhokhile. Awukhokhi neze ukuze utholakale — nguwe ofunwayo.", "st": "", "xh": "I-arhente ihlawulile. Akusoze uhlawule ukuze ufunyanwe — nguwe ofunwayo.", "nso": "Etšensi e lefile. Ga o lefe le ka mohla gore o hwetšwe — ke wena yo a nyakwago."}, "One agency at a time. Close it and the next one may take a turn.": {"af": "Een agentskap op ’n slag. Sluit dit en die volgende een kan ’n beurt kry.", "zu": "I-ejensi eyodwa ngesikhathi. Kuvale, bese elandelayo ithola ithuba.", "st": "", "xh": "I-arhente enye ngexesha. Yivale, ize elandelayo ifumane ithuba.", "nso": "Etšensi e tee ka nako. E tswalele gomme ye e latelago e ka tšea sebaka."}, "You asked several places at once — they all answered.": {"af": "Jy het verskeie plekke gelyk gevra — hulle het almal geantwoord.", "zu": "Ubuze izindawo eziningana ngesikhathi esisodwa — zonke ziphendulile.", "st": "", "xh": "Ubuze iindawo ezininzi ngaxeshanye — zonke ziphendule.", "nso": "O botšišitše mafelo a mmalwa ka nako e tee — ka moka a arabile."}, "You paid one introduction. Talking to all of them is included.": {"af": "Jy het vir een voorstelling betaal. Om met almal te praat, is ingesluit.", "zu": "Ukhokhele isethulo esisodwa. Ukukhuluma nazo zonke kufakiwe.", "st": "", "xh": "Uhlawule intshayelelo enye. Ukuthetha nazo zonke kubandakanyiwe.", "nso": "O lefetše tsebišo e tee. Go bolela le ka moka ga ona go akareditšwe."}, "Many at once. Three quotes is the point — exclusivity would be absurd.": {"af": "Baie gelyk. Drie kwotasies is die punt — eksklusiwiteit sou absurd wees.", "zu": "Eziningi ngesikhathi esisodwa. Injongo ngamakhotheshini amathathu — ukukhetha oyedwa kuphela kungaba yinto engenangqondo.", "st": "", "xh": "Ezininzi ngaxeshanye. Injongo ziikowuteyishini ezintathu — ukubambelela kumntu omnye kuphela kungaba yinto engenangqiqo.", "nso": "Tše dintši ka nako e tee. Dikakanyo tša theko tše tharo ke tšona morero — go ba le o tee fela e ka ba bošilo."}, "Either — the platform found them, or they were already your regular.": {"af": "Of — die platform het hulle gevind, of hulle was reeds jou vaste klant.", "zu": "Noma yikuphi — inkundla ibatholile, noma bebevele bengamakhasimende akho ajwayelekile.", "st": "", "xh": "Nokuba yeyiphi — iqonga libafumene, okanye sele bengabathengi bakho abaqhelekileyo.", "nso": "Efe goba efe — platfomo e ba hweditše, goba ba be ba šetše ba le bareki ba gago ba ka mehla."}, "A new customer costs 1 Tuppence. Your own regulars are free.": {"af": "’n Nuwe klant kos 1 Tuppence. Jou eie vaste klante is gratis.", "zu": "Ikhasimende elisha libiza 1 Tuppence. Amakhasimende akho ajwayelekile mahhala.", "st": "", "xh": "Umthengi omtsha uxabisa i-1 Tuppence. Abathengi bakho abaqhelekileyo abahlawulelwa.", "nso": "Moreki yo mofsa ke Tuppence e 1. Bareki ba gago ba ka mehla ke mahala."}, "Many, and repeating. A tradesman carries dozens of standing customers.": {"af": "Baie, en herhalend. ’n Vakman het dosyne vaste klante.", "zu": "Eziningi, futhi ziyaphindaphinda. Ingcweti inamakhasimende ajwayelekile angamashumi.", "st": "", "xh": "Ezininzi, kwaye ziyaphindaphindwa. Ingcali inamashumi abathengi abasisigxina.", "nso": "Tše dintši, gomme di a boelelwa. Setsebi sa mošomo wa diatla se na le bareki ba ka mehla ba masome a mmalwa."}, "The platform introduced you, and then it repeats every week.": {"af": "Die platform het julle voorgestel, en dan herhaal dit elke week.", "zu": "Inkundla yanethula, bese kuphindeka isonto nesonto.", "st": "", "xh": "Iqonga linazisile, emva koko kuyaphindwa yonke iveki.", "nso": "Platfomo e le tsebišitše, ke moka go boeletšwa beke le beke."}, "You paid the introduction. The weekly rhythm after it is free.": {"af": "Jy het vir die voorstelling betaal. Die weeklikse ritme daarna is gratis.", "zu": "Ukhokhele isethulo. Okwenzeka isonto nesonto emva kwaso kumahhala.", "st": "", "xh": "Uhlawule intshayelelo. Ukudibana kweveki nganye emva koko kusimahla.", "nso": "O lefetše tsebišo. Tlwaelo ya beke le beke ka morago ga yona ke mahala."}, "One pair per child, standing for a school term.": {"af": "Een paar per kind, vir ’n skoolkwartaal.", "zu": "Isibhangqa esisodwa enganeni ngayinye, esihlala ithemu yesikole yonke.", "st": "", "xh": "Isibini esinye ngomntwana ngamnye, kangangekota yesikolo.", "nso": "Para e tee ka ngwana, e dula kotara ya sekolo ka moka."}, "A third person is in this one — the child. Nothing about the child goes through a buzz; this is the two adults arranging their own diary.": {"af": "’n Derde persoon is hierby betrokke — die kind. Niks oor die kind gaan deur ’n buzz nie; dit is die twee volwassenes wat hul eie dagboek reël.", "zu": "Kulokhu kukhona umuntu wesithathu — ingane. Akukho lutho mayelana nengane oluthunyelwa nge-buzz; lokhu ngabantu abadala ababili abahlela izikhathi zabo.", "st": "", "xh": "Kule kukho umntu wesithathu — umntwana. Akukho nto ngomntwana edlula nge-buzz; ngabantu abadala ababini abacwangcisa ishedyuli yabo.", "nso": "Go na le motho wa boraro mo — ngwana. Ga go selo ka ngwana se se fetago ka buzz; ye ke bagolo ba babedi ba beakanya lenaneo la bona la matšatši."}, "They paid for the introduction to your car.": {"af": "Hulle het vir die voorstelling aan jou motor betaal.", "zu": "Bakhokhele isethulo semoto yakho.", "st": "", "xh": "Bahlawulele intshayelelo kwimoto yakho.", "nso": "Ba lefetše tsebišo ya koloi ya gago."}, "They paid. Answering them costs you nothing.": {"af": "Hulle het betaal. Om hulle te antwoord, kos jou niks.", "zu": "Bakhokhile. Ukubaphendula akukubizi lutho.", "st": "", "xh": "Bahlawulile. Ukubaphendula akukuxabisi nto.", "nso": "Ba lefile. Go ba araba ga go go lefiše selo."}, "Many buyers, one car — and it ends the day it sells.": {"af": "Baie kopers, een motor — en dit eindig die dag wanneer dit verkoop.", "zu": "Abathengi abaningi, imoto eyodwa — futhi kuphela ngosuku ethengiswa ngalo.", "st": "", "xh": "Abathengi abaninzi, imoto enye — kwaye kuphela ngosuku ethengiswa ngalo.", "nso": "Bareki ba bantši, koloi e tee — gomme e fela ka letšatši leo e rekišwago ka lona."}, "This is the one category where closing is the normal ending, not a complaint. When the car is sold, close them all — that is the feature working, not failing.": {"af": "Dit is die een kategorie waar sluit die normale einde is, nie ’n klagte nie. Wanneer die motor verkoop is, sluit hulle almal — dit is die funksie wat werk, nie faal nie.", "zu": "Lesi yisigaba esisodwa lapho ukuvala kuyisiphetho esijwayelekile, hhayi isikhalo. Uma imoto isithengisiwe, zivale zonke — lokho kusho ukuthi isici siyasebenza, asehluleki.", "st": "", "xh": "Olu kuphela kodidi apho ukuvala kusisiphelo esiqhelekileyo, hayi isikhalazo. Xa imoto ithengisiwe, zivale zonke — oko yinkqubo esebenzayo, hayi esilelayo.", "nso": "Le ke legoro le tee leo go tswalela e lego mafelelo a tlwaelegilego, e sego ngongorego. Ge koloi e rekišitšwe, di tswalele ka moka — seo se ra gore karolo ye e a šoma, ga se gore e paletšwe."}, "One introduction, years ago. You have traded ever since.": {"af": "Een voorstelling, jare gelede. Julle handel sedertdien.", "zu": "Isethulo esisodwa, eminyakeni eyadlula. Nihwebelana kusukela lapho.", "st": "", "xh": "Intshayelelo enye, kwiminyaka eyadlulayo. Nibe nirhweba ukususela ngoko.", "nso": "Tsebišo e tee, mengwaga ye e fetilego. Le gwebišane go tloga ka nako yeo."}, "Paid once, at the first introduction. Everything after is yours.": {"af": "Een keer betaal, by die eerste voorstelling. Alles daarna is joune.", "zu": "Kukhokhwe kanye, esethulweni sokuqala. Konke okulandelayo kungokwakho.", "st": "", "xh": "Kuhlawulwe kanye, kwintshayelelo yokuqala. Yonke into emva koko yeyakho.", "nso": "E lefilwe gatee, ka tsebišo ya mathomo. Tšohle tše di latelago ke tša gago."}, "Many, and long-lived — collectors keep the same people for decades.": {"af": "Baie, en langdurig — versamelaars hou dieselfde mense vir dekades.", "zu": "Eziningi, futhi zihlala isikhathi eside — abaqoqi bahlala nabantu abafanayo amashumi eminyaka.", "st": "", "xh": "Ezininzi, kwaye zihlala ixesha elide — abaqokeleli bahlala nabantu abafanayo amashumi eminyaka.", "nso": "Tše dintši, gomme di tšea nako ye telele — bakgobokanyi ba dula le batho ba ba swanago masome a mengwaga."}, "They live around the corner. You probably already knew them.": {"af": "Hulle woon om die hoek. Jy het hulle waarskynlik al geken.", "zu": "Bahlala eduze nje. Mhlawumbe wawuvele ubazi.", "st": "", "xh": "Bahlala kufuphi apha. Mhlawumbi ubusele ubazi.", "nso": "Ba dula kgauswi le wena. Mohlomongwe o be o šetše o ba tseba."}, "Usually nothing — at these amounts an introduction rarely applies.": {"af": "Gewoonlik niks — by hierdie bedrae geld ’n voorstelling selde.", "zu": "Imvamisa akukho lutho — kulawa manani isethulo asivamile ukudingeka.", "st": "", "xh": "Ngesiqhelo akukho nto — kwezi zixa intshayelelo ayifane ifuneke.", "nso": "Gantši ga go selo — ka ditšhelete tše, tsebišo ga e hlokege gantši."}, "Many, casual, short.": {"af": "Baie, gemaklik, kort.", "zu": "Eziningi, ezingahlelekile, ezimfushane.", "st": "", "xh": "Ezininzi, ezingekho sesikweni, ezimfutshane.", "nso": "Tše dintši, tša go se be semmušo, tše kopana."}, "One line to the agency holding your place — viewings, offers, show days.": {"af": "Een reël na die agentskap wat jou plek hanteer — besigtigings, aanbiedinge, skoudae.", "zu": "Umugqa owodwa ku-ejensi ephethe indawo yakho — ukubuka, izithembiso, izinsuku zokubukisa.", "st": "", "xh": "Umgca omnye kwi-arhente ephethe indawo yakho — ukujonga, izithembiso, iintsuku zomboniso.", "nso": "Mothaladi o tee go etšensi ye e swerego lefelo la gago — go lebelela, dithekišo, matšatši a pontšho."}, "One line to everyone who asked about your place — viewings, offers, show days.": {"af": "Een reël na almal wat oor jou plek gevra het — besigtigings, aanbiedinge, skoudae.", "zu": "Umugqa owodwa kubo bonke ababuze ngendawo yakho — ukubuka, izithembiso, izinsuku zokubukisa.", "st": "Mola o le mong ho bohle ba botsitseng ka sebaka sa hao — ho sheba, dinyehelo, matsatsi a pontsho.", "xh": "Umgca omnye kubo bonke ababuze ngendawo yakho — ukujonga, izithembiso, iintsuku zomboniso.", "nso": "Mothaladi o tee go bohle bao ba botšišitšego ka lefelo la gago — go lebelela, dithekišo, matšatši a pontšho."}, "One line to every place you asked — dates, late arrivals, one more bed.": {"af": "Een reël na elke plek wat jy gevra het — datums, laat aankomste, nog een bed.", "zu": "Umugqa owodwa kuyo yonke indawo oyibuzile — izinsuku, ukufika sekwephuzile, omunye umbhede.", "st": "", "xh": "Umgca omnye kuyo yonke indawo oyibuzileyo — imihla, ukufika emva kwexesha, enye ibhedi.", "nso": "Mothaladi o tee go lefelo le lengwe le le lengwe leo o le botšišitšego — matšatši, go fihla morago, malao a mangwe."}, "One line to every guest who asked — dates, late arrivals, one more bed.": {"af": "Een reël na elke gas wat gevra het — datums, laat aankomste, nog een bed.", "zu": "Umugqa owodwa kuso sonke isivakashi esibuzile — izinsuku, ukufika sekwephuzile, omunye umbhede.", "st": "Mola o le mong ho moeti e mong le e mong ya botsitseng — matsatsi, ho fihla ka morao, bethe e nngwe.", "xh": "Umgca omnye kulo lonke undwendwe olubuzileyo — imihla, ukufika emva kwexesha, enye ibhedi.", "nso": "Mothaladi o tee go moeng yo mongwe le yo mongwe yo a botšišitšego — matšatši, go fihla morago, malao a mangwe."}, "One line to the trade you use — on my way, running late, job done.": {"af": "Een reël na die vakman wat jy gebruik — op pad, laat, werk klaar.", "zu": "Umugqa owodwa kungcweti oyisebenzisayo — ngisendleleni, ngizophuza, umsebenzi uqediwe.", "st": "", "xh": "Umgca omnye kwingcali oyisebenzisayo — ndisendleleni, ndiza kufika emva kwexesha, umsebenzi ugqityiwe.", "nso": "Mothaladi o tee go setsebi seo o se šomišago — ke tseleng, ke tla diega, mošomo o phethilwe."}, "One line to your regular customers — on my way, running late, job done.": {"af": "Een reël na jou vaste kliënte — op pad, laat, werk klaar.", "zu": "Umugqa owodwa kumakhasimende akho ajwayelekile — ngisendleleni, ngizophuza, umsebenzi uqediwe.", "st": "Mola o le mong ho bareki ba hao ba kamehla — ke tseleng, ke tla dieha, mosebetsi o phethilwe.", "xh": "Umgca omnye kubathengi bakho abaqhelekileyo — ndisendleleni, ndiza kufika emva kwexesha, umsebenzi ugqityiwe.", "nso": "Mothaladi o tee go bareki ba gago ba ka mehla — ke tseleng, ke tla diega, mošomo o phethilwe."}, "One line to the tutor — a moved lesson, an exam week, a late child.": {"af": "Een reël na die tutor — ’n geskuifde les, ’n eksamenweek, ’n laat kind.", "zu": "Umugqa owodwa kumfundisi — isifundo esihanjisiwe, isonto lezivivinyo, ingane efike sekwephuzile.", "st": "", "xh": "Umgca omnye kumfundisi — isifundo esishenxisiweyo, iveki yeemviwo, umntwana ofika emva kwexesha.", "nso": "Mothaladi o tee go morutiši — thuto ye e šuthišitšwego, beke ya ditlhahlobo, ngwana yo a diegilego."}, "One line to the parents you teach for — a moved lesson, an exam week, a late child.": {"af": "Een reël na die ouers vir wie jy klas gee — ’n geskuifde les, ’n eksamenweek, ’n laat kind.", "zu": "Umugqa owodwa kubazali obafundisela — isifundo esihanjisiwe, isonto lezivivinyo, ingane efike sekwephuzile.", "st": "Mola o le mong ho batswadi bao o ba rutelang — thuto e sutisitsweng, beke ya ditlhahlobo, ngwana ya diehang.", "xh": "Umgca omnye kubazali obafundisela — isifundo esishenxisiweyo, iveki yeemviwo, umntwana ofika emva kwexesha.", "nso": "Mothaladi o tee go batswadi bao o ba rutelago — thuto ye e šuthišitšwego, beke ya ditlhahlobo, ngwana yo a diegilego."}, "One line to the people asking about your car — until it is sold.": {"af": "Een reël na die mense wat oor jou motor vra — totdat dit verkoop is.", "zu": "Umugqa owodwa kubantu ababuza ngemoto yakho — ize ithengiswe.", "st": "", "xh": "Umgca omnye kubantu ababuza ngemoto yakho — ide ithengiswe.", "nso": "Mothaladi o tee go batho bao ba botšišago ka koloi ya gago — go fihlela e rekišwa."}, "One line to each buyer asking about your car — until it is sold.": {"af": "Een reël na elke koper wat oor jou motor vra — totdat dit verkoop is.", "zu": "Umugqa owodwa kumthengi ngamunye obuza ngemoto yakho — ize ithengiswe.", "st": "", "xh": "Umgca omnye kumthengi ngamnye obuza ngemoto yakho — ide ithengiswe.", "nso": "Mothaladi o tee go moreki yo mongwe le yo mongwe yo a botšišago ka koloi ya gago — go fihlela e rekišwa."}, "One line to the collectors you trade with.": {"af": "Een reël na die versamelaars met wie jy handel dryf.", "zu": "Umugqa owodwa kubaqoqi ohwebelana nabo.", "st": "", "xh": "Umgca omnye kubaqokeleli orhweba nabo.", "nso": "Mothaladi o tee go bakgobokanyi bao o gwebago le bona."}, "One line to the collectors who buy from you — a new piece, a swap, a price.": {"af": "Een reël na die versamelaars wat by jou koop — ’n nuwe stuk, ’n ruil, ’n prys.", "zu": "Umugqa owodwa kubaqoqi abathenga kuwe — into entsha, ukushintshana, inani.", "st": "", "xh": "Umgca omnye kubaqokeleli abathenga kuwe — into entsha, ukutshintshiselana, ixabiso.", "nso": "Mothaladi o tee go bakgobokanyi bao ba rekago go wena — selo se sefsa, go ananya, theko."}, "One line to your neighbour — at the gate, sold out, bring change.": {"af": "Een reël na jou buurman — by die hek, uitverkoop, bring kleingeld.", "zu": "Umugqa owodwa kumakhelwane wakho — ngisesangweni, kuphelile, letha ushintshi.", "st": "", "xh": "Umgca omnye kummelwane wakho — ndisesangweni, kuphelile, yiza netshintshi.", "nso": "Mothaladi o tee go moagišani wa gago — ke kgorong, di fedile, tla le tšhelete ye nnyane."}, "One line to the people who buy from you — fresh today, sold out, at the gate.": {"af": "Een reël na die mense wat by jou koop — vars vandag, uitverkoop, by die hek.", "zu": "Umugqa owodwa kubantu abathenga kuwe — okusha namuhla, kuphelile, ngisesangweni.", "st": "", "xh": "Umgca omnye kubantu abathenga kuwe — kutsha namhlanje, kuphelile, ndisesangweni.", "nso": "Mothaladi o tee go batho bao ba rekago go wena — tše mpsha lehono, di fedile, ke kgorong."}, "Preview only — nothing is sent from Quick": {"af": "Net ’n voorskou — niks word uit Quick gestuur nie", "zu": "Ukubuka kuqala kuphela — akukho okuthunyelwa kusuka ku-Quick", "st": "", "xh": "Ngumboniso nje — akukho nto ithunyelwa ukusuka kwiQuick", "nso": "Ke ponelopele fela — ga go se se romelwago go tšwa go Quick"}, "Nothing was sent — this is a preview.": {"af": "Niks is gestuur nie — dit is ’n voorskou.", "zu": "Akukho okuthunyelwe — lokhu ukubuka kuqala.", "st": "", "xh": "Akukho nto ithunyelweyo — lo ngumboniso nje.", "nso": "Ga go se se rometšwego — ye ke ponelopele."}, "Example — this is what your employer sees": {"af": "Voorbeeld — dit is wat jou werkgewer sien", "zu": "Isibonelo — yilokhu okubonwa ngumqashi wakho", "st": "", "xh": "Umzekelo — nantsi into ayibonayo umqeshi wakho", "nso": "Mohlala — se ke seo mothwadi wa gago a se bonago"}, "Example — this is what a customer sees": {"af": "Voorbeeld — dit is wat ’n klant sien", "zu": "Isibonelo — yilokhu okubonwa yikhasimende", "st": "", "xh": "Umzekelo — nantsi into ayibonayo umthengi", "nso": "Mohlala — se ke seo moreki a se bonago"}, "Example — this is what a parent or student you teach sees": {"af": "Voorbeeld — dit is wat ’n ouer of leerder vir wie jy klas gee, sien", "zu": "Isibonelo — yilokhu okubonwa ngumzali noma umfundi omfundisayo", "st": "", "xh": "Umzekelo — nantsi into ayibonayo umzali okanye umfundi omfundisayo", "nso": "Mohlala — se ke seo motswadi goba moithuti yo o mo rutago a se bonago"}, "Example — this is what a customer you have worked for sees": {"af": "Voorbeeld — dit is wat ’n klant vir wie jy gewerk het, sien", "zu": "Isibonelo — yilokhu okubonwa yikhasimende osebenzele lona", "st": "", "xh": "Umzekelo — nantsi into ayibonayo umthengi omsebenzeleyo", "nso": "Mohlala — se ke seo moreki yo o kilego wa mo šomela a se bonago"}, "Example — this is what a guest you have hosted sees": {"af": "Voorbeeld — dit is wat ’n gas wat jy ontvang het, sien", "zu": "Isibonelo — yilokhu okubonwa yisivakashi osake wasamukela", "st": "", "xh": "Umzekelo — nantsi into oluyibonayo undwendwe owakhe walwamkela", "nso": "Mohlala — se ke seo moeng yo o kilego wa mo amogela a se bonago"}, "Example — this is what someone who has bought from you sees": {"af": "Voorbeeld — dit is wat iemand wat al by jou gekoop het, sien", "zu": "Isibonelo — yilokhu okubonwa ngumuntu osake wathenga kuwe", "st": "", "xh": "Umzekelo — nantsi into ayibonayo umntu owakhe wathenga kuwe", "nso": "Mohlala — se ke seo motho yo a kilego a reka go wena a se bonago"}, "Example — this is what a collector you have dealt with sees": {"af": "Voorbeeld — dit is wat ’n versamelaar met wie jy al te doen gehad het, sien", "zu": "Isibonelo — yilokhu okubonwa ngumqoqi osake wasebenzisana naye", "st": "", "xh": "Umzekelo — nantsi into ayibonayo umqokeleli owakhe wasebenzisana naye", "nso": "Mohlala — se ke seo mokgobokedi yo o kilego wa šoma le yena a se bonago"}, "Example — this is what someone who has rented or bought from you sees": {"af": "Voorbeeld — dit is wat iemand wat al by jou gehuur of gekoop het, sien", "zu": "Isibonelo — yilokhu okubonwa ngumuntu osake waqasha noma wathenga kuwe", "st": "", "xh": "Umzekelo — nantsi into ayibonayo umntu owakhe waqesha okanye wathenga kuwe", "nso": "Mohlala — se ke seo motho yo a kilego a hira goba a reka go wena a se bonago"}, "Example — this is what someone you have worked for sees": {"af": "Voorbeeld — dit is wat iemand vir wie jy gewerk het, sien", "zu": "Isibonelo — yilokhu okubonwa ngumuntu osake wamsebenzela", "st": "", "xh": "Umzekelo — nantsi into ayibonayo umntu owakhe wamsebenzela", "nso": "Mohlala — se ke seo motho yo o kilego wa mo šomela a se bonago"}, "A reference, please": {"af": "’n Verwysing, asseblief", "zu": "Isincomo, ngiyacela", "st": "", "xh": "Ubungqina, nceda", "nso": "Bopaki, hle"}, "asked you for a reference": {"af": "het jou vir ’n verwysing gevra", "zu": "ukucele isincomo", "st": "", "xh": "ukucele ubungqina", "nso": "o go kgopetše bopaki"}, "You employed them, so you are the only person who can say this.": {"af": "Jy het hulle in diens gehad, so jy is die enigste persoon wat dit kan sê.", "zu": "Wamqasha, ngakho nguwe kuphela ongasho lokhu.", "st": "", "xh": "Wakha wamqesha, ngoko nguwe kuphela umntu onokuyitsho le nto.", "nso": "O mo thwetše, ka fao ke wena fela motho yo a ka bolelago se."}, "You have used their work, so you are the only person who can say this.": {"af": "Jy het hulle werk gebruik, so jy is die enigste persoon wat dit kan sê.", "zu": "Usuwusebenzisile umsebenzi wakhe, ngakho nguwe kuphela ongasho lokhu.", "st": "", "xh": "Wakha wawusebenzisa umsebenzi wakhe, ngoko nguwe kuphela umntu onokuyitsho le nto.", "nso": "O šomišitše mošomo wa gagwe, ka fao ke wena fela motho yo a ka bolelago se."}, "You have used them as a tutor, so you are the only person who can say this.": {"af": "Jy het hulle as tutor gebruik, so jy is die enigste persoon wat dit kan sê.", "zu": "Usumsebenzisile njengomfundisi, ngakho nguwe kuphela ongasho lokhu.", "st": "", "xh": "Wakha wamsebenzisa njengomfundisi, ngoko nguwe kuphela umntu onokuyitsho le nto.", "nso": "O mo šomišitše bjalo ka morutiši, ka fao ke wena fela motho yo a ka bolelago se."}, "You have stayed with them, so you are the only person who can say this.": {"af": "Jy het by hulle tuisgegaan, so jy is die enigste persoon wat dit kan sê.", "zu": "Usuke wahlala kubo, ngakho nguwe kuphela ongasho lokhu.", "st": "", "xh": "Wakha wahlala kwindawo yakhe, ngoko nguwe kuphela umntu onokuyitsho le nto.", "nso": "O kile wa dula ga gagwe, ka fao ke wena fela motho yo a ka bolelago se."}, "You have bought from them, so you are the only person who can say this.": {"af": "Jy het al by hulle gekoop, so jy is die enigste persoon wat dit kan sê.", "zu": "Usuke wathenga kuye, ngakho nguwe kuphela ongasho lokhu.", "st": "", "xh": "Wakha wathenga kuye, ngoko nguwe kuphela umntu onokuyitsho le nto.", "nso": "O kile wa reka go yena, ka fao ke wena fela motho yo a ka bolelago se."}, "You have dealt with them, so you are the only person who can say this.": {"af": "Jy het al met hulle te doen gehad, so jy is die enigste persoon wat dit kan sê.", "zu": "Usuke wasebenzisana naye, ngakho nguwe kuphela ongasho lokhu.", "st": "", "xh": "Wakha wasebenzisana naye, ngoko nguwe kuphela umntu onokuyitsho le nto.", "nso": "O kile wa šoma le yena, ka fao ke wena fela motho yo a ka bolelago se."}, "You have rented or bought from them, so you are the only person who can say this.": {"af": "Jy het al by hulle gehuur of gekoop, so jy is die enigste persoon wat dit kan sê.", "zu": "Usuke waqasha noma wathenga kuye, ngakho nguwe kuphela ongasho lokhu.", "st": "", "xh": "Wakha waqesha okanye wathenga kuye, ngoko nguwe kuphela umntu onokuyitsho le nto.", "nso": "O kile wa hira goba wa reka go yena, ka fao ke wena fela motho yo a ka bolelago se."}, "They have worked for you, so you are the only person who can say this.": {"af": "Hulle het vir jou gewerk, so jy is die enigste persoon wat dit kan sê.", "zu": "Useke wakusebenzela, ngakho nguwe kuphela ongasho lokhu.", "st": "", "xh": "Wakha wakusebenzela, ngoko nguwe kuphela umntu onokuyitsho le nto.", "nso": "Yena o kile a go šomela, ka fao ke wena fela motho yo a ka bolelago se."}, "Free, about a minute, and you never have to use TrustSquare again if you do not want to. Four taps from here.": {"af": "Gratis, omtrent ’n minuut, en jy hoef nooit weer TrustSquare te gebruik as jy nie wil nie. Vier tikke van hier af.", "zu": "Mahhala, cishe umzuzu owodwa, futhi akudingeki uphinde usebenzise i-TrustSquare uma ungafuni. Ukuthinta okune ukusuka lapha.", "st": "", "xh": "Simahla, malunga nomzuzu omnye, kwaye akunyanzelekanga ukuba uphinde usebenzise iTrustSquare ukuba awufuni. Ukucofa kane ukusuka apha.", "nso": "Ke mahala, ke motsotso o tee goba ka mo, gomme ga o sa swanela go šomiša TrustSquare gape ge o sa nyake. Dikgotlo tše nne go tloga mo."}, "Yes — I’ll do it": {"af": "Ja — ek sal dit doen", "zu": "Yebo — ngizokwenza", "st": "", "xh": "Ewe — ndiza kukwenza", "nso": "Ee — ke tla dira bjalo"}, "Who is vouching?": {"af": "Wie gee die verwysing?", "zu": "Ngubani oncomayo?", "st": "", "xh": "Ngubani ongqinayo?", "nso": "Ke mang yo a fago bopaki?"}, "Continue": {"af": "Gaan voort", "zu": "Qhubeka", "st": "", "xh": "Qhubeka", "nso": "Tšwela pele"}, "This is the only thing they are asked for, and it is what signs them up — free, no card.": {"af": "Dit is al wat hulle gevra word, en dit is wat hulle registreer — gratis, geen kaart nie.", "zu": "Yilokhu kuphela abakucelwayo, futhi yikho okubabhalisayo — mahhala, akudingeki ikhadi.", "st": "", "xh": "Yile kuphela into abacelwa yona, kwaye yiyo ebabhalisayo — simahla, akukho khadi.", "nso": "Se ke sona fela seo ba se kgopelwago, gomme ke sona se ba ngwadišago — mahala, ga go karata."}, "When they continue, they accept the TrustSquare terms, Buzz included as it is: a doorbell between two people, with an off switch on both sides (§3.8).": {"af": "Wanneer hulle voortgaan, aanvaar hulle die TrustSquare-bepalings, Buzz ingesluit soos dit is: ’n deurklokkie tussen twee mense, met ’n afskakelaar aan albei kante (§3.8).", "zu": "Uma beqhubeka, bamukela imigomo ye-TrustSquare, kuhlanganise ne-Buzz njengoba injalo: insimbi yasemnyango phakathi kwabantu ababili, enenkinobho yokucisha ezinhlangothini zombili (§3.8).", "st": "", "xh": "Xa beqhubeka, bamkela imimiselo yeTrustSquare, kuquka iBuzz njengoko injalo: intsimbi yomnyango phakathi kwabantu ababini, eneqhosha lokucima kumacala omabini (§3.8).", "nso": "Ge ba tšwela pele, ba amogela melawana ya TrustSquare, go akaretšwa le Buzz ka mo e lego ka gona: pele ya mojako magareng ga batho ba babedi, ye e ka timwago ka mahlakore ka bobedi (§3.8)."}, "Send it": {"af": "Stuur dit", "zu": "Kuthumele", "st": "", "xh": "Yithumele", "nso": "E romele"}, "Say what you would tell a friend who asked.": {"af": "Sê wat jy vir ’n vriend sou sê wat gevra het.", "zu": "Sho lokho obungakusho kumngane obuzile.", "st": "", "xh": "Yitsho into obunokuyithetha kumhlobo obuzileyo.", "nso": "Bolela seo o bego o tla se botša mogwera yo a go botšišitšego."}, "That is everything": {"af": "Dit is al", "zu": "Yilokho kuphela", "st": "", "xh": "Kuphelele apho", "nso": "Ke tšohle"}, "One last thing, and it takes a second": {"af": "Een laaste ding, en dit vat ’n oomblik", "zu": "Into eyodwa yokugcina, futhi ithatha umzuzwana", "st": "", "xh": "Into enye yokugqibela, kwaye ithatha umzuzwana nje", "nso": "Selo sa mafelelo, gomme se tšea motsotswana"}, "— you, just now": {"af": "— jy, netnou", "zu": "— wena, manje nje", "st": "", "xh": "— wena, kanye ngoku", "nso": "— wena, bjale bjale"}, "Either of you can switch it off, and switching it off ends it for both.": {"af": "Enigeen van julle kan dit afskakel, en afskakel beëindig dit vir albei.", "zu": "Noma ngubani kinina angayicisha, futhi ukuyicisha kuyiqeda kinina nobabili.", "st": "", "xh": "Nabani na kuni angayicima, kwaye ukuyicima kuyiphelisa kuni nobabini.", "nso": "Mang goba mang wa lena a ka e tima, gomme go e tima go e fetša go lena ka bobedi."}, "trust": {"af": "vertroue", "zu": "ukwethenjwa", "st": "", "xh": "ukuthembeka", "nso": "go tshepega"}, "Done": {"af": "Klaar", "zu": "Kuqediwe", "st": "", "xh": "Kugqityiwe", "nso": "Go fedile"}, "Four taps. You are finished.": {"af": "Vier tikke. Jy is klaar.", "zu": "Ukuthinta okune. Usuqedile.", "st": "", "xh": "Ukucofa kane. Ugqibile.", "nso": "Dikgotlo tše nne. O feditše."}, "Pass Quick on": {"af": "Gee Quick aan", "zu": "Dlulisela i-Quick", "st": "", "xh": "Dlulisela iQuick", "nso": "Fetišetša Quick"}, "Let them scan the code with their camera — or share the link.": {"af": "Laat hulle die kode met hul kamera skandeer — of deel die skakel.", "zu": "Bavumele baskene ikhodi ngekhamera yabo — noma wabelane ngesixhumanisi.", "st": "", "xh": "Mabaskene ikhowudi ngekhamera yabo — okanye wabelane ngekhonkco.", "nso": "Ba dumelele go skena khoutu ka khamera ya bona — goba o abelane kgokagano."}, "Share the link": {"af": "Deel die skakel", "zu": "Yabelana ngesixhumanisi", "st": "", "xh": "Yabelana ngekhonkco", "nso": "Abelana kgokagano"}, "Flick up to share": {"af": "Swiep op om te deel", "zu": "Swayipha uye phezulu ukuze wabelane", "st": "", "xh": "Tyibilizisa phezulu ukuze wabelane", "nso": "Gogela godimo go abelana"}, "Making the code": {"af": "Maak die kode", "zu": "Senza ikhodi", "st": "", "xh": "Kwenziwa ikhowudi", "nso": "Khoutu e a dirwa"}, "They will see:": {"af": "Hulle sal sien:", "zu": "Bazobona:", "st": "", "xh": "Baza kubona:", "nso": "Ba tla bona:"}, "passed you Quick": {"af": "het Quick vir jou aangegee", "zu": "ukudlulisele i-Quick", "st": "", "xh": "ukudlulisele iQuick", "nso": "o go fetišeditše Quick"}, "hide my name": {"af": "versteek my naam", "zu": "fihla igama lami", "st": "", "xh": "fihla igama lam", "nso": "uta leina la ka"}, "Send it on WhatsApp": {"af": "Stuur dit op WhatsApp", "zu": "Kuthumele ku-WhatsApp", "st": "", "xh": "Yithumele kuWhatsApp", "nso": "E romele ka WhatsApp"}, "Cancel this invite": {"af": "Kanselleer hierdie uitnodiging", "zu": "Khansela lesi simemo", "st": "", "xh": "Rhoxisa esi simemo", "nso": "Khansela memo ye"}, "They get their own Quick — never your advert, your key link or your number. It works once.": {"af": "Hulle kry hul eie Quick — nooit jou advertensie, jou sleutelskakel of jou nommer nie. Dit werk een keer.", "zu": "Bathola i-Quick yabo — hhayi isikhangiso sakho, isixhumanisi sakho sokhiye noma inombolo yakho. Kusebenza kanye.", "st": "", "xh": "Bafumana iQuick yabo — abasoze bafumane isibhengezo sakho, ikhonkco lakho lesitshixo okanye inombolo yakho. Isebenza kanye.", "nso": "Ba hwetša Quick ya bona — le ka mohla e sego papatšo ya gago, kgokagano ya gago ya senotlelo goba nomoro ya gago. E šoma gatee."}, "Waiting for them to accept": {"af": "Wag dat hulle aanvaar", "zu": "Silinde ukuthi bamukele", "st": "", "xh": "Silindele ukuba bamkele", "nso": "Re emetše gore ba amogele"}, "Accepted — Quick is on their phone.": {"af": "Aanvaar — Quick is op hul foon.", "zu": "Kwamukelwe — i-Quick isefonini yabo.", "st": "", "xh": "Bamkele — iQuick ikwifowuni yabo.", "nso": "E amogetšwe — Quick e go founo ya bona."}, "They said no thanks. Nothing was shared.": {"af": "Hulle het nee dankie gesê. Niks is gedeel nie.", "zu": "Bathe cha ngiyabonga. Akukho okwabiwe.", "st": "", "xh": "Bathe hayi enkosi. Akukho nto kwabelwana ngayo.", "nso": "Ba itše aowa, ke a leboga. Ga go se se abetšwego."}, "Link copied — or let them scan the code.": {"af": "Skakel gekopieer — of laat hulle die kode skandeer.", "zu": "Isixhumanisi sikopishiwe — noma ubavumele baskene ikhodi.", "st": "", "xh": "Ikhonkco likotshiwe — okanye mabaskene ikhowudi.", "nso": "Kgokagano e kopilwe — goba ba dumelele go skena khoutu."}, "Let them scan the code.": {"af": "Laat hulle die kode skandeer.", "zu": "Bavumele baskene ikhodi.", "st": "", "xh": "Mabaskene ikhowudi.", "nso": "Ba dumelele go skena khoutu."}, "QR code for their phone": {"af": "QR-kode vir hul foon", "zu": "Ikhodi ye-QR yefoni yabo", "st": "", "xh": "Ikhowudi ye-QR yefowuni yabo", "nso": "Khoutu ya QR ya founo ya bona"}, "Could not make the invite. Try again.": {"af": "Kon nie die uitnodiging maak nie. Probeer weer.", "zu": "Asikwazanga ukwenza isimemo. Zama futhi.", "st": "", "xh": "Asikwazanga ukwenza isimemo. Zama kwakhona.", "nso": "Re paletšwe ke go dira memo. Leka gape."}, "passed you TrustSquare Quick": {"af": "het TrustSquare Quick vir jou aangegee", "zu": "ukudlulisele i-TrustSquare Quick", "st": "", "xh": "ukudlulisele iTrustSquare Quick", "nso": "o go fetišeditše TrustSquare Quick"}, "You were passed TrustSquare Quick": {"af": "Iemand het TrustSquare Quick vir jou aangegee", "zu": "Udluliselwe i-TrustSquare Quick", "st": "", "xh": "Udluliselwe iTrustSquare Quick", "nso": "O fetišeditšwe TrustSquare Quick"}, "Make an advert for your work in a few taps. Free. Your name and number stay private until you accept an introduction.": {"af": "Maak ’n advertensie vir jou werk met ’n paar tikke. Gratis. Jou naam en nommer bly privaat totdat jy ’n voorstelling aanvaar.", "zu": "Yenza isikhangiso somsebenzi wakho ngokuthinta okumbalwa. Mahhala. Igama lakho nenombolo kuhlala kuyimfihlo uze wamukele isethulo.", "st": "", "xh": "Yenza isibhengezo somsebenzi wakho ngokucofa okumbalwa. Simahla. Igama lakho nenombolo zihlala ziyimfihlo de wamkele intshayelelo.", "nso": "Dira papatšo ya mošomo wa gago ka go kgotla gannyane. Ke mahala. Leina la gago le nomoro di dula e le sephiri go fihlela o amogela tsebišo."}, "Accept": {"af": "Aanvaar", "zu": "Yamukela", "st": "", "xh": "Yamkela", "nso": "Amogela"}, "No thanks": {"af": "Nee dankie", "zu": "Cha, ngiyabonga", "st": "", "xh": "Hayi enkosi", "nso": "Aowa, ke a leboga"}, "Quick is yours.": {"af": "Quick is joune.", "zu": "I-Quick ingeyakho.", "st": "", "xh": "IQuick yeyakho.", "nso": "Quick ke ya gago."}, "That invite was already used — you can still make your own advert here.": {"af": "Daardie uitnodiging is al gebruik — jy kan steeds jou eie advertensie hier maak.", "zu": "Leso simemo sesisetshenzisiwe — usengakwazi ukwenza isikhangiso sakho lapha.", "st": "", "xh": "Eso simemo sele sisetyenzisiwe — usenako ukwenza esakho isibhengezo apha.", "nso": "Memo yeo e šetše e šomišitšwe — o sa kgona go dira papatšo ya gago mo."}, "That invite is no longer open — you can still make your own advert here.": {"af": "Daardie uitnodiging is nie meer oop nie — jy kan steeds jou eie advertensie hier maak.", "zu": "Leso simemo asisavulekile — usengakwazi ukwenza isikhangiso sakho lapha.", "st": "", "xh": "Eso simemo asisavulekanga — usenako ukwenza esakho isibhengezo apha.", "nso": "Memo yeo e tswaletšwe — o sa kgona go dira papatšo ya gago mo."}, "That invite is no longer open.": {"af": "Daardie uitnodiging is nie meer oop nie.", "zu": "Leso simemo asisavulekile.", "st": "", "xh": "Eso simemo asisavulekanga.", "nso": "Memo yeo e tswaletšwe."}, "TrustSquare Quick": {"af": "TrustSquare Quick", "zu": "TrustSquare Quick", "st": "", "xh": "TrustSquare Quick", "nso": "TrustSquare Quick"}, "make an advert for your work in a few taps:": {"af": "maak ’n advertensie vir jou werk met ’n paar tikke:", "zu": "yenza isikhangiso somsebenzi wakho ngokuthinta okumbalwa:", "st": "", "xh": "yenza isibhengezo somsebenzi wakho ngokucofa okumbalwa:", "nso": "dira papatšo ya mošomo wa gago ka go kgotla gannyane:"}, "make an advert for your work in a few taps.": {"af": "maak ’n advertensie vir jou werk met ’n paar tikke.", "zu": "yenza isikhangiso somsebenzi wakho ngokuthinta okumbalwa.", "st": "", "xh": "yenza isibhengezo somsebenzi wakho ngokucofa o
