<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>The Harness</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#04070a;color:#eaf3ee;
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);
 display:flex;flex-direction:column;transition:background .5s}
@media(min-width:560px){
  #app{width:400px;height:min(92vh,860px);border-radius:36px;border:10px solid #010304;
       box-shadow:0 30px 90px rgba(0,0,0,.75)}
}
:root{--c:#16A97C;--bg:#04100c;--panel:#0a1a14;--line:#163128;--bright:#8ff0c8;--dim:#84a396}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px;
 min-height:56px;flex:0 0 auto}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
 display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--bright);
 flex:0 0 auto;cursor:pointer;transition:transform .12s,opacity .2s;user-select:none}
.ic:active{transform:scale(.9)}
.ic.hide{opacity:0;pointer-events:none}
.steps{flex:1;display:flex;gap:6px;justify-content:center;align-items:center}
.steps i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}
.steps i.on{background:var(--c);width:22px;border-radius:4px}
.steps i.done{background:var(--bright)}

/* ---------- door ---------- */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;padding:0 22px 26px;position:relative}
.door{background:radial-gradient(120% 62% at 50% 40%,var(--panel) 0%,var(--bg) 72%)}
.orb{position:relative;width:min(62vw,236px);aspect-ratio:1;border-radius:50%;padding:5px;
 background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.16),0 18px 60px rgba(0,0,0,.5);
 transition:background .5s}
.orb .in{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#000}
.orb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}
.orb img.on{opacity:1}
.orb .halo{position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--c);
 animation:halo 3.4s ease-out infinite;pointer-events:none}
@keyframes halo{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.2);opacity:0}}
.catrow{display:flex;align-items:center;gap:8px;margin-top:24px;width:100%;justify-content:center}
.catname{font-size:30px;font-weight:800;letter-spacing:-.5px;text-align:center;min-width:0;
 flex:1;transition:opacity .2s}
.catname.fade{opacity:0}
.arw{font-size:24px;color:var(--dim);padding:6px 10px;cursor:pointer;user-select:none;
 transition:transform .12s}
.arw:active{transform:scale(.85)}
.dots{display:flex;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.on{background:var(--c)}
.acts{display:flex;gap:11px;width:100%;max-width:340px;margin-top:30px}
.btn{flex:1;padding:17px 10px;border-radius:999px;border:0;cursor:pointer;font-size:16px;
 font-weight:800;font-family:inherit;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.solid{background:var(--c);color:#04140e}
.btn.ghost{background:transparent;color:var(--bright);border:1.5px solid var(--c)}

/* ---------- steps ---------- */
.q{font-size:21px;font-weight:800;letter-spacing:-.3px;text-align:center;padding:2px 4px 14px;
 flex:0 0 auto;line-height:1.25}
.trail{display:flex;gap:6px;justify-content:center;padding:0 0 12px;flex:0 0 auto;min-height:0}
.trail img{width:34px;height:34px;border-radius:11px;object-fit:cover;border:1.5px solid var(--c);
 animation:pop .3s ease}
.trail{flex-wrap:wrap}
.trail span{height:34px;border-radius:11px;border:1.5px solid var(--c);
 background:var(--panel);color:var(--bright);font-size:11px;font-weight:800;white-space:nowrap;
 display:flex;align-items:center;justify-content:center;padding:0 10px;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;width:100%}
.body::-webkit-scrollbar{width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;aspect-ratio:1.18;
 background:var(--panel);border:1.5px solid var(--line);animation:rise .32s ease backwards;
 transition:transform .12s}
.tile:active{transform:scale(.96)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile b{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 11px;font-size:14px;
 font-weight:800;background:linear-gradient(transparent,rgba(2,8,6,.92));text-shadow:0 1px 6px #000}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{padding:15px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);
 color:var(--bright);font-size:16px;font-weight:700;cursor:pointer;animation:rise .3s ease backwards;
 transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip.wide{flex:1 1 100%;text-align:center}

/* ---------- result ---------- */
.card{border-radius:22px;overflow:hidden;background:var(--panel);border:1.5px solid var(--line);
 animation:rise .4s ease}
.card .hero{width:100%;aspect-ratio:1.5;object-fit:cover;display:block}
.card .pad{padding:14px}
.card h3{margin:0 0 6px;font-size:18px;letter-spacing:-.3px}
.card p{margin:0 0 11px;font-size:13.5px;color:var(--dim);line-height:1.5}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);
 border:1px solid var(--line);color:#cfe6db}
.draftflag{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#f0cc8a;
 background:rgba(224,174,78,.12);border:1px solid rgba(224,174,78,.4);border-radius:12px;
 padding:10px 12px;margin-bottom:12px}
.todo{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.todo div{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:12px;border-radius:14px;
 background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer}
.todo div .plus{width:24px;height:24px;border-radius:50%;background:var(--c);color:#04140e;
 display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto;font-size:15px}
.todo div.did{opacity:.55}
.todo div.did .plus{background:var(--bright)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ad{border-radius:18px;overflow:hidden;background:var(--panel);border:1.5px solid var(--line);
 animation:rise .3s ease backwards}
.ad img{width:100%;aspect-ratio:1.25;object-fit:cover;display:block}
.ad .p{padding:9px 10px 11px}
.ad .t{font-size:12.5px;font-weight:700;line-height:1.3;margin-bottom:4px}
.ad .m{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.ad .m b{color:var(--bright)}
.count{text-align:center;font-size:13px;color:var(--dim);padding:0 0 12px}
.count b{color:var(--bright)}
.foot{flex:0 0 auto;padding:10px 16px calc(env(safe-area-inset-bottom) + 14px)}
.hint{text-align:center;font-size:12px;color:var(--dim);padding-bottom:8px}
</style>
</head>
<body>
<div id="stage"><div id="app">
  <div class="bar">
    <div class="ic hide" id="back">&#8592;</div>
    <div class="steps" id="steps"></div>
    <div class="ic hide" id="home">&#8635;</div>
  </div>
  <div class="screen door" id="screen"></div>
</div></div>

  var trail=picks.map(function(p){
    return p.photo?'<img src="'+PH[p.photo]+'" alt="">':'<span>'+p.label+'</span>'; }).join('');
  var items;
  if(s.kind==='chip'){
    items='<div class="chips">'+s.tiles.map(function(t,i){
      return '<button class="chip'+(t.wide?' wide':'')+'" data-i="'+i+'" style="animation-delay:'
        +(i*35)+'ms">'+t.t+'</button>'; }).join('')+'</div>';
  } else {
    items='<div class="tiles">'+s.tiles.map(function(t,i){
      return '<div class="tile" data-i="'+i+'" style="animation-delay:'+(i*45)+'ms">'
        +'<img src="'+PH[t.p]+'" alt=""><b>'+t.t+'</b></div>'; }).join('')+'</div>';
  }
  $('screen').className='screen';
  $('screen').innerHTML='<div class="q">'+s.q+'</div>'
    +(trail?'<div class="trail">'+trail+'</div>':'')
    +'<div class="body">'+items+'</div>';
  var nodes=$('screen').querySelectorAll('[data-i]');
  for(var k=0;k<nodes.length;k++) nodes[k].onclick=function(){
    var t=s.tiles[+this.getAttribute('data-i')];
    picks.push({label:t.t,photo:t.p||null,key:s.key});
    step++; drawStep();
  };
}

/* ---------------- result ---------------- */
function pickOf(k){ for(var i=0;i<picks.length;i++) if(picks[i].key===k) return picks[i]; return null; }
function heroPhoto(){
  for(var i=picks.length-1;i>=0;i--) if(picks[i].photo) return picks[i].photo;
  return cat().hero[0];
}
function drawResult(){
  setNav();
  if(mode==='sell') drawDraft(); else drawAds();
}
function drawDraft(){
  var c=cat();
  var title=c.draftTitle(picks);
  var facts=picks.map(function(p){return '<span>'+p.label+'</span>';}).join('');
  $('screen').className='screen';
  $('screen').innerHTML='<div class="q">Here is your advert</div>'
   +'<div class="body">'
   +'<div class="draftflag"><span>&#9998;</span> Draft &mdash; three things left to finish</div>'
   +'<div class="card"><img class="hero" src="'+PH[heroPhoto()]+'" alt="">'
   +'<div class="pad"><h3>'+title+'</h3><p>'+c.draftBody(picks)+'</p>'
   +'<div class="facts">'+facts+'</div></div></div>'
   +'<div class="todo" id="todo">'
   +'<div data-t="1"><span class="plus">+</span> Add your own photos</div>'
   +'<div data-t="2"><span class="plus">+</span> Check the wording</div>'
   +'<div data-t="3"><span class="plus">+</span> Confirm your number</div>'
   +'</div></div>'
   +'<div class="foot"><button class="btn solid" id="pub" style="width:100%">Publish it</button>'
   +'<div class="hint" id="pubhint">'+(picks.length+1)+' taps to get here</div></div>';
  var tds=$('todo').children;
  for(var i=0;i<tds.length;i++) tds[i].onclick=function(){ this.className=this.className?'':'did'; };
  $('pub').onclick=function(){
    this.textContent='✓ Live'; this.disabled=true;
    $('pubhint').textContent='Nothing was really published — this is a picture.';
  };
}
function drawAds(){
  var c=cat(), all=c.ads(picks);
  /* Ranking, not a fake filter. A price answer re-ranks by price, anything else by
     rating - so the shelf never shows R400 under a heading that says "under R300". */
  if(narrow.length){
    var last=narrow[narrow.length-1].label;
    if(/R\s?\d|Under|Over|budget|pay/i.test(last)) all.sort(function(a,b){return a.num-b.num;});
    else all.sort(function(a,b){return b.trust-a.trust;});
  }
  var keep = narrow.length ? all.slice(0, [12,8,5][narrow.length-1]) : all;
  var nstep = c.narrow[narrow.length];
  var cards=keep.map(function(a,i){
    return '<div class="ad" style="animation-delay:'+(i*25)+'ms"><img src="'+PH[a.p]+'" alt="">'
     +'<div class="p"><div class="t">'+a.t+'</div>'
     +'<div class="m"><b>'+a.price+'</b><span>&#9733; '+a.trust+'</span></div></div></div>'; }).join('');
  var trail=picks.concat(narrow).map(function(p){
    return p.photo?'<img src="'+PH[p.photo]+'" alt="">':'<span>'+p.label+'</span>'; }).join('');
  $('screen').className='screen';
  $('screen').innerHTML=
    '<div class="q" style="font-size:18px">'+(nstep?nstep.q:'Your five')+'</div>'
   +'<div class="trail">'+trail+'</div>'
   +'<div class="body">'
   +(nstep?'<div class="chips" style="margin-bottom:14px">'+nstep.tiles.map(function(t,i){
        return '<button class="chip" data-n="'+i+'" style="animation-delay:'+(i*35)+'ms">'+t.t+'</button>';
      }).join('')+'</div>':'')
   +'<div class="count">'+(nstep?'<b>'+keep.length+'</b> '+(narrow.length?'best match':'found')
      :'<b>'+keep.length+'</b> &mdash; your shelf, best match first')+'</div>'
   +'<div class="grid">'+cards+'</div></div>';
  if(nstep){
    var ns=$('screen').querySelectorAll('[data-n]');
    for(var k=0;k<ns.length;k++) ns[k].onclick=function(){
      narrow.push({label:nstep.tiles[+this.getAttribute('data-n')].t,photo:null});
      drawAds();
    };
  }
}

/* ---------------- nav ---------------- */
$('back').onclick=function(){
  if(mode==='find' && narrow.length){ narrow.pop(); drawAds(); return; }
  if(step>0){ step--; picks.pop(); drawStep(); return; }
  drawDoor();
};
$('home').onclick=drawDoor;

/* swipe on the door */
var sx=null;
$('app').addEventListener('touchstart',function(e){ if(!mode) sx=e.touches[0].clientX; },{passive:true});
$('app').addEventListener('touchend',function(e){
  if(mode||sx===null) return;
  var dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>55) swipe(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',function(e){
  if(mode){ if(e.key==='Escape') $('back').onclick(); return; }
  if(e.key==='ArrowLeft') swipe(-1);
  if(e.key==='ArrowRight') swipe(1);
});


CATS.forEach(function(c){
  c.ads=function(picks){
    var out=[], n=18, seed=0;
    picks.forEach(function(p){ for(var i=0;i<p.label.length;i++) seed+=p.label.charCodeAt(i); });
    for(var i=0;i<n;i++){
      var t=c._adt[(i+seed)%c._adt.length].replace('%d', 2+((i*7+seed)%12));
      var pr=c.priceOf((i*13+seed)%100);
      out.push({p:c._adp[(i+seed)%c._adp.length], t:t, price:pr,
                num:parseInt(String(pr).replace(/[^0-9]/g,''),10)||0,
                trust:60+((i*17+seed)%40)});
    }
    out.sort(function(a,b){return b.trust-a.trust;});
    return out;
  };
  c.draftTitle=function(picks){ return picks[0].label+' \u2014 '+(picks[1]?picks[1].label:c.name); };
  c.draftBody=function(picks){
    return 'Written from your '+picks.length+' taps. '+picks.map(function(p){return p.label;}).join(', ')
      +'. Change any word of it before it goes up.'; };
});

CATS.forEach(function(c){
  var B={homehelp:['R250 a day','R300 a day','R350 a day','R400 a day'],
   property:['R1 450 000','R2 195 000','R3 400 000','R895 000'],
   cars:['R129 900','R249 500','R385 000','R549 000'],
   tutors:['R200 an hour','R250 an hour','R300 an hour','R180 an hour'],
   services:['R450 call-out','R650 call-out','Free quote','R380 an hour'],
   collectors:['R1 250','R4 800','R18 500','R950'],
   adventures:['R1 900 pp','R3 400 pp','R5 950 pp','R1 250 pp'],
   localmarket:['R85','R240','R1 450','R620']}[c.key];
  c.priceOf=function(n){ return B[n%B.length]; };
});

drawDoor();
</script>
