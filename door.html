<head>

<title>TrustSquare</title>
<style>
/* ONE-DOOR-1 (DOOR_BRIEF.md): the one entry screen. Opens like a film -- a living collage of the journey photographs;
   one slide turns it into local adverts for the visitor's interest; one tap opens the app of that type. */
:root{--snap:#2563eb;--quick:#16a34a;--ts:#7c3aed;--pa:#dc2626;--night:#06090f;--white:#f8fafc;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--white);font-family:var(--sans);color-scheme:dark;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none}
.door{position:fixed;inset:0;cursor:pointer}
.collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.25fr 1fr 1.15fr 1fr;gap:3px;transition:opacity 1s ease}
.pane{position:relative;overflow:hidden;background:#111}
.pane.wide{grid-column:1 / 3}
.pane img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease;transform-origin:var(--ox,50%) var(--oy,50%)}
.pane img.on{opacity:1;animation:drift 9s ease-out forwards}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.16) translate(var(--dx,-2%),var(--dy,-1%))}}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,rgba(0,0,0,.72) 100%)}
.mark{position:absolute;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--serif);font-size:30px;letter-spacing:.02em;text-shadow:0 2px 18px rgba(0,0,0,.6);transition:opacity .8s;pointer-events:none}
.mark small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.8;margin-top:4px}
.stream{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none;overflow:hidden;background:var(--night);touch-action:none}
.stream.show{opacity:1;pointer-events:auto}
.lane{display:flex;flex-direction:column;gap:6px;padding:calc(140px + env(safe-area-inset-top,0px)) 8px 0;will-change:transform;max-width:560px;margin:0 auto}
.ad,.pa{position:relative;border-radius:16px;overflow:hidden;flex:0 0 auto;background:#111}
.ad{height:236px}.pa{height:330px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.ad img,.pa img{width:100%;height:100%;object-fit:cover;display:block}
.ad .txt{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.78))}
.ad .txt b{display:block;font-size:15px;line-height:1.25}.ad .txt span{font-size:12px;color:#e2e8f0}
.ad .price{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.ad .cat{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.9);color:#0f172a;padding:4px 8px;border-radius:999px}
.pa header{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 12px;background:linear-gradient(180deg,rgba(6,9,15,0),rgba(6,9,15,.86) 45%)}
.pa .kind{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:#c8102e;padding:3px 7px;border-radius:3px}
.pa h4{margin:6px 0 3px;font-size:17px;line-height:1.2;font-family:var(--serif);font-weight:600;color:#fff}
.pa .ex{font-size:9.5px;letter-spacing:.1em;color:#cbd5e1;text-transform:uppercase}
.slidebar{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 26px max(18px,env(safe-area-inset-left,0px));cursor:default;transition:background .6s}
.door.streaming .slidebar{background:linear-gradient(180deg,var(--night) 0%,var(--night) 80%,rgba(6,9,15,0) 100%)}
.slidebar .in{max-width:520px;margin:0 auto}
.stops{position:relative;height:14px;margin:0 22px 6px;font-size:10px;font-weight:800;letter-spacing:.08em}
.stops span{position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap;color:rgba(255,255,255,.62);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.stops span:last-child{transform:translateX(-80%)}
.stops span.on{color:#fff}
.track{position:relative;height:40px;margin:0 22px}
.rail{position:absolute;left:0;right:0;top:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
.dot{position:absolute;top:14px;width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.9);transform:translateX(-50%)}
.track input{position:absolute;top:0;left:-22px;width:calc(100% + 44px);height:40px;margin:0;opacity:0;cursor:pointer;z-index:2;-webkit-appearance:none;appearance:none}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:40px}
.track input:focus-visible + .thumb{outline:3px solid #fff;outline-offset:3px}
.thumb{position:absolute;top:3px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid #fff;
  box-shadow:0 2px 12px rgba(0,0,0,.35);transform:translateX(-50%);transition:left .2s ease,background .25s;pointer-events:none}
.thumb.set{background:#fff}
.cue{height:3px;margin:8px 22px 0;border-radius:2px;background:var(--c,transparent);transition:background .3s}
.ibar{margin-top:7px;min-height:14px;text-align:center;font-size:11px;color:#e2e8f0;opacity:0;transition:opacity .4s}
.ibar.show{opacity:1}
.tap{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;white-space:nowrap;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;
  background:var(--c,rgba(255,255,255,.16));color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:0 6px 24px rgba(0,0,0,.35);transition:background .3s;pointer-events:none}
.tap i{font-style:normal;opacity:.8;font-weight:500}
@media (prefers-reduced-motion:reduce){.pane img.on{animation:none}.lane{transform:none!important}}
</style>
</head>

var $=function(id){return document.getElementById(id);};
var css=function(v){return "var("+v+")";};
var ME={interest:[],via:null,last_app:null,pro:false}, CITY="Pretoria", ADS=[], cur=0, last="ts";
try{ var la=localStorage.getItem("ts_last_app"); if(la&&/^(snap|quick|ts|pa)$/.test(la)) last=la; }catch(e){}

/* collage: six panes, one cross-fade every 1.4 s */
var PANES=[1,0,0,1,0,0];
function buildCollage(){
  $("collage").innerHTML=PANES.map(function(w,i){return '<div class="pane'+(w?' wide':'')+'" id="pane'+i+'"><img alt=""><img alt=""></div>';}).join("");
  PANES.forEach(function(w,i){ show(i,(i*5)%COL.length); });
  var turn=0; setInterval(function(){ if(cur>0||document.hidden) return; var i=turn%PANES.length; turn++;
    show(i,(+$("pane"+i).dataset.n+PANES.length+1)%COL.length); },900);   // DOOR-SPEED-1: livelier collage (was 1400)
}
function show(i,n){
  var el=$("pane"+i), im=el.querySelectorAll("img"), a=im[0].classList.contains("on")?im[1]:im[0], b=a===im[0]?im[1]:im[0];
  a.onload=function(){ a.style.setProperty("--dx",(Math.random()*4-2).toFixed(1)+"%"); a.style.setProperty("--dy",(Math.random()*3-1.5).toFixed(1)+"%");
    a.style.setProperty("--ox",(30+Math.random()*40)+"%"); a.style.setProperty("--oy",(30+Math.random()*40)+"%");
    a.classList.remove("on"); void a.offsetWidth; a.classList.add("on"); b.classList.remove("on"); };
  a.src=IMG+COL[n%COL.length]+".jpg"; el.dataset.n=n;
}

/* slider: three stops, one colour */
function buildSlider(){
  $("stops").innerHTML=APPS.slice(1).map(function(a,i){return '<span data-i="'+(i+1)+'" style="left:'+(100*(i+1)/3)+'%">'+a.name.toUpperCase()+'</span>';}).join("");
  $("dots").innerHTML=APPS.slice(1).map(function(a,i){return '<div class="dot" style="left:'+(100*(i+1)/3)+'%"></div>';}).join("");
  $("slider").addEventListener("input",function(e){ cur=+e.target.value; render(); });
  ["click","pointerdown","pointerup","touchstart"].forEach(function(t){ $("slidebar").addEventListener(t,function(e){ e.stopPropagation(); },{passive:true}); });
}
function appOf(k){ return k==="pa"?PAAPP:(APPS.filter(function(a){return a&&a.key===k;})[0]||APPS[3]); }
function render(){
  $("thumb").style.left=(100*cur/3)+"%"; $("thumb").classList.toggle("set",cur>0);
  Array.prototype.forEach.call(document.querySelectorAll("#stops span"),function(s){ s.classList.toggle("on",+s.dataset.i===cur); });
  var a=APPS[cur], target=a||PAAPP;   // RUL-247: at rest (left), the door is the AI PA door
  $("cue").style.setProperty("--c",a?css(a.c):"transparent");
  var tap=$("tap"); tap.style.setProperty("--c",a?css(a.c):"rgba(255,255,255,.16)");
  tap.innerHTML = a ? T("Tap to open {app}",{app:a.name})+' <i>&middot; '+T("where you left off")+'</i>' : T("Tap to meet your AI PA");
  $("collage").style.opacity=a?0:1; $("mark").style.opacity=a?0:1;
  $("stream").classList.toggle("show",!!a); $("door").classList.toggle("streaming",!!a);
  var ib=$("ibar");
  if(a&&ME.interest.length){ ib.textContent=T("Your interest: {cats}",{cats:ME.interest.map(function(c){return T(c);}).join(" · ")})+" — "+
      (ME.via==="prospect"?T("from your public adverts"):T("from your previous use")); ib.classList.add("show"); }
  else if(a){ ib.textContent=T("Everything near you")+" · "+CITY; ib.classList.add("show"); }
  else ib.classList.remove("show");
  if(a) buildLane();
}

/* the stream: local adverts for her interest, AI PA cards woven in */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function interleave(list){ var g={},keys=[]; list.forEach(function(x){ if(!g[x.cat]){g[x.cat]=[];keys.push(x.cat);} g[x.cat].push(x); });
  var out=[],i=0; while(out.length<list.length){ var k=keys[i%keys.length]; if(g[k].length) out.push(g[k].shift()); i++; } return out; }
var laneKey="", off=0, paTurn=0;
function buildLane(){
  var key=ME.interest.join(",")+"|"+ADS.length; if(key===laneKey) return; laneKey=key; off=0;
  var list=ME.interest.length?ADS.filter(function(x){return ME.interest.indexOf(x.cat)>=0;}):ADS;
  if(list.length<3) list=ADS;            // too little for her interest yet: everything near her, never an empty screen
  list=interleave(list);
  var html=[], n=0;
  list.forEach(function(d,i){
    html.push('<div class="ad" data-id="'+esc(d.id)+'"><img src="'+esc(d.img)+'" alt="" loading="lazy"><span class="cat">'+esc(T(d.cat))+'</span>'+
      (d.price?'<span class="price">'+esc(d.price)+'</span>':'')+'<div class="txt"><b>'+esc(d.title)+'</b><span>'+esc(d.where||"")+'</span></div></div>');
    if(i%3===2){ var p=PA[paTurn%PA.length]; paTurn++;
      html.push('<article class="pa" data-pa="1"><img src="'+IMG+'pa_'+p.img[n++%p.img.length]+'.jpg" alt="" loading="lazy"><header><span class="kind">'+esc(T(p.k))+
        '</span><h4>'+esc(T(p.h))+'</h4><span class="ex">AI PA · '+esc(T("Example"))+'</span></header></article>'); }
  });
  if(!list.length){ html=PA.map(function(p,i){ return '<article class="pa" data-pa="1"><img src="'+IMG+'pa_'+p.img[0]+'.jpg" alt=""><header><span class="kind">'+esc(T(p.k))+
      '</span><h4>'+esc(T(p.h))+'</h4><span class="ex">AI PA · '+esc(T("Example"))+'</span></header></article>'; }); }
  var one=html.join(""); $("lane").innerHTML=one+one+one;
}
var t0=performance.now(), reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick(now){ var dt=Math.min(64,now-t0); t0=now;
  if(cur>0&&!document.hidden){ var l=$("lane"), per=l.scrollHeight/3;
    if(!drag&&!reduce&&now>held) off+=dt*0.045;   // DOOR-SPEED-1: was 0.028
    if(per>0){ while(off>=per) off-=per; while(off<0) off+=per; }
    l.style.transform="translateY("+(-off)+"px)"; }
  requestAnimationFrame(tick); }

/* the tap: anywhere opens the app of that type; an AI PA card opens the AI PA door; an advert on TrustSquare opens that advert */
function go(app,url){
  try{ localStorage.setItem("ts_last_app",app.key); }catch(e){}
  try{ fetch("/door/last",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({app:app.key}),keepalive:true}).catch(function(){}); }catch(e){}
  location.href=url||app.url;
}
/* DOOR-SPEED-1: a finger (or mouse wheel) scrolls the stream; the drift resumes 2.5 s after she lets go. A drag is never a tap. */
var drag=null, held=0, moved=false;
$("stream").addEventListener("pointerdown",function(e){ drag={y:e.clientY,o:off}; moved=false; });
window.addEventListener("pointermove",function(e){ if(!drag) return; var d=drag.y-e.clientY; if(Math.abs(d)>8) moved=true; if(moved) off=drag.o+d; });
window.addEventListener("pointerup",function(){ if(drag){ drag=null; held=performance.now()+2500; } });
window.addEventListener("pointercancel",function(){ drag=null; held=performance.now()+2500; });
$("stream").addEventListener("wheel",function(e){ off+=e.deltaY; held=performance.now()+2500; e.preventDefault(); },{passive:false});
$("door").addEventListener("click",function(e){
  if(moved){ moved=false; return; }
  var pa=e.target.closest&&e.target.closest("[data-pa]"); if(pa){ go(PAAPP); return; }
  var a=APPS[cur]||PAAPP;   // RUL-247: a tap on the collage opens the AI PA door
  var ad=e.target.closest&&e.target.closest(".ad");
  if(ad&&a.key==="ts"&&ad.dataset.id) { go(a,"/?listing="+encodeURIComponent(ad.dataset.id)); return; }
  go(a);
});

/* data: who she is (interest, last app) and what is near her */
function load(){
  var j=function(r){ if(!r.ok) throw new Error(r.status); return r.json(); };
  var meP=fetch("/door/me",{credentials:"same-origin"}).then(j).then(function(m){ ME=m||ME; ME.interest=ME.interest||[];
      if(m&&m.last_app) last=m.last_app; }).catch(function(){});
  var geoP=fetch("/quick/me",{credentials:"same-origin"}).then(j).then(function(q){ var c=(q&&(q.city||(q.geo&&q.geo.city)))||""; if(c) CITY=c; }).catch(function(){});
  return Promise.all([meP,geoP]).then(function(){
    $("city").textContent=CITY;
    return fetch("/listings?city="+encodeURIComponent(CITY)+"&page_size=120"+(DEMO?"&demo=1":""),{credentials:"same-origin"}).then(j).then(function(L){
      ADS=(L||[]).filter(function(l){ return l&&l.thumb_url&&l.title; }).map(function(l){
        var c=CATMAP[String(l.category||"").toLowerCase()]||null;
        return {id:l.id,img:l.medium_url||l.thumb_url,title:l.title,price:l.price||"",where:l.suburb||l.area||l.city||"",cat:c};
      }).filter(function(x){return x.cat;});
    }).catch(function(){ ADS=[]; });
  }).then(function(){ laneKey=""; render(); });
}
buildCollage(); buildSlider(); render(); requestAnimationFrame(tick); load();
})();
</script>
