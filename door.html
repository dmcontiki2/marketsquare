<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="/app.webmanifest">
<title>TrustSquare</title>
<style>
/* ONE-DOOR-1 (DOOR_BRIEF.md): the one entry screen. Opens like a film -- a living collage of the journey photographs;
   one slide turns it into local adverts for the visitor's interest; one tap opens the app of that type. */
:root{--snap:#2563eb;--quick:#16a34a;--ts:#7c3aed;--pa:#dc2626;--night:#06090f;--white:#f8fafc;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--white);font-family:var(--sans);color-scheme:dark;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none}
.door{position:fixed;inset:0;cursor:pointer}
.collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.25fr 1fr 1.15fr 1fr;gap:3px;transition:opacity 1s ease}
.pane{position:relative;overflow:hidden;background:#111}
.pane.wide{grid-column:1 / 3}
.pane img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease;transform-origin:var(--ox,50%) var(--oy,50%)}
.pane img.on{opacity:1;animation:drift 9s ease-out forwards}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.16) translate(var(--dx,-2%),var(--dy,-1%))}}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,rgba(0,0,0,.72) 100%)}
.mark{position:absolute;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--serif);font-size:30px;letter-spacing:.02em;text-shadow:0 2px 18px rgba(0,0,0,.6);transition:opacity .8s;pointer-events:none}
.mark small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.8;margin-top:4px}
.stream{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none;overflow:hidden;background:var(--night);touch-action:none}
.stream.show{opacity:1;pointer-events:auto}
.lane{display:flex;flex-direction:column;gap:6px;padding:calc(140px + env(safe-area-inset-top,0px)) 8px 0;will-change:transform;max-width:560px;margin:0 auto}
.ad,.pa{position:relative;border-radius:16px;overflow:hidden;flex:0 0 auto;background:#111}
.ad{height:236px}.pa{height:330px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.ad img,.pa img{width:100%;height:100%;object-fit:cover;display:block}
.ad .txt{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.78))}
.ad .txt b{display:block;font-size:15px;line-height:1.25}.ad .txt span{font-size:12px;color:#e2e8f0}
/* DOOR-INVITE-1 (RUL-249): an example advert is never passed off as real -- it carries "Your listing here" and opens selling */
.ad .yours{position:absolute;right:10px;bottom:12px;z-index:1;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:rgba(6,9,15,.8);
  border:1px solid rgba(255,255,255,.55);padding:5px 9px;border-radius:999px;white-space:nowrap}
.ad.ex .txt{padding-right:136px}
/* DOOR-PICK-1 (RUL-250): a hidden side swipe opens her own categories; a small tab on the right edge is the hint */
.cattab{position:absolute;right:0;top:50%;z-index:5;transform:translateY(-50%);display:none;align-items:center;gap:4px;padding:10px 8px 10px 10px;
  border-radius:12px 0 0 12px;background:rgba(6,9,15,.78);border:1px solid rgba(255,255,255,.45);border-right:0;color:#fff;font-size:11px;font-weight:800;
  letter-spacing:.06em;writing-mode:vertical-rl;text-orientation:mixed;cursor:pointer;box-shadow:-4px 0 18px rgba(0,0,0,.35)}
.door.streaming .cattab{display:flex}
.cattab b{writing-mode:horizontal-tb;font-size:14px}
.cattab.pulse{animation:tabpulse 1.2s ease 2}
@keyframes tabpulse{0%,100%{transform:translateY(-50%) translateX(0)}50%{transform:translateY(-50%) translateX(-8px)}}
.lane.nudge{animation:lanenudge 1.1s ease}
@keyframes lanenudge{0%,100%{margin-left:0}45%{margin-left:-46px}}
.picker{position:absolute;inset:0;z-index:7;background:var(--night);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.picker.open{transform:translateX(0)}
.picker .ph{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 10px;font-family:var(--serif);font-size:24px}
.picker .ph button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer}
.picker .pl{flex:1;overflow-y:auto;padding:0 10px 30px;display:flex;flex-direction:column;gap:8px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box;touch-action:pan-y}
.ct{position:relative;height:150px;border-radius:16px;overflow:hidden;flex:0 0 auto;cursor:pointer;background:#111}
.ct img{width:100%;height:100%;object-fit:cover;display:block}
.ct .cn{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 10px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.8))}
.ct .cn b{display:block;font-family:var(--serif);font-size:22px;font-weight:600}
.ct .subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ct .subs span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45)}
.ct.on{outline:3px solid #fff;outline-offset:-3px}
.ct.all{height:64px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.45);font-weight:800;letter-spacing:.06em}
.ad .price{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.ad .cat{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.9);color:#0f172a;padding:4px 8px;border-radius:999px}
.pa header{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 12px;background:linear-gradient(180deg,rgba(6,9,15,0),rgba(6,9,15,.86) 45%)}
.pa .kind{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:#c8102e;padding:3px 7px;border-radius:3px}
.pa h4{margin:6px 0 3px;font-size:17px;line-height:1.2;font-family:var(--serif);font-weight:600;color:#fff}
.pa .ex{font-size:9.5px;letter-spacing:.1em;color:#cbd5e1;text-transform:uppercase}
.slidebar{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 26px max(18px,env(safe-area-inset-left,0px));cursor:default;transition:background .6s}
.door.streaming .slidebar{background:linear-gradient(180deg,var(--night) 0%,var(--night) 80%,rgba(6,9,15,0) 100%)}
.slidebar .in{max-width:520px;margin:0 auto}
/* DOOR-WHEEL-1 (RUL-248): the top is a sideways wheel -- AI PA · Snap · Quick · TrustSquare. A finger swipes it left or right;
   the chosen name sits in the centre pill, straight above the bottom button, which always opens that name. */
.wheel{position:relative;height:44px;overflow:hidden;touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%)}
.wheel:active{cursor:grabbing}
.pill{position:absolute;left:50%;top:5px;width:118px;height:34px;transform:translateX(-50%);border-radius:999px;border:2px solid #fff;
  background:var(--c,rgba(255,255,255,.14));box-shadow:0 2px 12px rgba(0,0,0,.35);transition:background .3s;pointer-events:none}
.strip{position:absolute;top:0;left:50%;height:44px;display:flex;align-items:center;transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
.strip.live{transition:none}
.strip span{flex:0 0 118px;text-align:center;white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.6);
  text-shadow:0 1px 6px rgba(0,0,0,.6);transition:color .2s,font-size .2s;position:relative;z-index:1}
.strip span.on{color:#fff;font-size:13px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.cue{height:3px;margin:8px 22px 0;border-radius:2px;background:var(--c,transparent);transition:background .3s}
.ibar{margin-top:7px;min-height:14px;text-align:center;font-size:11px;color:#e2e8f0;opacity:0;transition:opacity .4s}
.ibar.show{opacity:1}
/* DOOR-TWIN-1 (RUL-248): the bottom button is the twin of the top pill -- same size, border, colour and word */
.tap{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;white-space:nowrap;
  width:118px;height:34px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:999px;border:2px solid #fff;
  font-size:13px;font-weight:800;letter-spacing:.08em;background:var(--c,rgba(255,255,255,.14));color:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.35);transition:background .3s;pointer-events:auto;cursor:pointer}
@media (prefers-reduced-motion:reduce){.pane img.on{animation:none}.lane{transform:none!important}}
</style>
</head>

    html.push('<div class="ad'+(d.ex?' ex" data-ex="1':'')+'" data-id="'+esc(d.id)+'" data-cat="'+esc(d.cat||"")+'"><img src="'+esc(d.img)+'" alt="" loading="lazy"><span class="cat">'+esc(T(d.cat))+'</span>'+
      (d.price?'<span class="price">'+esc(d.price)+'</span>':'')+'<div class="txt"><b>'+esc(d.title)+'</b><span>'+esc(d.where||"")+'</span></div>'+
      (d.ex?'<span class="yours">'+esc(T("Your listing here"))+'</span>':'')+'</div>');
    if(i%3===2){ var p=PA[paTurn%PA.length]; paTurn++;
      html.push('<article class="pa" data-pa="1"><img src="'+IMG+'pa_'+p.img[n++%p.img.length]+'.jpg" alt="" loading="lazy"><header><span class="kind">'+esc(T(p.k))+
        '</span><h4>'+esc(T(p.h))+'</h4><span class="ex">AI PA · '+esc(T("Example"))+'</span></header></article>'); }
  });
  if(!list.length){ html=PA.map(function(p,i){ return '<article class="pa" data-pa="1"><img src="'+IMG+'pa_'+p.img[0]+'.jpg" alt=""><header><span class="kind">'+esc(T(p.k))+
      '</span><h4>'+esc(T(p.h))+'</h4><span class="ex">AI PA · '+esc(T("Example"))+'</span></header></article>'; }); }
  var one=html.join(""); $("lane").innerHTML=one+one+one;
}
var t0=performance.now(), reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick(now){ var dt=Math.min(64,now-t0); t0=now;
  if(cur>0&&!document.hidden){ var l=$("lane"), per=l.scrollHeight/3;
    if(!drag&&!reduce&&now>held) off+=dt*0.045;   // DOOR-SPEED-1: was 0.028
    if(per>0){ while(off>=per) off-=per; while(off<0) off+=per; }
    l.style.transform="translateY("+(-off)+"px)"; }
  requestAnimationFrame(tick); }

/* the tap: anywhere opens the app of that type; an AI PA card opens the AI PA door; an advert on TrustSquare opens that advert */
/* EX-DOOR-1 (outreach audit, 24 Oct 2026): an example opens selling in ITS OWN Quick door, in her city and country -- a tap on
   a New York property example used to open the Services door with no city, so Quick had to guess both again. */
var QDOOR={Property:"property",Services:"services",Tutors:"tutors",Collectors:"collectors",Cars:"cars",Adventures:"adventures"};
function exUrl(ad){ var q=QDOOR[(ad&&ad.dataset.cat)||""]||"";
  return "/quick/"+q+"?src="+encodeURIComponent(INSRC||"door-example")+(CC?"&cc="+encodeURIComponent(CC):"")+(CITY?"&city="+encodeURIComponent(CITY):""); }
function go(app,url){
  if(app===PAAPP&&!url) url=ME.pro?"/pa":"/pa/about";   // PA-GATE-1: a non-Pro goes straight to the explainer; /pa refuses him (401)
  try{ localStorage.setItem("ts_last_app",app.key); }catch(e){}
  try{ fetch("/door/last",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({app:app.key}),keepalive:true}).catch(function(){}); }catch(e){}
  url=url||app.url;
  if(INSRC&&!/[?&]src=/.test(url)) url+=(url.indexOf("?")<0?"?":"&")+"src="+encodeURIComponent(INSRC);   // DOOR-LINK-1
  location.href=url;
}
/* DOOR-SPEED-1: a finger (or mouse wheel) scrolls the stream; the drift resumes 2.5 s after she lets go. A drag is never a tap. */
var drag=null, held=0, moved=false;
/* DOOR-TOUCH-1: phones get real touch events (a browser that starts its own pan sends pointercancel and kills a pointer drag);
   the mouse keeps pointer events. */
/* DOOR-PICK-1: a sideways swipe (right to left) on the stream opens her categories; up/down still scrolls */
function dStart(y,x){ drag={y:y,x:x||0,o:off,h:null,dx:0}; moved=false; }
function dMove(y,x){ if(!drag) return false; var d=drag.y-y, dx=(x||0)-drag.x; drag.dx=dx;
  if(drag.h===null&&(Math.abs(d)>8||Math.abs(dx)>8)) drag.h=Math.abs(dx)>Math.abs(d);
  if(drag.h===null) return false; moved=true; if(!drag.h) off=drag.o+d; return true; }
function dEnd(){ if(drag){ var sw=drag.h&&drag.dx<-60; drag=null; held=performance.now()+2500; if(sw) openPicker(); } }
$("stream").addEventListener("touchstart",function(e){ if(e.touches.length===1) dStart(e.touches[0].clientY,e.touches[0].clientX); },{passive:true});
window.addEventListener("touchmove",function(e){ if(drag&&e.touches.length===1&&dMove(e.touches[0].clientY,e.touches[0].clientX)) e.preventDefault(); },{passive:false});
window.addEventListener("touchend",dEnd); window.addEventListener("touchcancel",dEnd);
$("stream").addEventListener("pointerdown",function(e){ if(e.pointerType!=="touch") dStart(e.clientY,e.clientX); });
window.addEventListener("pointermove",function(e){ if(e.pointerType!=="touch") dMove(e.clientY,e.clientX); });
window.addEventListener("pointerup",function(e){ if(e.pointerType!=="touch") dEnd(); });
window.addEventListener("pointercancel",function(e){ if(e.pointerType!=="touch") dEnd(); });
$("stream").addEventListener("wheel",function(e){ off+=e.deltaY; held=performance.now()+2500; e.preventDefault(); },{passive:false});
/* DOOR-PICK-1 (RUL-250): the categories screen -- our photographs, sub-categories as chips, one tap picks and returns */
var pickOff=0, pickHeld=0, pickOpen=false;
function subsFor(cat){ var n={}; ADS.concat(EX).forEach(function(x){ if(x.cat===cat&&x.sub) n[x.sub]=(n[x.sub]||0)+(x.ex?1:3); });
  return Object.keys(n).sort(function(a,b){ return n[b]-n[a]; }).slice(0,6); }
function openPicker(){
  var cats=["Property","Cars","Collectors","Adventures","Services","Tutors","Local Market"];
  $("pickt").textContent=T("Categories");
  $("pl").innerHTML='<div class="ct all'+(CHOICE?'':' on')+'" data-cat="">'+esc(T("All"))+'</div>'+cats.map(function(c){
    return '<div class="ct'+(CHOICE&&CHOICE.cat===c?' on':'')+'" data-cat="'+esc(c)+'"><img src="'+CATIMG[c]+'" alt="" loading="lazy"><div class="cn"><b>'+esc(T(c))+'</b>'+
      '<div class="subs">'+subsFor(c).map(function(sb){ return '<span data-sub="'+esc(sb)+'">'+esc(sb)+'</span>'; }).join("")+'</div></div></div>'; }).join("");
  $("pl").scrollTop=0; pickHeld=performance.now()+1200; pickOpen=true; $("picker").classList.add("open"); $("picker").setAttribute("aria-hidden","false");
}
function closePicker(){ pickOpen=false; $("picker").classList.remove("open"); $("picker").setAttribute("aria-hidden","true"); }
function choose(cat,sub){
  CHOICE=cat?{cat:cat,sub:sub||""}:null;
  try{ if(CHOICE) localStorage.setItem("ts_door_choice",JSON.stringify(CHOICE)); else localStorage.removeItem("ts_door_choice"); }catch(e){}
  try{ fetch("/door/last",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",
        body:JSON.stringify({choice:CHOICE?CHOICE.cat:"",sub:CHOICE?CHOICE.sub:""}),keepalive:true}).catch(function(){}); }catch(e){}
  closePicker(); laneKey=""; render();
}
["click","pointerdown","pointerup","touchstart"].forEach(function(t){ $("picker").addEventListener(t,function(e){ e.stopPropagation(); },{passive:true}); $("cattab").addEventListener(t,function(e){ e.stopPropagation(); },{passive:true}); });
$("cattab").addEventListener("click",function(){ openPicker(); });
$("pickx").addEventListener("click",function(){ closePicker(); });
$("pl").addEventListener("click",function(e){ var sb=e.target.closest("[data-sub]"), ct=e.target.closest(".ct"); if(!ct) return;
  choose(ct.dataset.cat, sb?sb.dataset.sub:""); });
/* the categories drift slowly, like the adverts; a finger takes over, and a swipe back to the right closes */
(function(){ var sx=null, sy=0;
  $("pl").addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; pickHeld=performance.now()+2500; },{passive:true});
  $("pl").addEventListener("touchend",function(e){ var t=e.changedTouches[0]; if(sx!==null&&t.clientX-sx>70&&Math.abs(t.clientY-sy)<50) closePicker(); sx=null; pickHeld=performance.now()+2500; });
  $("pl").addEventListener("wheel",function(){ pickHeld=performance.now()+2500; },{passive:true});
  $("pl").addEventListener("pointerdown",function(){ pickHeld=performance.now()+2500; });
  var t0p=performance.now(); (function step(now){ var dt=Math.min(64,now-t0p); t0p=now;
    if(pickOpen&&!reduce&&now>pickHeld){ var pl=$("pl"); pickOff=(pickOff||pl.scrollTop)+dt*0.03; pl.scrollTop=pickOff; if(pl.scrollTop+pl.clientHeight>=pl.scrollHeight-1) pickHeld=now+1e9; }
    else pickOff=0; requestAnimationFrame(step); })(t0p);
})();
/* the hint: on her first stream the tab pulses and the adverts lean left once, then never again */
function nudgeOnce(){ var k="ts_door_nudged"; try{ if(localStorage.getItem(k)) return; localStorage.setItem(k,"1"); }catch(e){ return; }
  setTimeout(function(){ $("cattab").classList.add("pulse"); $("lane").classList.add("nudge"); setTimeout(function(){ $("lane").classList.remove("nudge"); },1200); },1500); }
/* DOOR-SYNC-1: the bottom button is its own target -- it always opens what the top slider shows. It used to let the tap
   fall through to whatever card was scrolling underneath it (an AI PA card or an advert), so it could open something else. */
$("tap").addEventListener("click",function(e){ e.stopPropagation(); if(moved){ moved=false; return; } go(APPS[cur]||PAAPP); });
/* DOOR-SYNC-1: a back-navigation or a restored form can leave the slider showing one stop while cur holds another;
   the slider's own value is the truth. */
window.addEventListener("pageshow",function(){ var v=+$("slider").value||0; if(v!==cur){ cur=v; render(); } });
$("door").addEventListener("click",function(e){
  if(moved){ moved=false; return; }
  var pa=e.target.closest&&e.target.closest("[data-pa]"); if(pa){ go(PAAPP); return; }
  var a=APPS[cur]||PAAPP;   // RUL-247: a tap on the collage opens the AI PA door
  var ad=e.target.closest&&e.target.closest(".ad");
  if(ad&&ad.dataset.ex) { go(APPS[2],exUrl(ad)); return; }   // RUL-249: an example opens selling, never the example
  if(ad&&ad.dataset.id) { go(APPS[3],"/?listing="+encodeURIComponent(ad.dataset.id)); return; }   // RUL-248: any advert opens that advert in TrustSquare
  go(a);
});

/* data: who she is (interest, last app) and what is near her */
function load(){
  var j=function(r){ if(!r.ok) throw new Error(r.status); return r.json(); };
  var meP=fetch("/door/me",{credentials:"same-origin"}).then(j).then(function(m){ ME=m||ME; ME.interest=ME.interest||[];
      if(m&&m.last_app) last=m.last_app;
      if(!CHOICE&&m&&m.choice&&m.choice.cat) CHOICE={cat:m.choice.cat,sub:m.choice.sub||""}; }).catch(function(){});
  /* DOOR-CITY-1 (David, 23 Oct 2026): she lands in a city TrustSquare covers, never in a borough or suburb name nobody lists
     under ("Brooklyn" -> New York, "Centurion" -> Pretoria). Order: her account's city; the city the main app already
     settled for her (her own pick, else GEO-AUTO-1's detection incl. phone location); then the network -- the covered
     city of that name, else the nearest covered city within 150 km of the network's position, else the country's main
     city (the same table as GEO-AUTO-1). Read only, nothing stored. */
  var MAIN={ZA:"Pretoria",US:"New York",GB:"London",AU:"Sydney",KE:"Nairobi",NA:"Windhoek"};
  var km=function(a,b,c,d){ var r=Math.PI/180, x=Math.sin((c-a)*r/2), y=Math.sin((d-b)*r/2);
    return 12742*Math.asin(Math.sqrt(x*x+Math.cos(a*r)*Math.cos(c*r)*y*y)); };
  var geoP=fetch("/quick/me",{credentials:"same-origin"}).then(j).then(function(q){
    CC=String(((q&&q.geo)||{}).country||"").toUpperCase();
    if(q&&q.city){ CITY=q.city; return; }
    var app=""; try{ app=localStorage.getItem("ms_user_city")||localStorage.getItem("ms_auto_city")||""; }catch(e){}
    if(app){ CITY=app; return; }
    var g=(q&&q.geo)||{}, cc=String(g.country||"").toUpperCase(), net=String(g.city||"").toLowerCase();
    if(LINKCITY&&(LINKCC||cc)){   // DOOR-LINK-1: the link's city, when it is one we cover
      var want=LINKCITY.toLowerCase(), lcc=LINKCC||cc;
      return fetch("/geo/cities?country="+encodeURIComponent(lcc)).then(j).then(function(cs){
        var hit=(Array.isArray(cs)?cs:[]).filter(function(c){ return String(c.name||"").toLowerCase()===want; })[0];
        if(hit){ CITY=hit.name; CC=lcc; return; }
        return netCity(g,cc,net);
      }).catch(function(){ return netCity(g,cc,net); });
    }
    return netCity(g,cc,net);
  }).catch(function(){});
  function netCity(g,cc,net){
    if(!cc) { if(g.city) CITY=g.city; return; }
    return fetch("/geo/cities?country="+encodeURIComponent(cc)).then(j).then(function(cs){
      cs=Array.isArray(cs)?cs:[];
      var hit=cs.filter(function(c){ return String(c.name||"").toLowerCase()===net; })[0];
      if(!hit&&typeof g.lat==="number"&&typeof g.lng==="number"){
        var best=null, bd=150;
        cs.forEach(function(c){ if(typeof c.lat!=="number"||typeof c.lng!=="number") return; var d=km(g.lat,g.lng,c.lat,c.lng); if(d<bd){ bd=d; best=c; } });
        hit=best;
      }
      if(hit) CITY=hit.name; else if(MAIN[cc]) CITY=MAIN[cc]; else if(g.city) CITY=g.city;
    }).catch(function(){ if(MAIN[cc]) CITY=MAIN[cc]; });
  }
  return Promise.all([meP,geoP]).then(function(){
    $("city").textContent=CITY;
    return fetch("/listings?city="+encodeURIComponent(CITY)+"&page_size=200&sort=random"+(DEMO?"&demo=1":""),{credentials:"same-origin"}).then(j).then(function(L){
      /* RUL-248: local only (listed in her city -- no trips from other cities, no online, no national reach), and a fresh
         random draw on every visit so every local seller gets an equal turn, however many sellers or visitors there are */
      var here=CITY.toLowerCase();
      ADS=shuffle((L||[]).filter(function(l){ return l&&l.thumb_url&&l.title&&String(l.city||"").toLowerCase()===here&&!isEx(l); })).map(function(l){
        var c=CATMAP[String(l.category||"").toLowerCase()]||null;
        return {id:l.id,img:l.medium_url||l.thumb_url,title:l.title,price:money(l.price),where:l.suburb||l.area||l.city||"",cat:c,sub:subOf(l,c)};
      }).filter(function(x){return x.cat;});
    }).catch(function(){ ADS=[]; });
  }).then(function(){
    /* RUL-249 + DOOR-EX-LOCAL-1: the example pool -- her own city's house examples first (New York's are in $, London's
       in GBP), Pretoria's only for a city that has none of its own, so no visitor sees another country's examples */
    var exOf=function(L,c){ return (L||[]).filter(function(l){ return l&&l.thumb_url&&l.title&&isEx(l)&&(!c||String(l.city||"").toLowerCase()===c); }); };
    return fetch("/listings?city="+encodeURIComponent(CITY)+"&demo=1&page_size=200&sort=random",{credentials:"same-origin"}).then(j).then(function(L){
      var mine=exOf(L,CITY.toLowerCase());
      if(mine.length) EXOWN=true;
      if(mine.length||GEX.length) return mine;
      return fetch("/listings?city=Pretoria&demo=1&page_size=200&sort=random",{credentials:"same-origin"}).then(j).then(function(P){ return exOf(P,"pretoria"); });
    }).then(function(L){
      EX=shuffle((L||[]).map(function(l){
        var c=CATMAP[String(l.category||"").toLowerCase()]||null;
        return {id:l.id,img:l.medium_url||l.thumb_url,title:l.title,price:EXOWN?money(l.price):"",where:"",cat:c,sub:subOf(l,c),ex:true};   // DOOR-MONEY-1: her own city's examples show their price in her money; another city's never do
      }).filter(function(x){return x.cat;}).concat(genEx()));   // GEN-EX-1: plus the generic set, in her money and her city
    }).catch(function(){ EX=[]; });
  }).then(function(){ laneKey=""; render(); });
}
buildCollage(); buildSlider(); render(); requestAnimationFrame(tick); load();
})();
</script>
