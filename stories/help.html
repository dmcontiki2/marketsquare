<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#061715">
<title>How it works · TrustSquare</title>
<style>
:root{color-scheme:dark;
  --bg:#061715;--panel:#0c2824;--panel2:#0f302b;--line:#155444;--ink:#e7f4ef;--ink2:#9fc4b8;--accent:#16A97C;--bright:#96d8c4;
  --you:#16A97C;--worked:#E0A43A;--regular:#4C9BE8;--customer:#9B7BF0;--gate:#E0A43A;
  --r:16px}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--bright)}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#04120f;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:600 13px inherit;font-family:inherit;background:transparent;color:var(--ink2);border:0;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#04120f}
h1{font-size:28px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--ink2);font-size:15px}
.walked{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--bright);background:rgba(22,169,124,.12);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.who{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.who span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.gate{border:1px solid var(--gate);background:rgba(224,164,58,.1);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.gate b{color:var(--gate)}
.gate[hidden]{display:none}
.trio{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:8px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:inherit;text-align:left;font:inherit;min-width:0}
.side:disabled{opacity:.35;cursor:default}
.side .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.side img{width:100%;height:120px;object-fit:cover;object-position:top;border-radius:8px;display:block;opacity:.8}
.side .t{font-size:12px;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.now{background:var(--panel2);border:2px solid var(--c,var(--accent));border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.now .k{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.now img{width:100%;max-height:58vh;object-fit:cover;object-position:top;border-radius:10px;display:block;border:1px solid var(--line)}
.now h2{font-size:17px;line-height:1.25;margin:0;text-wrap:balance}
.now p{margin:0;font-size:14px;color:var(--ink2)}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.free{background:rgba(22,169,124,.18);color:var(--bright)}
.chip.paid{background:rgba(155,123,240,.2);color:#cdbcfb}
.nav{display:flex;gap:8px}
.nav button{flex:1;font:600 15px inherit;font-family:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.nav button.go{background:var(--accent);border-color:var(--accent);color:#04120f}
.nav button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:10px 0 0}
.chap{font-size:13px;font-weight:700;color:var(--bright);margin:12px 0 4px}
ol.story{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.story button{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px;cursor:pointer}
ol.story button[aria-current="step"]{border-color:var(--bright);background:var(--panel2)}
ol.story .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#04120f;background:var(--c)}
ol.story .tt{font-size:14.5px;font-weight:600;line-height:1.3}
ol.story .gt{display:block;font-size:12px;font-weight:600;color:var(--gate)}
.foot{font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:380px){.trio{grid-template-columns:1fr 2.6fr 1fr}.side .t{font-size:11px}}
@media (prefers-reduced-motion:no-preference){.now{transition:border-color .2s}}
a.back{align-self:flex-start;color:var(--bright);font-size:14px;font-weight:600;text-decoration:none;margin-bottom:-8px}
a.back::before{content:'\2039  '}
.brand span{white-space:nowrap}
.draft{border:1px dashed var(--gate);color:var(--gate);border-radius:12px;padding:8px 12px;font-size:13px}
.draft[hidden]{display:none}
.miss{padding:40px 0;color:var(--ink2)}
q.ui{color:#FFE08A;font-weight:700}
.side .k{overflow-wrap:anywhere;letter-spacing:.03em}   /* HELP-LANG-1: 'Okulandelayo' is longer than 'Next' */
.qnote{margin:0;font-size:12.5px;color:#FFE08A;opacity:.9}
.qnote[hidden]{display:none}
.lang button{padding:6px 9px}
.brand{min-width:0}.brand span{overflow:hidden;text-overflow:ellipsis}
/* HELP-SWAP-1: inside Quick (?embed=1) only the cards -- Quick's own bar is above it */
html.embed body{padding-block:12px 32px}
html.embed .top,html.embed a.back,html.embed #draft,html.embed header,html.embed #who,html.embed #t-foot{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><i>TS</i><span id="t-brand"></span></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-label="English">EN</button><button type="button" data-l="af" aria-label="Afrikaans">AF</button><button type="button" data-l="zu" aria-label="isiZulu">ZU</button><button type="button" data-l="xh" aria-label="isiXhosa">XH</button><button type="button" data-l="nso" aria-label="Sepedi">NSO</button></div></div>
  <a class="back" id="t-back" href="/help/"></a>
  <div class="draft" id="draft" hidden></div>
  <header>
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
    <span class="walked" id="t-walked"></span>
  </header>
  <div class="who" id="who"></div>
  <div class="gate" id="gate" hidden><span aria-hidden="true">◆</span><span id="gate-t"></span></div>
  <p class="qnote" id="qnote" hidden></p>
  <section aria-live="polite">
    <div class="trio">
      <button type="button" class="side" id="prev"></button>
      <div class="now" id="now"></div>
      <button type="button" class="side" id="next"></button>
    </div>
  </section>
  <div class="nav"><button type="button" id="b-prev"></button><button type="button" class="go" id="b-next"></button></div>
  <h3 id="t-whole"></h3>
  <div id="whole"></div>
  <p class="foot" id="t-foot"></p>
</div>
<script>
// HELP-STORIES-1 (29 Sep 2026): one page for every story -- /help/<type> loads /help/data/<type>.json,
// its screens from /help/img/<type>/. Nothing about one listing type lives in this file.
const TYPE = ((location.pathname.match(/^\/help\/([a-z0-9_]+)\/?$/) || [])[1]) || (new URLSearchParams(location.search).get('t') || '').replace(/[^a-z0-9_]/g, '');
let STORY = null, S = [];
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (EMBED) document.documentElement.classList.add('embed');
// HELP-SWAP-1: '#s12' opens step 12; '#at=<Quick screen>&lang=af' (from Quick's How button) opens the step for that screen
function hashArgs(){ const h = (location.hash || '').slice(1), a = {};
  if (/^s\d+$/.test(h)) a.s = +h.slice(1);
  else h.split('&').forEach(kv => { const i = kv.indexOf('='); if (i > 0) a[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  return a; }
function placeFromHash(){ const a = hashArgs();
  if (LANGS.includes(a.lang)) lang = a.lang;
  let i = -1;
  if (a.s) i = S.findIndex(s => s.n === a.s);
  else if (a.at) i = S.findIndex(s => (s.quick || []).includes(a.at));
  if (i >= 0) cur = i; }
const img = k => `/help/img/${TYPE}/${k}.jpg`;
const UI = {
 en:{brand:'How it works',back:'All guides',draft:'Draft: checked by us, not yet linked from the app.',missing:'This guide is not written yet.',sub:n=>`${n} steps. Tap any card to jump there.`,walked:d=>`Checked on the live site, ${d}`,
     who:{you:'You',worked:'Someone you worked for',regular:'Your regulars',customer:'A new customer'},prev:'Previous',next:'Next',now:'Now',step:'Step',of:'of',
     free:'Free',paid:'1T from her, only if you accept',paidCheck:'1T from her, only if real prices are found',paidAccept:'1T from you, once, for your first buyer',whole:'The whole story',gatePre:'Coming up: until someone you worked for confirms you, only people you send your link to can see your listing.',gateHere:'This is the step that opens your listing to new customers.',gateMark:'Opens your listing to new customers',
     quote:'Words in yellow are the buttons you tap, as the app shows them.',
     foot:'Close this page to go back. Your answers in Quick stay where they were.',months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']},
 af:{brand:'Hoe dit werk',back:'Alle gidse',draft:'Konsep: deur ons nagegaan, nog nie in die app gekoppel nie.',missing:'Hierdie gids is nog nie geskryf nie.',sub:n=>`${n} stappe. Tik enige kaart om daarheen te gaan.`,walked:d=>`Nagegaan op die regte webwerf, ${d}`,
     who:{you:'Jy',worked:'Iemand vir wie jy gewerk het',regular:'Jou vaste kliënte',customer:"'n Nuwe kliënt"},prev:'Vorige',next:'Volgende',now:'Nou',step:'Stap',of:'van',
     free:'Gratis',paid:'1T van haar, net as jy aanvaar',paidCheck:'1T van haar, net as regte pryse gevind word',paidAccept:'1T van jou, een keer, vir jou eerste koper',whole:'Die hele storie',gatePre:'Binnekort: totdat iemand vir wie jy gewerk het jou bevestig, kan net mense aan wie jy jou skakel stuur jou advertensie sien.',gateHere:'Dit is die stap wat jou advertensie vir nuwe kliënte oopmaak.',gateMark:'Maak jou advertensie vir nuwe kliënte oop',
     quote:'Woorde in geel is die knoppies wat jy tik, soos die app hulle wys.',
     foot:'Maak hierdie bladsy toe om terug te gaan. Jou antwoorde in Quick bly waar hulle was.',months:['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Des']},
 zu:{brand:'Kusebenza kanjani',back:'Yonke imihlahlandlela',draft:'Okusalungiswa: kuhlolwe yithi, akukaxhunyaniswa ne-app.',missing:'Lo mhlahlandlela awukabhalwa.',sub:n=>`Izinyathelo ezingu-${n}. Thepha noma yiliphi ikhadi ukuya kulo.`,walked:d=>`Kuhlolwe kusayithi langempela, ${d}`,
     who:{you:'Wena',worked:'Umuntu owake wamsebenzela',regular:'Amakhasimende akho ajwayelekile',customer:'Ikhasimende elisha'},prev:'Okwedlule',next:'Okulandelayo',now:'Manje',step:'Isinyathelo',of:'/',
     free:'Mahhala',paid:'1T kuye, kuphela uma wamukela',paidCheck:'1T kuye, kuphela uma kutholakala amanani angempela',paidAccept:'1T kuwe, kanye, yomthengi wakho wokuqala',whole:'Yonke indaba',gatePre:'Kuyeza: kuze kube yilapho umuntu owake wamsebenzela ekuqinisekisa, ngabantu kuphela obathumelela isixhumanisi sakho abangabona isikhangiso sakho.',gateHere:'Yilesi isinyathelo esivulela amakhasimende amasha isikhangiso sakho.',gateMark:'Ivulela amakhasimende amasha isikhangiso sakho',
     quote:'Amagama aphuzi yizinkinobho ozithephayo, njengoba i-app izibonisa ngesiNgisi.',tdraft:'Ukuhumusha okusalungiswa, kusahlolwa ngabafundi.',
     foot:'Vala leli khasi ukuze ubuyele emuva. Izimpendulo zakho ku-Quick zihlala lapho zikhona.',months:['Jan','Feb','Mas','Apr','Mey','Jun','Jul','Aga','Sep','Okt','Nov','Dis']},
 xh:{brand:'Isebenza njani',back:'Zonke izikhokelo',draft:'Idrafti: ihlolwe sithi, ayikaqhagamshelwa kwi-app.',missing:'Esi sikhokelo asikabhalwa.',sub:n=>`Amanyathelo angama-${n}. Cofa naliphi na ikhadi ukuya kulo.`,walked:d=>`Kuhlolwe kwisayithi yokwenyani, ${d}`,
     who:{you:'Wena',worked:'Umntu owakhe wamsebenzela',regular:'Abathengi bakho abaqhelekileyo',customer:'Umthengi omtsha'},prev:'Elidlulileyo',next:'Elilandelayo',now:'Ngoku',step:'Inyathelo',of:'/',
     free:'Simahla',paid:'1T kuye, kuphela ukuba uyamkela',paidCheck:'1T kuye, kuphela ukuba kufunyanwa amaxabiso okwenyani',paidAccept:'1T kuwe, kube kanye, yomthengi wakho wokuqala',whole:'Ibali lonke',gatePre:'Kuyeza: de kube umntu owakhe wamsebenzela akuqinisekise, ngabantu kuphela obathumelela ikhonkco lakho abanokubona intengiso yakho.',gateHere:'Eli linyathelo elivulela abathengi abatsha intengiso yakho.',gateMark:'Ivulela abathengi abatsha intengiso yakho',
     quote:'Amagama amthubi ngamaqhosha owacofayo, njengoko i-app iwabonisa ngesiNgesi.',tdraft:'Uguqulelo oluyidrafti, lusahlolwa ngabafundi.',
     foot:'Vala eli phepha ukuze ubuyele. Iimpendulo zakho kwi-Quick zihlala apho zikhoyo.',months:['Jan','Feb','Mat','Epr','Mey','Jun','Jul','Aga','Sep','Okt','Nov','Dis']},
 nso:{brand:'Ka moo e šomago',back:'Ditlhahli ka moka',draft:'Kakanyo: e hlahlobilwe ke rena, ga e so kgokagane le app.',missing:'Tlhahli ye ga e so ngwalwe.',sub:n=>`Dikgato tše ${n}. Kgotla karata efe goba efe go ya go yona.`,walked:d=>`E hlahlobilwe weposaeteng ya nnete, ${d}`,
     who:{you:'Wena',worked:'Motho yo o kilego wa mo šomela',regular:'Bareki ba gago ba ka mehla',customer:'Moreki yo moswa'},prev:'Pele',next:'Latelago',now:'Bjale',step:'Kgato',of:'/',
     free:'Mahala',paid:'1T go yena, feela ge o amogela',paidCheck:'1T go yena, feela ge go hwetšwa ditheko tša nnete',paidAccept:'1T go wena, gatee, ya moreki wa gago wa mathomo',whole:'Kanegelo ka moka',gatePre:'E a tla: go fihlela motho yo o kilego wa mo šomela a go netefatša, ke batho feela bao o ba romelago kgokagano ya gago bao ba ka bonago papatšo ya gago.',gateHere:'Ye ke kgato ye e bulelago bareki ba bafsa papatšo ya gago.',gateMark:'E bulela bareki ba bafsa papatšo ya gago',
     quote:'Mantšu a serolwane ke dikonopo tšeo o di kgotlago, bjalo ka ge app e di bontšha ka Seisemane.',tdraft:'Phetolelo ya kakanyo, e sa hlahlobja ke babadi.',
     foot:'Tswalela letlakala le go boela morago. Dikarabo tša gago go Quick di dula moo di lego.',months:['Jan','Feb','Mat','Apr','Mei','Jun','Jul','Ago','Set','Okt','Nof','Dis']}

};
let lang = 'en', cur = 0;
// HELP-LANG-1 (29 Sep 2026, David: "lets go with the local languages"): the five languages Quick speaks
const LANGS = ['en', 'af', 'zu', 'xh', 'nso'];
try { const l = localStorage.getItem('ts_help_lang'); if (LANGS.includes(l)) lang = l; } catch (e) {}
const $ = id => document.getElementById(id);
const col = w => `var(--${w})`;
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = o => (o && (o[lang] || o.en)) || '';                       // this language, else English
const rich = t => esc(t).replace(/\[\[(.+?)\]\]/g, '<q class="ui">$1</q>');   // [[Button]] = the app's own words, quoted
const plain = t => String(t).replace(/\[\[|\]\]/g, '');
function day(iso){ const u = UI[lang]; return `${Number(iso.slice(8))} ${u.months.at(Number(iso.slice(5,7)) - 1)} ${iso.slice(0,4)}`; }
// LM-STORY-1: who pays, and when, differs per step -- a buyer's price check, a seller's first accept
function costChip(s){ const u = UI[lang]; if (s.cost === 'free') return `<span class="chip free">${u.free}</span>`;
  return `<span class="chip paid">${s.cost === '1T_check' ? u.paidCheck : s.cost === '1T_accept' ? u.paidAccept : u.paid}</span>`; }
function side(el, s, label){
  if (!s) { el.disabled = true; el.innerHTML = `<span class="k">${label}</span>`; return; }
  el.disabled = false;
  el.innerHTML = `<span class="k">${label}</span><img src="${img(s.img)}" alt=""><span class="t">${rich(L(s)[0])}</span>`;
}
function render(){
  if (!STORY) return;
  const u = UI[lang], s = S[cur];
  document.documentElement.lang = lang;
  $('t-brand').textContent = u.brand; $('t-title').textContent = L(STORY.title); document.title = L(STORY.title) + ' · TrustSquare';
  $('t-back').textContent = u.back; const dr = $('draft'); dr.hidden = STORY.status !== 'draft'; dr.textContent = u.draft; $('t-sub').textContent = u.sub(S.length);
  $('t-walked').textContent = '✓ ' + u.walked(day(STORY.walked_on));
  $('who').innerHTML = Object.entries(u.who).filter(([k]) => S.some(x => x.who === k)).map(([k,v]) => `<span><i class="dot" style="background:${col(k)}"></i>${v}</span>`).join('');
  const gi = S.findIndex(x => x.gate);
  const g = $('gate');
  if (gi >= 0 && cur <= gi) { g.hidden = false; $('gate-t').innerHTML = `<b>${cur === gi ? u.gateHere : (L(STORY.gate_note) || u.gatePre)}</b>`; } else g.hidden = true;
  side($('prev'), S[cur - 1], u.prev); side($('next'), S[cur + 1], u.next);
  const now = $('now'); now.style.setProperty('--c', col(s.who));
  now.innerHTML = `<div class="k"><span>${u.now} · ${u.step} ${s.n} ${u.of} ${S.length}</span>${costChip(s)}</div>
    <span style="font-size:12px;font-weight:700;color:${col(s.who)}">${u.who[s.who]}</span>
    <h2>${rich(L(s)[0])}</h2><p>${rich(L(s)[1])}</p><img src="${img(s.img)}" alt="${esc(plain(L(s)[0]))}">`;
  $('b-prev').textContent = '‹ ' + u.prev; $('b-next').textContent = u.next + ' ›';
  $('b-prev').disabled = cur === 0; $('b-next').disabled = cur === S.length - 1;
  $('t-whole').textContent = u.whole; $('t-foot').textContent = u.foot;
  let html = '';
  STORY.chapters.forEach(ch => {
    const items = S.filter(x => x.ch === ch.id); if (!items.length) return;
    html += `<div class="chap">${esc(L(ch))}</div><ol class="story">` + items.map(x => {
      const i = S.indexOf(x);
      return `<li><button type="button" data-i="${i}" ${i === cur ? 'aria-current="step"' : ''} style="--c:${col(x.who)}"><span class="num">${x.n}</span><span><span class="tt">${rich(L(x)[0])}</span>${x.gate ? `<span class="gt">◆ ${u.gateMark}</span>` : ''}</span>${x.cost === 'free' ? '' : '<span class="chip paid">1T</span>'}</button></li>`;
    }).join('') + '</ol>';
  });
  $('whole').innerHTML = html;
  document.querySelectorAll('ol.story button').forEach(b => b.onclick = () => go(+b.dataset.i, true));
  document.querySelectorAll('.lang [data-l]').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
  const qn = $('qnote'); const qt = [lang === 'en' ? '' : u.quote, (STORY.translations || {})[lang] === 'draft' ? u.tdraft : ''].filter(Boolean).join(' '); qn.hidden = !qt; qn.textContent = qt;
}
function go(i, scroll){ cur = Math.max(0, Math.min(S.length - 1, i)); try { history.replaceState(null, '', '#s' + S[cur].n); } catch (e) {} render(); if (scroll) window.scrollTo({top: 0, behavior: 'smooth'}); }
$('prev').onclick = () => go(cur - 1); $('next').onclick = () => go(cur + 1);
$('b-prev').onclick = () => go(cur - 1); $('b-next').onclick = () => go(cur + 1);
document.querySelectorAll('.lang [data-l]').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('ts_help_lang', lang); } catch (e) {} render(); });
fetch('/help/data/' + TYPE + '.json', {cache: 'no-cache'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    STORY = d; S = STORY.steps.filter(s => s.pass);   // truth only: a step that did not pass on the live site is never shown
    placeFromHash();
    render();
    window.addEventListener('hashchange', () => { if (/^#(at=|lang=)/.test(location.hash)) { placeFromHash(); render(); window.scrollTo(0, 0); } });
  })
  .catch(() => { $('t-brand').textContent = UI[lang].brand; $('t-back').textContent = UI[lang].back; $('t-title').textContent = UI[lang].missing; document.querySelector('section').hidden = true; document.querySelector('.nav').hidden = true; });
</script>
<script src="/static/ts_report.js?v=7" defer></script>   <!-- RG-0377: testers can report a fault from every page -->
</body>
</html>
